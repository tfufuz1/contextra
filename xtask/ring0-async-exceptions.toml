# Allow-list for Ring 0 async runtime dependencies
# These Ring 0 crates currently violate async purity by depending on async runtime crates in [dependencies].
# Refactoring to remove these dependencies is tracked under an upcoming ADR (marked as TODO).

[[exceptions]]
crate = "memfuse-vector"
dependency = "tokio"
reason = "Legacy async usage in vector index background processing; refactoring planned."
adr = "ADR-TODO"

[[exceptions]]
crate = "memfuse-graph"
dependency = "tokio"
reason = "Legacy async usage in graph CSR traversal / background tasks; refactoring planned."
adr = "ADR-TODO"

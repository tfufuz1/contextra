[workspace]

[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = "0.4"
regex = "1"
toml = "0.8"
walkdir = "2"
tempfile = "3"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
contextra-bench = { path = "../benchmarks/contextra-bench" }
contextra-router = { path = "../crates/contextra-router", features = ["bandit-routing"] }
contextra-types = { path = "../crates/contextra-types" }

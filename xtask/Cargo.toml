[lints.clippy]
permissions_set_readonly_false = "allow"
needless_borrows_for_generic_args = "allow"
useless_format = "allow"
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
indexing_slicing = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
exit = "allow"
unreachable = "allow"

[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[package.metadata.contextra]
ring = "tooling"

[dependencies]
chrono = "0.4"
regex = "1"
toml = "0.8"
walkdir = "2"
tempfile = "3"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cargo_metadata = "0.18"
globset = "0.4"

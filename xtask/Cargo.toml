[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(feature, values("onnx"))'] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
cast_sign_loss = "warn"
should_implement_trait = "warn"
collapsible_match = "warn"
# Ausnahmen für nicht überarbeitete Dateien außerhalb des Task-Scopes in xtask
cast_possible_truncation = "allow"
# Ausnahmen für nicht überarbeitete Dateien außerhalb des Task-Scopes in xtask
manual_strip = "allow"
# Ausnahmen für nicht überarbeitete Dateien außerhalb des Task-Scopes in xtask
unnecessary_map_or = "allow"
# Ausnahmen für nicht überarbeitete Dateien außerhalb des Task-Scopes in xtask
match_like_matches_macro = "allow"
# Ausnahmen für nicht überarbeitete Dateien außerhalb des Task-Scopes in xtask
regex_creation_in_loops = "allow"
# Ausnahmen für nicht überarbeitete Dateien außerhalb des Task-Scopes in xtask
needless_borrows_for_generic_args = "allow"
# Ausnahmen für nicht überarbeitete Dateien außerhalb des Task-Scopes in xtask
collapsible_if = "allow"
# Ausnahmen für nicht überarbeitete Dateien außerhalb des Task-Scopes in xtask
useless_vec = "allow"
# Ausnahmen für nicht überarbeitete Dateien außerhalb des Task-Scopes in xtask
useless_format = "allow"

[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[package.metadata.contextra]
ring = "tooling"

[dependencies]
chrono = "0.4"
regex = "1"
toml = "0.8"
walkdir = "2"
tempfile = "3"
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
contextra-types = { path = "../crates/contextra-types" }

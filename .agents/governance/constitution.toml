[[evidence_level]]
id = "E0"
title = "E0"
meaning = "Behauptung (Bericht, Agentenaussage, Dokument)"
allowed_statement = "Ziel, Hypothese"

[[evidence_level]]
id = "E1"
title = "E1"
meaning = "Am Code gelesen (Datei:Zeile, Review)"
allowed_statement = "im Code vorhanden/abwesend"

[[evidence_level]]
id = "E2"
title = "E2"
meaning = "Gate-/Skriptlauf auf bekanntem Commit, Protokoll archiviert"
allowed_statement = "Gate grün/rot auf Commit X"

[[evidence_level]]
id = "E3"
title = "E3"
meaning = "Test- oder Chaos-Lauf reproduzierbar auf unabhängigem Runner"
allowed_statement = "Verhalten belegt"

[[evidence_level]]
id = "E4"
title = "E4"
meaning = "E3 plus unabhängiges Orakel (§27.8), Mutation-Wirksamkeit und externer Review"
allowed_statement = "Garantie belegt"


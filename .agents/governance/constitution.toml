# Contextra Maschinenlesbare Verfassungsdatei (Constitution)
#
# Referenzdokumente:
# - Spezifikation (Fassung 1.3): docs/CONTEXTRA_SPEZIFIKATION.md
# - Implementierungsplan: docs/CONTEXTRA_IMPLEMENTIERUNGSPLAN.md
# - Meta-Plan: docs/CONTEXTRA_META_PLAN.md
#
# Entwurfsentscheidungen & Abweichungen:
# 1. Single-Node-Doktrin (§4.1): ID "VETO-SINGLE-NODE" gewählt als kanonische Veto-ID.
# 2. Prinzipien (§5): In Spec §5 sind explizit die 9 Prinzip-IDs P1, P2, P5, P7, P24, P26, P28, P29, P30 definiert.
#    Die in Dokument C erwähnte Spanne "P1–P30" ist ungenau. Es wurden keine fehlenden Prinzip-IDs erfunden.
# 3. Anforderungskatalog (§33): Alle 167 mechanisch ableitbaren Anforderungen aus §33 sind als [[requirement]] aufgenommen.

[project]
spec_version = "1.3"
spec_path = "docs/CONTEXTRA_SPEZIFIKATION.md"
plan_path = "docs/CONTEXTRA_IMPLEMENTIERUNGSPLAN.md"
meta_plan_path = "docs/CONTEXTRA_META_PLAN.md"

[[principle]]
id = "P1"
class = "K"
title = "Ring-Disziplin"

[[principle]]
id = "P2"
class = "K"
title = "Unsafe nur in drei Inseln (simd, sys, wire) im eigenen Code; jeder handgeschriebene unsafe-Block trägt // SAFETY"

[[principle]]
id = "P5"
class = "K"
title = "DAG-Integrität"

[[principle]]
id = "P7"
class = "K"
title = "Zero-Panic im Produktionscode (unwrap/expect/panic!/todo!/unimplemented!/unreachable!, zusätzlich assert!, process"

[[principle]]
id = "P24"
class = "K"
title = "Aller Anwendungszustand (Dokumente, Metadaten, Indexabsichten, Lineage, Retention-Entscheidungen) geht durch das WAL; kein Seitenpfad schreibt ihn. Die einzigen zulässigen weiteren persistenten Zustände sind die in §7.11 abschließend aufgezählten Sidecar-Logs (Schlüssel, Widerruf, Audit, Löschjournal, Löschmenge); jede andere Persistenz ist ein Gate-Fehler (INV-SIDECAR-1)."

[[principle]]
id = "P26"
class = "K"
title = "Sync-Kern, Async-Schale"

[[principle]]
id = "P28"
class = "K"
title = "Determinismus"

[[principle]]
id = "P29"
class = "K"
title = "Wired-or-it-doesn't-exist (§3)."

[[principle]]
id = "P30"
class = "K"
title = "Kern-Isolation"


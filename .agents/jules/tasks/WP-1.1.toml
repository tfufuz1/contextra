id          = "WP-1.1"
title       = "Rückbau: Graph-Verweise, AutoExtractionMode, Ports embedding/reranker/query_rewriter"
wp          = "WP-1.1"
gate        = "B"
crate       = "contextra-engine, contextra-store, contextra-types, contextra-ports"
goal        = "Null Treffer für `contextra_graph` und `contextra-graph` in allen Quell- und Build-Dateien, die dieses Paket verantwortet. Keine Referenz auf `AutoExtractionMode`. Die Ports `embedding`, `reranker`, `query_rewriter` sind aus `contextra-ports` entfernt, soweit sie nicht über die Fassade `contextra` gebraucht werden."

non_goals = [
  "Kein Fassaden-Schnitt (WP-1.5, D-89). Ist ein Port nur über `contextra` erreichbar, bleibt er bis WP-1.5 bestehen.",
  "Keine Änderung an Löschlogik, Verschlüsselung oder WAL.",
  "Keine Umbenennung von Modulen (WP-1.5).",
]

scope = [
  "crates/contextra-engine/src/**",
  "crates/contextra-engine/tests/**",
  "crates/contextra-store/src/**",
  "crates/contextra-types/src/**",
  "crates/contextra-ports/src/**",

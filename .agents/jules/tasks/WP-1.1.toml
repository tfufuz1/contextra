# Ausgangslage (vom Agenten neu zu zählen):
#   - 73 Vorkommen von contextra_graph / contextra-graph in ca. 27 Dateien.
#   - Außerhalb des Pakets, nur zu melden, nicht zu ändern (geschützt):
#       .github/copilot-instructions.md, .github/workflows/proof-correctness.yml,
#       .github/workflows/tsan.yml, .github/workflows/rust-ci.yml,
#       .github/workflows/scheduled-audit.yml, deny.toml

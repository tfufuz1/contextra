# Aufgabenkarte – WP-4.4 ctx-verify
# Nicht normativ. Maßgeblich ist SPEC 15.4 für Inhalt und SPEC 15.3 für das Gate.

id          = "WP-4.4"
title       = "ctx-verify eigenständiger Berichts- und Feldprüfer (Gate D)"
wp          = "WP-4.4"
gate        = "D"
crate       = "ctx-verify"
goal        = "Eigenständige CLI-Binärdatei und Crate zur offline-Prüfung von signierten Löschberichten und Feldscans nach Anhang F und SPEC 8.17."
non_goals   = ["Keine Abhängigkeit von Produktions-Crates (AR-4)", "Keine Netzwerkzugriffe (HR-1, T-ARCH-4)"]

scope       = ["crates/ctx-verify/**"]

forbidden   = [
  "AGENTS.md",
  "docs/SPEC.md",
  "rust-toolchain.toml",
  "deny.toml",
  "justfile",
  "capabilities.toml",
  "CODEOWNERS",
  ".github/**",
  "governance/**",
  ".agents/governance/**",
  ".agents/jules/setup/**",
]

spec_ids    = ["SPEC 8.17", "11.7", "12.1", "12.2", "12.3", "12.4", "Anhang D", "F.9", "F.10", "D-48", "D-72", "E-L8", "P1", "P13", "HR-4", "T-REPORT-1", "T-PROOF-1"]

acceptance  = [
  "cargo fmt --all -- --check",
  "cargo test -p ctx-verify --locked",
  "cargo clippy -p ctx-verify --all-targets -- -D warnings",
]

evidence_required = ["Neuer Test mit SPEC-ID, zuerst rot, dann grün"]

[budget]
files      = 12
lines      = 1200
iterations = 6

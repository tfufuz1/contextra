]

forbidden = [
  "AGENTS.md",
  "docs/SPEC.md",
  "rust-toolchain.toml",
  "deny.toml",
  "justfile",
  "capabilities.toml",
  "CODEOWNERS",
  ".github/**",
  "governance/**",
  ".agents/governance/**",
  ".agents/jules/setup/**",
]

spec_ids = ["D-56", "D-63", "D-64", "SY-07", "SY-08", "SY-09", "T-PLAT-1", "T-DUMP-1", "T-SEC-2", "T-OPS-2"]

acceptance = [
  "cargo test -p contextra-sys --locked",
  "cargo clippy -p contextra-sys --all-targets -- -D warnings",
]


# Aufgabenkarte WP-5.2 – Plattformprobe & Prozesshärtung (Teil contextra-sys)
# Nicht normativ. Quelle: SPEC 15.4 (WP-5.2), D-56, D-63, D-64, SY-07, SY-08, SY-09.

id          = "WP-5.2"
title       = "Plattformprobe, Prozesshärtung und Dateiberechtigungen in contextra-sys"
wp          = "WP-5.2"
gate        = "G-F"
crate       = "contextra-sys"

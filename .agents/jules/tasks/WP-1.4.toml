# Aufgabenkarte WP-1.4 – Durability & SyncFailure (Teil contextra-sys)
# Nicht normativ. Quelle: SPEC 15.4 (WP-1.4), D-55, D-56, SY-05, SY-06.

id          = "WP-1.4"
title       = "Durability-Primitive und SyncFailure-Fehlerfortpflanzung in contextra-sys"
wp          = "WP-1.4"
gate        = "B"
crate       = "contextra-sys"
goal        = "flush_file, flush_dir, rename_durable liefern SyncFailure; macOS nutzt F_FULLFSYNC; kein Retry in sys."

non_goals = [
  "Keine Vfs-Umstellung in contextra-store oder contextra-vector.",
]

scope = [
  "crates/contextra-sys/src/durability.rs",
  "crates/contextra-sys/src/error.rs",
  "crates/contextra-sys/tests/**",
]

forbidden = [
  "AGENTS.md",
  "docs/SPEC.md",
  "rust-toolchain.toml",
  "deny.toml",
  "justfile",
  "capabilities.toml",
  "CODEOWNERS",
  ".github/**",
  "governance/**",
  ".agents/governance/**",
  ".agents/jules/setup/**",
]

spec_ids = ["D-55", "D-56", "SY-05", "SY-06", "T-FSYNC-1"]

acceptance = [
  "cargo test -p contextra-sys --locked",
  "cargo clippy -p contextra-sys --all-targets -- -D warnings",
]

evidence_required = [
  "T-FSYNC-1 Nachweis: Fehler werden unverändert als SyncFailure gemeldet.",
]

[budget]
files      = 4
lines      = 200
iterations = 5

# Required and optional tools configuration for env-attest

[[tool]]
name = "git"
version_cmd = ["git", "--version"]
required = true

[[tool]]
name = "rg"
version_cmd = ["rg", "--version"]
required = true

[[tool]]
name = "jq"
version_cmd = ["jq", "--version"]
required = true

[[tool]]
name = "flatc"
version_cmd = ["flatc", "--version"]
required = false

[[tool]]
name = "ast-grep"
version_cmd = ["ast-grep", "--version"]
required = false

[[tool]]
name = "cargo-nextest"
version_cmd = ["cargo", "nextest", "--version"]
required = false

[[tool]]
name = "cargo-deny"
version_cmd = ["cargo", "deny", "--version"]
required = false

[[tool]]
name = "cargo-audit"
version_cmd = ["cargo", "audit", "--version"]
required = false

[[tool]]
name = "cargo-public-api"
version_cmd = ["cargo", "public-api", "--version"]
required = false

[[tool]]
name = "cargo-mutants"
version_cmd = ["cargo", "mutants", "--version"]
required = false

[[tool]]
name = "cargo-semver-checks"
version_cmd = ["cargo", "semver-checks", "--version"]
required = false

[[tool]]
name = "cargo-fuzz"
version_cmd = ["cargo", "fuzz", "--version"]
required = false

# Komponenten-Fokus-Notizen (redaktionell, per Datei)
[component_focus."contextra-core"."lib.rs"]
desc = "Modulstruktur, pub-Exports, Re-Exports der Kern-Traits"
focus = "Prüfe bei jeder Änderung, ob neue pub-Exports das DAG-Prinzip verletzen (contextra-core darf keine contextra-*-Abhängigkeit referenzieren)."

[component_focus."contextra-core"."error.rs"]
risk = "FFI"
desc = "ContextraError-Enum + serialisierbares FFI-DTO-Mapping"
focus = "JEDE ContextraError-Variante muss eine korrespondierende ContextraErrorDto-Variante besitzen — fehlende Zuordnung bricht contextra-py und contextra-mcp stillschweigend an der FFI-Grenze."

[component_focus."contextra-types"."lib.rs"]
risk = "TxId"
desc = "Kanonische Domain-Typen (DocId, TxId, TenantId, EntityId, Embedding, FilterExpr, TokenBudget)"
focus = "Niemals SystemTime für TxId verwenden. Ring 0 Synchronisationspurity wahren."

[component_focus."contextra-ports"."lib.rs"]
risk = "Ports"
desc = "Dyn-kompatible Non-Determinismus-Ports (Clock, Rng, IdGen)"
focus = "Clock, Rng und IdGen sind synchron und Dyn-kompatibel. ManualClock in contextra-testkit zur deterministischen Zeitsteuerung nutzen."

[component_focus."contextra-mvcc"."seq_log.rs"]
risk = "MVCC"
desc = "24-Byte Sequential Versioned Log (DocId + insert_seq + delete_seq)"
focus = "Sichtbarkeitsinvariante (insert_seq <= as_of && (delete_seq.is_none() || delete_seq > as_of)) muss lückenlos gelten."

[component_focus."contextra-privacy"."crypto.rs"]
risk = "RFC 8452/5869/4231"
desc = "KeyManager — AES-256-GCM-SIV encrypt/decrypt + Nonce-Konstruktion, HKDF Key Derivation, HMAC-SHA256"
focus = "Nonce = 4B Instanz-Präfix + 8B per-Call OsRng-Suffix. Constant-Time comparisons via subtle::ConstantTimeEq erzwungen."

[component_focus."contextra-privacy"."wal_crypto.rs"]
risk = "HMAC-Chain"
desc = "WAL-HMAC-Chaining v3 — kryptographische Integritätskette über das gesamte WAL"
focus = "Byte-Reihenfolge ist bindend: domain-separator → prev_hmac → seq_no → tx_id → op_type+kv."

[component_focus."contextra-privacy"."deletion_proof.rs"]
risk = "sec"
desc = "DSGVO Art. 17 DeletionProof & LayerCleanupProof"
focus = "INV-DELETION-1: LayerCleanupProof::new_after_verified_empty fordert physical remaining_live_entries == 0."

[component_focus."contextra-store"."wal.rs"]
risk = "Crash-Safety"
desc = "Write-Ahead-Log — fsync-Disziplin, HMAC-Bindung, Group-Commit Scope Reduction"
focus = "commit_mutex vor disk I/O droppen und danach re-acquirieren. sync_all() vor Ok-Return erzwungen."

[component_focus."contextra-store"."lsm.rs"]
risk = "Locking"
desc = "LsmStorage — StorageEngine-Trait-Implementierung, put_if_absent intent_locks, rollback_to_tx"
focus = "put_if_absent nutzt intent_locks zur Vermeidung von TOCTOU-Races. Group-Commit Leader verringert Contention."

[component_focus."contextra-vector"."hnsw.rs"]
risk = "APM-2/3"
desc = "HNSW-Graph-Kern — Suche, Insert, Tombstone-Handling, SQ8-Bound-Expansion"
focus = "search_filtered(): deleted_snapshot read lock vor candidate traversal hoisten zur Deadlock-Vermeidung."

[component_focus."contextra-vector"."distance.rs"]
risk = "SIMD/unsafe"
desc = "SIMD-Distanzfunktionen (AVX2/NEON)"
focus = "JEDER unsafe-Block muss von is_x86_feature_detected!(\"avx2\") umschlossen sein."

[component_focus."contextra-graph"."csr.rs"]
risk = "Invariante/DoS"
desc = "CSR-Graph-Kern — offsets/reverse_map, bitemporal traversal, cascade_invalidate_hyperedges"
focus = "Traverse_at_bitemporal trennt transaction time (tx_valid_from/to) und business validity time."

[component_focus."contextra-rank"."fusion.rs"]
risk = "APM-5"
desc = "4-Signal Search Fusion (Vector, Text, Graph, Recency/Bandit), RRF Metadata Merge Priority"
focus = "First-Wins metadata merging mit konfigurierbarer Priority (VectorFirst default). Score Calibration via Isotonic/Platt."

[component_focus."contextra-adapt"."pid.rs"]
risk = "calib"
desc = "Adaptive PID Pool Sizing & LinUCB Contextual Bandit"
focus = "Rerank PID Controller hält Recall Floor k_min >= 50 ein."

[component_focus."contextra-db"."collection/crud.rs"]
risk = "CRUD"
desc = "Collection CRUD & physical deletion proof scans"
focus = "HARD_SCAN_CEILING = 100_000 als absolute Obergrenze. Post-commit scan_prefix re-scans verifizieren Emptiness für DSGVO deletion proofs."

[component_focus."contextra-db"."collection/search.rs"]
risk = "Snapshot"
desc = "hybrid_search() — Orchestrierung aller 4 Signale"
focus = "Post-RRF Supersedes Displacement filtering mit include_superseded option."

[component_focus."contextra-cognition"."memory_consolidation.rs"]
risk = "P1-Pass-Separation"
desc = "Structural Consolidation Pass (run_structural_synthesis_pass) — LLM-frei"
focus = "Pass Separation Invariant (P1): Strikt ZERO dependencies on memfuse-graph/contextra-graph und ZERO LLM API calls."

[component_focus."contextra-cognition"."synthesis_phase.rs"]
risk = "LLM-Synthesis"
desc = "Generative Synthesis Pass (run_synthesis_pass) — LLM-basiert"
focus = "Generativer Pass zur Erzeugung synthetischer Chunks mit Provenance-Kennzeichnung."

[component_focus."contextra-engine"."transaction/mod.rs"]
risk = "2PC"
desc = "Submodule directory re-exporting transaction modules (cleanup, compensating_actions, intent, db_transaction)"
focus = "Byte-identical public API surface. 2PC transaction coordination."

[component_focus."contextra-infer-onnx"."reranker.rs"]
risk = "Feature-Gate"
desc = "ONNX CrossEncoder Reranker & OnnxSessionPool"
focus = "#![deny(unsafe_code)] in production code, pure Rust default build, gating ort/tokenizers behind 'onnx' feature."

[component_focus."contextra-infer-candle"."inference.rs"]
risk = "candle"
desc = "Candle ML Inferenz Backend & KvBridgeAdapter"
focus = "#![forbid(unsafe_code)] at crate root. Native Candle GGUF ML inference backend."

[component_focus."contextra-infer-ollama"."client.rs"]
risk = "inj"
desc = "Ollama Client & XML Special Character Escaping"
focus = "build_rag_prompt escapes XML special characters (<, >, &, \", '). Static regex helpers use OnceLock."

[component_focus."contextra-router"."router.rs"]
risk = "nan"
desc = "SLM Router Engine & recalibrate_conformal"
focus = "Rejects non-finite query embeddings (!v.is_finite()). Recalibrate_conformal requires window_total >= 30."

[component_focus."contextra-agent"."engine.rs"]
risk = "APM-4"
desc = "State Machine & TokenBudget RAII Reservation"
focus = "Budget-Check vor Tool-Execution. Reservation guarantees atomic refunds on Drop unless settled."

[component_focus."contextra-mcp"."lib.rs"]
risk = "proto"
desc = "stdio JSON-RPC 2.0 Server & McpSandbox"
focus = "ADR-010 stdio transport only. read_line_bounded enforced by MAX_RPC_BYTES = 16MB. SLM dispatch directly executes binary without shell."

[component_focus."contextra-py"."lib.rs"]
risk = "ffi"
desc = "PyO3 Standalone Workspace Bindings"
focus = "ADR-064 workspace isolation. Standalone [workspace] in crates/contextra-py/Cargo.toml."

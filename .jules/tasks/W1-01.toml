evidence_required = ["Roter Lauf des bestehenden Tests vor dem Fix (Meldung zitieren), grüner Lauf danach", "Neue Tests für N>=4, Tombstone in der Mitte, Grenzfall raw_seq == min_snapshot_seq, Merge-Fehler mitten in der Kette"]


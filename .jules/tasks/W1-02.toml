acceptance = [
  "cargo test -p contextra-crypto --test revocation_log_hardening",
  "cargo test -p contextra-crypto revocation",
  "cargo test -p contextra-crypto",
  "cargo clippy -p contextra-crypto --all-targets -- -D warnings",
  "cargo xtask jules check"
]

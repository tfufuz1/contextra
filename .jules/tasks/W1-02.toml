id        = "T-2026-9102"
title     = "RevocationLog: inkrementelle Verifikation, Persist-before-Mutate, signierter Marker"
crate     = "contextra-crypto"
tier      = 1
risk      = "sec"
goal      = "RevocationLog::append mutiert den RAM-Zustand erst nach erfolgreicher Persistenz; verify_integrity ist amortisiert O(neue Einträge); der Marker ist signiert; das On-Disk-Format der Einträge bleibt kompatibel."
non_goals = ["Kein append-only-Dateiformat (braucht ADR)", "Keine Änderung von Entry-Hash oder Signaturschema", "Keine Änderung in kv_shredding.rs oder kv_cipher.rs", "Kein externer Rollback-Anker"]
scope     = [
  "crates/contextra-crypto/src/revocation_log.rs",
  "crates/contextra-crypto/src/kv_segment/store.rs",
  "crates/contextra-crypto/src/wal_crypto.rs",
  "crates/contextra-crypto/tests/revocation_log_hardening.rs",
  "crates/contextra-crypto/tests/campaign_j26_hypotheses.rs",
  ".jules/tasks/W1-02.toml"
]
forbidden = [".github/**", "xtask/**", "capabilities.toml", "AGENTS.md", "rust-toolchain.toml", "deny.toml", ".jules/setup/**", "governance/**"]

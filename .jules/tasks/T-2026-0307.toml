id                = "T-2026-0307"
title             = "P7: MCP IPC Transportschicht, Primary Lock & CLI-Werkzeuge"
crate             = "contextra-mcp"
tier              = 1
risk              = "sec"
goal              = "P7 Implementation: IPC Transport (Unix Socket / Named Pipe), Primary Lock Detection, Peer Credentials Check, Proxy StdIO <-> IPC, CLI commands (init, doctor, verify-proof, confirm), and INV-STDOUT-1 enforcement."
non_goals         = ["No HTTP / Axum server", "No server.rs modification (P8 domain)", "No DB schema or migration wiring for migrate command"]
scope             = [
  "crates/contextra-mcp/Cargo.toml",
  "crates/contextra-mcp/src/lib.rs",
  "crates/contextra-mcp/src/bin/**",
  "crates/contextra-mcp/src/config.rs",
  "crates/contextra-mcp/src/io.rs",
  "crates/contextra-mcp/src/protocol.rs",
  "crates/contextra-mcp/src/ipc/**",
  "crates/contextra-mcp/src/cli/**",
  "crates/contextra-mcp/tests/ipc_*.rs",
  "crates/contextra-mcp/tests/cli_*.rs",
  ".jules/tasks/T-2026-0307.toml"
]
forbidden         = [
  ".github/**",
  "xtask/**",
  "justfile",
  "capabilities.toml",
  "governance/**",
  "AGENTS.md",
  "rust-toolchain.toml",
  "deny.toml",
  ".jules/setup/**"
]
invariants        = [
  "INV-IPC-1",
  "INV-STDOUT-1",
  "INV-LOG-1",
  "Fail-Closed",
  "Zero-Panic"
]
acceptance        = [
  "cargo test -p contextra-mcp --test 'ipc_*' --test 'cli_*'",
  "cargo clippy -p contextra-mcp --all-targets -- -D warnings",
  "cargo fmt -p contextra-mcp"
]
evidence_required = ["ipc and cli tests pass", "clippy & fmt clean", "mutants-diff and fuzz-smoke executed"]

[budget]
files      = 25
lines      = 1000
iterations = 12

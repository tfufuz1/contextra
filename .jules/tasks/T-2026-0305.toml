id        = "T-2026-0305"
title     = "MCP Server Session Tenant Hardening"
crate     = "contextra-mcp"
tier      = 1
risk      = "sec"
goal      = "Enforce immutable session tenant in contextra-mcp server and remove fallback to TenantId::SYSTEM or request args."
non_goals = ["Modifications to contextra-types, contextra-engine or contextra facade"]
scope     = ["crates/contextra-mcp/**", ".jules/tasks/T-2026-0305.toml"]
forbidden = [
  "crates/contextra-types/**", "crates/contextra-engine/**", "crates/contextra/**",
  ".github/**", "xtask/**", "justfile", "capabilities.toml", "governance/**",
  "AGENTS.md", "rust-toolchain.toml", "deny.toml", ".jules/setup/**",
  "Cargo.toml", "docs/TYPE_REGISTRY.md", "docs/CHANGELOG.md",
  "WORKING_STATE.md", "docs/generated/**"
]
invariants = ["INV-TENANT-1", "INV-MCP-CLASSIFY-1", "Fail-closed", "Zero-Panic", "VETO-F10"]
acceptance = [
  "cargo test --locked -p contextra-mcp",
  "cargo xtask jules check",
  "cargo xtask jules verify"
]
evidence_required = [
  "Red-to-green test: start without tenant fails",
  "Red-to-green test: start with tenant 0 fails",
  "Red-to-green test: request with foreign tenant arg is rejected",
  "Red-to-green test: two-tenant isolation test"
]

[budget]
files = 15
lines = 800
iterations = 12

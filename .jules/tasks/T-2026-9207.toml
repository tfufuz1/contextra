# Task-Karte Template
# ID Format: T-YYYY-NNNN
id        = "T-2026-9207"
title     = "Scope-Fence"
crate     = "contextra-store"
tier      = 1            # 1, 2, 3 (muss zu prompter-tiers.toml passen)
risk      = "concurrency"       # sec | crash | simd | utf8 | fusion | concurrency | calib | none
goal      = "Löschung blockiert nur den betroffenen Scope, nicht die ganze Datenbank, und liefert die Schreibsequenz"

scope     = [
  "crates/contextra-store/src/lsm/fence.rs",
  "crates/contextra-store/src/lsm/ops/write.rs",
  "crates/contextra-store/tests/erasure_fence_scope.rs",
  "crates/contextra-store/tests/erasure_fence_loom.rs",
  ".jules/tasks/T-2026-9207.toml"
]
forbidden = [".github/**", "xtask/**", "capabilities.toml", "AGENTS.md", "rust-toolchain.toml", "deny.toml", ".jules/setup/**"]
invariants = ["Zero-Panic", "Single Error Root"]
acceptance = [
  "cargo test -p contextra-store --test erasure_fence_scope",
  "cargo xtask loom-run",
  "cargo test -p contextra-store",
  "cargo clippy -p contextra-store --all-targets -- -D warnings"
]
evidence_required = ["Neuer Test, der die Funktionalität absichert"]

[budget]

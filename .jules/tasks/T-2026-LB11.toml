id = "T-2026-LB11"
title = "Kopien als Geltungsbereich: CopyRegistry, Hardlinks, Observer (Feld 7)"
crate = "contextra-checkpoint"
tier = 1
risk = "high"
goal = "Implement CopyStatus enum, extend CpyCopyRegistry, enforce registration before hardlinking, and report per-copy statuses in DpiCopyObserver Report."
non_goals = ["Modifying Cargo.toml or lockfiles", "Altering core engine deletion or crypto crates outside workspace boundary"]

scope = [
    "crates/contextra-checkpoint/src/copy_registry.rs",
    "crates/contextra-checkpoint/src/hardlink_cloner.rs",
    "crates/contextra-engine/src/deletion/copy_observer.rs",
    "crates/contextra-checkpoint/tests/copy_scope_status.rs",
    ".jules/tasks/T-2026-LB11.toml"
]

forbidden = [
    ".github/**",
    "xtask/**",
    "AGENTS.md",
    "Cargo.toml",
    "Cargo.lock",
    "capabilities.toml",
    "rust-toolchain.toml",
    "deny.toml",
    ".jules/setup/**",
    "governance/**"
]

invariants = [
    "Zero-panic guarantees (no unwrap/expect/panic in production code)",
    "Fail-closed on unhandled copy statuses",
    "Hardlinks must never be created on disk without prior persistent copy registry record"
]

acceptance = [
    "cargo test -p contextra-checkpoint --test copy_scope_status",
    "cargo xtask doctrine-scan",
    "cargo xtask check-result-dropped-io",
    "cargo xtask fast-diff-lint"
]

evidence_required = [
    "Unit and integration tests verifying hardlink registration failure aborts link creation",
    "Observer report containing explicit CopyStatus per copy rather than count-only metrics"
]

[budget]
files = 25
lines = 1000
iterations = 12

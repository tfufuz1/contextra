id        = "T-2026-9206"
title     = "Purge-Orchestrator Kern"
crate     = "contextra-store"
tier      = 1
risk      = "crash"
goal      = "Purge-Orchestrator zu einem crashsicheren Zustandsautomaten machen (Spezifikation C5.1/C5.6)"
non_goals = ["Keine echte Compaction/A05", "Keine A07-Fence-Umstellung"]
scope     = [
  "crates/contextra-store/src/lsm/purge/**",
  "crates/contextra-durable-fs/src/**",
  "crates/contextra-store/tests/**",
  "crates/contextra-durable-fs/tests/**"
]
forbidden = [".github/**", "xtask/**", "capabilities.toml", "AGENTS.md", "rust-toolchain.toml", "deny.toml", ".jules/setup/**"]
invariants = ["Zero-Panic", "Crash-Consistency"]
acceptance = [
  "cargo test -p contextra-store --features fault-injection --test purge_orchestrator_failpoints",
  "cargo test -p contextra-store",
  "cargo test -p contextra-durable-fs",
  "cargo clippy -p contextra-store -p contextra-durable-fs --all-targets -- -D warnings",
  "cargo xtask check-result-dropped-io",
  "cargo xtask wal-replay-verify"
]
evidence_required = ["Tests for failpoints and resume"]

[budget]
files = 16
lines = 1000
iterations = 12

# Security-Relevant Port Registration (§22 Punkt 4 / INV-WIRING-2)
# Mandatory security ports used for wiring self-test and verification.

[security_ports]

[security_ports.Clock]
description = "Deterministic monotonic clock source for audit timestamps, token TTL, and eviction timing."
mandatory = true

[security_ports.Rng]
description = "Secure entropy and seeded pseudorandom number generator for nonce generation and data masking."
mandatory = true

[security_ports.IdGen]
description = "Unique ID generator for trace IDs, transaction IDs, and entity identifiers."
mandatory = true

[security_ports.LicenseGate]
description = "Feature ring activation gate for enforcing license and authorization boundaries."
mandatory = true

[security_ports.LayerScan]
description = "Storage layer scanning port for verifying deletion proofs and physical residue."
mandatory = true

[security_ports.ErasureHooks]
description = "Erasure event lifecycle hooks for deletion proof generation and ledger logging."
mandatory = true

[security_ports.TsaSignatureVerifier]
description = "Timestamp authority signature verifier for audit trail integrity."
mandatory = true

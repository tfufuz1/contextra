[workspace]
resolver = "2"
members = [
    "crates/contextra-wire",
    "crates/contextra-sys",
    "crates/contextra-simd",
    "crates/contextra-core",
    "crates/contextra-store",
    "crates/contextra-vector",
    "crates/contextra-db",
    "crates/contextra-text",
    "crates/contextra-checkpoint",
    "crates/contextra-crypto",
    "crates/contextra-privacy",
    "crates/contextra-graph",
    "crates/contextra-infer-onnx",
    "crates/contextra-mcp",
    "crates/contextra-agent",
    "crates/contextra-infer-ollama",
    "crates/contextra-router",
    "benchmarks/contextra-bench",
    "crates/contextra-infer-candle",
    "crates/contextra-sandbox",
    "crates/contextra-py",
    "crates/contextra-testkit",
    "crates/contextra",
    "crates/contextra-types",
    "crates/contextra-ports",
    "crates/contextra-mvcc",
    "crates/contextra-adapt",
    "crates/contextra-kvcache",
    "crates/contextra-engine",
    "crates/contextra-cognition",
    "crates/contextra-rank",
    "crates/contextra-audit-export",
]
exclude = ["xtask"]
default-members = [
    "crates/contextra-wire",
    "crates/contextra-sys",
    "crates/contextra-simd",
    "crates/contextra-core",
    "crates/contextra-store",
    "crates/contextra-vector",
    "crates/contextra-db",
    "crates/contextra-text",
    "crates/contextra-checkpoint",
    "crates/contextra-crypto",
    "crates/contextra-privacy",
    "crates/contextra-graph",
    "crates/contextra-mcp",
    "crates/contextra-agent",
    "crates/contextra-infer-ollama",
    "crates/contextra-router",
    "crates/contextra-infer-candle",
    "crates/contextra-sandbox",
    "crates/contextra-py",
    "crates/contextra-testkit",
    "crates/contextra",
    "crates/contextra-types",
    "crates/contextra-ports",
    "crates/contextra-mvcc",
    "crates/contextra-adapt",
    "crates/contextra-kvcache",
    "crates/contextra-engine",
    "crates/contextra-cognition",
    "crates/contextra-rank",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
# Error handling
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bincode = "1.3.3"
flatbuffers = "24.3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Data structures
bytes = "1"
memmap2 = "0.9.11"
ahash = { version = "0.8", features = ["serde"] }
itoa = "1"
parking_lot = "0.12"
roaring = "0.10"
regex = "1"

# Crypto & hashing
blake3 = "1"
crc32fast = "1.3"

# Concurrency
rand = "0.8"

# Observability
tracing = "0.1"

# Testing
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Workspace crates
contextra-wire = { path = "crates/contextra-wire" }
contextra-sys = { path = "crates/contextra-sys" }
contextra-simd = { path = "crates/contextra-simd" }
contextra-core = { path = "crates/contextra-core" }
contextra-store = { path = "crates/contextra-store" }
contextra-vector = { path = "crates/contextra-vector" }
contextra-index = { package = "contextra-vector", path = "crates/contextra-vector" } # <!-- crate-ref-ignore -->
contextra-db = { path = "crates/contextra-db" }
contextra-text = { path = "crates/contextra-text" }
contextra-checkpoint = { path = "crates/contextra-checkpoint" }
contextra-crypto = { path = "crates/contextra-crypto" }
contextra-privacy = { path = "crates/contextra-privacy" }
contextra-graph = { path = "crates/contextra-graph" }
contextra-infer-onnx = { path = "crates/contextra-infer-onnx" }
contextra-embed = { package = "contextra-infer-onnx", path = "crates/contextra-infer-onnx" } # <!-- crate-ref-ignore -->
contextra-mcp   = { path = "crates/contextra-mcp" }
contextra-agent = { path = "crates/contextra-agent" }
contextra-infer-ollama = { path = "crates/contextra-infer-ollama" }
contextra-ollama = { package = "contextra-infer-ollama", path = "crates/contextra-infer-ollama" } # <!-- crate-ref-ignore -->
contextra-router = { path = "crates/contextra-router" }
contextra-infer-candle = { path = "crates/contextra-infer-candle" }
contextra-candle = { package = "contextra-infer-candle", path = "crates/contextra-infer-candle" } # <!-- crate-ref-ignore -->
contextra-sandbox = { path = "crates/contextra-sandbox" }
contextra-py = { path = "crates/contextra-py" }
contextra-testkit = { path = "crates/contextra-testkit" }
contextra = { path = "crates/contextra" }
contextra-types = { path = "crates/contextra-types" }
contextra-ports = { path = "crates/contextra-ports" }
contextra-mvcc = { path = "crates/contextra-mvcc" }
contextra-adapt = { path = "crates/contextra-adapt" }
contextra-kvcache = { path = "crates/contextra-kvcache" }
contextra-engine = { path = "crates/contextra-engine" }
contextra-cognition = { path = "crates/contextra-cognition" }
contextra-rank = { path = "crates/contextra-rank" }

# ── Archived Zone ──────────────────────────────────────────────────────────────
# contextra-cluster, contextra-sandbox, contextra-saos-agent wurden in Phase 0 ausgelagert. <!-- crate-ref-ignore -->
# contextra-embed    → ONNX-Embeddings (wird via Feature-Flag optional) <!-- crate-ref-ignore -->

# 🧊 Frozen Zone — external deps for future reactivation
# openraft = { version = "0.9", features = ["storage-v2", "serde"] }
# tonic = { version = "0.12", features = ["tls"] }
# prost = "0.13"
#
# Embedding & ML (activate with contextra-infer-onnx feature)
# ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-24"] }
# hf-hub = { version = "0.3", default-features = false }
# tokenizers = "0.19"
# ndarray = "0.15"
#
# Network
# reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
overflow-checks = true

# Profile for standalone binaries without FFI/PyO3 bindings.
[profile.release-abort]
inherits = "release"
panic = "abort"

[profile.bench]
inherits = "release"

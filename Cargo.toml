[workspace]
resolver = "2"
members = [
    "crates/memfuse-wire",
    "crates/memfuse-sys",
    "crates/memfuse-simd",
    "crates/memfuse-core",
    "crates/memfuse-store",
    "crates/memfuse-vector",
    "crates/memfuse-db",
    "crates/memfuse-text",
    "crates/memfuse-checkpoint",
    "crates/memfuse-crypto",
    "crates/memfuse-privacy",
    "crates/memfuse-graph",
    "crates/memfuse-infer-onnx",
    "crates/memfuse-mcp",
    "crates/memfuse-agent",
    "crates/memfuse-infer-ollama",
    "crates/memfuse-router",
    "crates/memfuse-calibration",
    "benchmarks/memfuse-bench",
    "crates/memfuse-infer-candle",
    "crates/memfuse-sandbox",
    "crates/memfuse-py",
    "crates/memfuse-testkit", "crates/memfuse", "crates/memfuse-types", "crates/memfuse-ports", "crates/memfuse-mvcc", "crates/memfuse-adapt", "crates/memfuse-kvcache",
    "crates/memfuse-engine", "crates/memfuse-cognition",
]
exclude = ["xtask"]
default-members = [
    "crates/memfuse-wire",
    "crates/memfuse-simd",
    "crates/memfuse-core",
    "crates/memfuse-store",
    "crates/memfuse-vector",
    "crates/memfuse-db",
    "crates/memfuse-text",
    "crates/memfuse-checkpoint",
    "crates/memfuse-crypto",
    "crates/memfuse-graph",
    "crates/memfuse-infer-onnx",
    "crates/memfuse-mcp",
    "crates/memfuse-agent",
    "crates/memfuse-infer-ollama",
    "crates/memfuse-router",
    "crates/memfuse-calibration",
    "crates/memfuse-infer-candle",
    "crates/memfuse-sandbox",
    "crates/memfuse-py",
    "crates/memfuse-testkit",
    "crates/memfuse",
    "crates/memfuse-types",
    "crates/memfuse-ports",
    "crates/memfuse-mvcc",
    "crates/memfuse-adapt",
    "crates/memfuse-kvcache",
    "crates/memfuse-engine",
    "crates/memfuse-cognition",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
# Error handling
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bincode = "1.3.3"
flatbuffers = "24.3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Data structures
bytes = "1"
memmap2 = "0.9.11"
ahash = { version = "0.8", features = ["serde"] }
itoa = "1"
parking_lot = "0.12"
roaring = "0.10"
regex = "1"

# Crypto & hashing
blake3 = "1"
crc32fast = "1.3"

# Concurrency
rand = "0.8"

# Observability
tracing = "0.1"

# Testing
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Workspace crates
memfuse-wire = { path = "crates/memfuse-wire" }
memfuse-sys = { path = "crates/memfuse-sys" }
memfuse-simd = { path = "crates/memfuse-simd" }
memfuse-core = { path = "crates/memfuse-core" }
memfuse-store = { path = "crates/memfuse-store" }
memfuse-vector = { path = "crates/memfuse-vector" }
memfuse-index = { package = "memfuse-vector", path = "crates/memfuse-vector" }
memfuse-db = { path = "crates/memfuse-db" }
memfuse-text = { path = "crates/memfuse-text" }
memfuse-checkpoint = { path = "crates/memfuse-checkpoint" }
memfuse-crypto = { path = "crates/memfuse-crypto" }
memfuse-privacy = { path = "crates/memfuse-privacy" }
memfuse-graph = { path = "crates/memfuse-graph" }
memfuse-infer-onnx = { path = "crates/memfuse-infer-onnx" }
memfuse-embed = { package = "memfuse-infer-onnx", path = "crates/memfuse-infer-onnx" }
memfuse-mcp   = { path = "crates/memfuse-mcp" }
memfuse-agent = { path = "crates/memfuse-agent" }
memfuse-infer-ollama = { path = "crates/memfuse-infer-ollama" }
memfuse-ollama = { package = "memfuse-infer-ollama", path = "crates/memfuse-infer-ollama" }
memfuse-router = { path = "crates/memfuse-router" }
memfuse-calibration = { path = "crates/memfuse-calibration" }
memfuse-infer-candle = { path = "crates/memfuse-infer-candle" }
memfuse-candle = { package = "memfuse-infer-candle", path = "crates/memfuse-infer-candle" }
memfuse-sandbox = { path = "crates/memfuse-sandbox" }
memfuse-py = { path = "crates/memfuse-py" }
memfuse-testkit = { path = "crates/memfuse-testkit" }
memfuse = { path = "crates/memfuse" }
memfuse-types = { path = "crates/memfuse-types" }
memfuse-ports = { path = "crates/memfuse-ports" }
memfuse-mvcc = { path = "crates/memfuse-mvcc" }
memfuse-adapt = { path = "crates/memfuse-adapt" }
memfuse-kvcache = { path = "crates/memfuse-kvcache" }
memfuse-engine = { path = "crates/memfuse-engine" }
memfuse-cognition = { path = "crates/memfuse-cognition" }

# ── Archived Zone ──────────────────────────────────────────────────────────────
# memfuse-cluster, memfuse-sandbox, memfuse-saos-agent wurden in Phase 0 ausgelagert.
# memfuse-embed    → ONNX-Embeddings (wird via Feature-Flag optional)

# 🧊 Frozen Zone — external deps for future reactivation
# openraft = { version = "0.9", features = ["storage-v2", "serde"] }
# tonic = { version = "0.12", features = ["tls"] }
# prost = "0.13"
#
# Embedding & ML (activate with memfuse-embed feature)
# ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-24"] }
# hf-hub = { version = "0.3", default-features = false }
# tokenizers = "0.19"
# ndarray = "0.15"
#
# Network
# reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
overflow-checks = true

# Profile for standalone binaries without FFI/PyO3 bindings.
[profile.release-abort]
inherits = "release"
panic = "abort"

[profile.bench]
inherits = "release"

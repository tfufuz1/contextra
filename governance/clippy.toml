# governance/clippy.toml — Workspace-Clippy-Konfiguration
# doc-stamp: 2026-10-26 | Normativ: SPEC §0.2 R2/R3, §17.3, PLAN.md WP 0.4 (K-13)
# Wird von cargo clippy konsumiert. Ergänzt Cargo.toml [workspace.lints.clippy].
#
# PLAN.md K-13: clippy::await_holding_lock = deny, unexpected_cfgs = deny
# PLAN.md WP 0.4: disallowed-methods + disallowed-types für P28-Verbotsliste
# SPEC §17.3: Lint-Satz mit disallowed_methods, disallowed_types, disallowed_macros

# Kognitive Komplexität: max. 30 pro Funktion (SPEC §0.2)
cognitive-complexity-threshold = 30

# Typ-Konvertierungen: explizit erzwingen
too-many-arguments-threshold = 7

# API-Stabilität
avoid-breaking-exported-api = false

# ── P28-Verbotsliste: disallowed-methods ───────────────────────────────────────
# SPEC §0.2 R3: "Zeit, Zufall, IDs nur über Ports Clock, Rng, IdGen"
# PLAN.md WP 0.4: disallowed-methods für std::time, rand, std::env
# Ausnahme: Schlüssel-/Salt-Material aus System-RNG (governance/determinism-allow.toml)
[[disallowed-methods]]
path = "std::time::Instant::now"
reason = "P28: Zeit nur über Clock-Port. Verwende contextra_ports::clock::Clock."

[[disallowed-methods]]
path = "std::time::SystemTime::now"
reason = "P28: Zeit nur über Clock-Port. Verwende contextra_ports::clock::Clock."

[[disallowed-methods]]
path = "rand::thread_rng"
reason = "P28: Zufall nur über Rng-Port. Ausnahme: Schlüssel/Salt/Nonce (ADR-098, determinism-allow.toml)."

[[disallowed-methods]]
path = "std::env::var"
reason = "P28: Umgebungsvariablen nicht in Kernlogik. Verwende Konfigurationsstrukturen."

[[disallowed-methods]]
path = "std::env::var_os"
reason = "P28: Umgebungsvariablen nicht in Kernlogik."

# ── P28-Verbotsliste: disallowed-types ─────────────────────────────────────────
# HashMap/HashSet mit RandomState sind in Kernlogik verboten (nicht-deterministisch).
# Ersatz: Typalias mit festem Seed (z.B. ahash::AHashMap).
[[disallowed-types]]
path = "std::collections::HashMap"
reason = "P28: HashMap mit RandomState ist nicht-deterministisch. Verwende den Typ-Alias mit festem Seed."

[[disallowed-types]]
path = "std::collections::HashSet"
reason = "P28: HashSet mit RandomState ist nicht-deterministisch. Verwende den Typ-Alias mit festem Seed."

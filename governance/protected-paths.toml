# Governance Protected Paths Configuration
# Any change to files matching these patterns requires an approved ADR trailer and PR label.

[[protected]]
glob = ".github/**"
reason = "CI/CD Workflows und GitHub-Konfigurationen steuern Build- und Gate-Pipelines."

[[protected]]
glob = "xtask/**"
reason = "Xtask-Module erzwingen Security- und Governance-Gates im Repository."

[[protected]]
glob = "justfile"
reason = "Zentraler Task-Runner definiert Entwickler- und CI-Befehle."

[[protected]]
glob = "rust-toolchain.toml"
reason = "Toolchain-Pin garantiert reproduzierbare und sichere Rust-Builds."

[[protected]]
glob = "deny.toml"
reason = "Cargo Deny Konfiguration regelt Lizenz-, Dependency- und Sicherheitsprüfungen."

[[protected]]
glob = "capabilities.toml"
reason = "Definiert Unsafe-Inseln und Capabilities aller Crates."

[[protected]]
glob = "AGENTS.md"
reason = "Zentrale Handlungsanweisungen und Verhaltenskodex für KI-Agenten."

[[protected]]
glob = ".jules/setup/**"
reason = "Setup-Skripte für die Agenten-Umgebung."

[[protected]]
glob = "governance/**"

# KEYFAMILIES.toml
# Registry aller Key-Präfix-Familien für Löschpfade und Storage-Funktionen.

[[family]]
name = "CollectionDocData"
prefix_pattern = "__col:{collection_name}:\u0000"
owner_crate = "contextra-engine"
erase_unit = "Both"
scanner = "SstScan"
contains_identifier = true

# HINWEIS ZUR KEY-KODIERUNG:
# Für CollectionIndex ist die tatsächliche Schlüsselkodierung im Storage
# b"__col_idx:\x00" + name (un-tenantisiert) bzw. t:{tenant_id}:__col_idx:\x00{collection_name} (tenantisiert).
[[family]]
name = "CollectionIndex"
prefix_pattern = "__col_idx:\u0000{collection_name}"
owner_crate = "contextra-engine"
erase_unit = "PerCollection"
scanner = "SstScan"
contains_identifier = true

[[family]]
name = "TextIndex"
prefix_pattern = "__txt:{collection_name}:"
owner_crate = "contextra-engine"
erase_unit = "Both"
scanner = "TextScan"
contains_identifier = true

[[family]]
name = "Relations"
prefix_pattern = "__rel:"
owner_crate = "contextra-engine"
erase_unit = "PerDocument"
scanner = "RelationsScan"
contains_identifier = true

[[family]]
name = "DocIdMapping"
prefix_pattern = "__docid:"
owner_crate = "contextra-engine"
erase_unit = "PerDocument"
scanner = "SstScan"
contains_identifier = true

[[family]]
name = "GraphData"
prefix_pattern = "__graph:"
owner_crate = "contextra-graph"
erase_unit = "Both"
scanner = "GraphScan"
contains_identifier = true

[[family]]
name = "TxIntent"
prefix_pattern = "__tx_intent:"
owner_crate = "contextra-engine"
erase_unit = "PerTenant"
scanner = "WalScan"
contains_identifier = false

[[family]]
name = "KvCache"
prefix_pattern = "__kv_spill:"
owner_crate = "contextra-kvcache"
erase_unit = "PerTenant"
scanner = "CacheScan"
contains_identifier = true

[[family]]
name = "SessionDag"
prefix_pattern = "__session_dag:"
owner_crate = "contextra-graph"
erase_unit = "PerTenant"
scanner = "GraphScan"
contains_identifier = true

[[family]]
name = "MaintenanceIntent"
prefix_pattern = "__maintenance_intent:"
owner_crate = "contextra-cognition"
erase_unit = "PerTenant"
scanner = "none-ephemeral"
contains_identifier = false

[[family]]
name = "SystemMeta"
prefix_pattern = "__meta:"
owner_crate = "contextra-engine"
erase_unit = "PerTenant"
scanner = "SstScan"
contains_identifier = false

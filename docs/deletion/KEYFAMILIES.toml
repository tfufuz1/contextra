# KEYFAMILIES.toml
# Registry aller Key-Präfix-Familien für Löschpfade und Storage-Funktionen.

[[family]]
name = "CollectionDocData"
prefix_pattern = "__col:{collection_name}:\x00"
owner_crate = "contextra-engine"
erase_unit = "Both"
scanner = "TODO"
contains_identifier = true

# OFFENER PUNKT / KNOWN DISCREPANCY:
# Für __col_idx: existiert eine bekannte Diskrepanz zwischen drop_collection (b"__col_idx:\x00", name)
# und der tatsächlichen Key-Kodierung. Dies ist ein bekannter, noch ungeklärter offener Punkt
# und wird in einem nachfolgenden Arbeitspaket adressiert, das den Produktionscode anpasst.
[[family]]
name = "CollectionIndex"
prefix_pattern = "__col_idx:\x00{collection_name}"
owner_crate = "contextra-engine"
erase_unit = "PerCollection"
scanner = "TODO"
contains_identifier = true


# Verbotene Formulierungen und Claims gemäß Spec §5.14, F-28 und REG-16

title = "Forbidden Claims Rules"
version = "1.0.0"

[[forbidden]]
id = "unwiederbringlich-geloescht"
pattern = "(?i)unwiederbringlich\\s+gelöscht"
description = "Behauptung von unwiederbringlicher Löschung"

[[forbidden]]
id = "dsgvo-konform-geloescht"
pattern = "(?i)dsgvo-konform\\s+gelöscht"
description = "Behauptung von DSGVO-konformer Löschung"

[[forbidden]]
id = "garantiert-ssd-sicher"
pattern = "(?i)garantiert\\s+ssd-sicher"
description = "Behauptung von SSD-Sicherheit"

[[forbidden]]
id = "rechtsverbindlich"
pattern = "(?i)rechtsverbindlich"
description = "Unzulässige rechtliche Beweiskraft-Aussage"

[[forbidden]]
id = "mathematisch-unanfechtbar"
pattern = "(?i)mathematisch\\s+unanfechtbar"
description = "Unzulässige mathematische Absolutheitsbehauptung"

[[forbidden]]
id = "zpo-371a"
pattern = "(?i)§?\\s*371a\\s*(Abs\\.\\s*\\d+\\s*)?ZPO"
description = "Bezugnahme auf § 371a ZPO"

[[forbidden]]
id = "bsi-tr-02102-konform"
pattern = "(?i)BSI-?TR-02102-?konform"
description = "Behauptung von BSI TR-02102-Konformität"

[[forbidden]]
id = "medium-sicher-geloescht"
pattern = "(?i)Daten\\s+sind\\s+auf\\s+dem\\s+Medium\\s+sicher\\s+gelöscht"
description = "Unzulässige Dateisystem-/Medienlöschungs-Garantie"

[[forbidden]]
id = "loeschung-wirkt-auf-snapshots"
pattern = "(?i)Löschung\\s+wirkt\\s+auf\\s+Snapshots\\s+und\\s+Journal"
description = "Falsche Behauptung der Wirkung auf Dateisystem-Snapshots"

[[forbidden]]
id = "bit-identisch-ueber-alle-plattformen"
pattern = "(?i)bit-identisch\\s+über\\s+alle\\s+Plattformen"
description = "Unzulässige Bit-Identitätsbehauptung für Fließkomma-Ergebnisse über Plattformen"

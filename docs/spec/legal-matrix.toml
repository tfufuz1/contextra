# Maschinenlesbare Rechtsmatrix (WP 5.10)
# Zweck: Abbildung gesetzlicher Vorgaben (DSGVO, KI-VO, CRA) auf technische Anforderungen, Bausteine, Tests und Status.
#
# WICHTIGE HINWEISE UND DISCLAIMER:
# - Dies ist KEINE Rechtsauskunft und KEINE Zertifizierung.
# - Quelle der Wahrheit bei Abweichung ist SPEC §9.12.
#
# AENDERUNGSVERFAHREN:
# Bei Rechtsänderung oder neuer Aufsichtspraxis:
# 1. Betroffene Zeile identifizieren oder neue Zeile anlegen.
# 2. Issue/Ticket erstellen und betroffenen Baustein/Crate sowie Test anpassen.
# 3. Status und Notiz in dieser Datei aktualisieren.

[[eintrag]]
id = "LM-001"
vorgabe = "Art. 5 Abs. 1 lit. e Speicherbegrenzung"
anforderung = "Aufbewahrung nur so lange nötig; Fristen durchsetzbar"
baustein = "Retention-Reaper (contextra-engine), Fristen und Legal Hold (contextra-erasure, D10)"
test = ["crates/contextra-engine/tests/decay_and_expiry.rs::test_expiry_reaper_cleans_expired_working_memory"]
status = "teilweise"
rechtsfrage = ["O-02", "O-41"]
quelle = "SPEC §9.12"
notiz = "Retention-Reaper in engine vorhanden, aber automatische Fristen und Legal Hold (erasure D10) sind noch offen (WP 5.8). O-41: Definition in Arbeit (docs/SPEC.md, separater PR)."

[[eintrag]]
id = "LM-002"
vorgabe = "Art. 5 Abs. 1 lit. f, Art. 32 Integrität, Vertraulichkeit"
anforderung = "Verschlüsselung, Integrität, Mandantentrennung"
baustein = "contextra-crypto, contextra-store (WAL-HMAC), contextra-privacy, INV-TENANT-*"
test = [
  "crates/contextra-crypto/src/crypto.rs::test_encrypt_decrypt_roundtrip",
  "crates/contextra-engine/tests/invariant_tenant_isolation.rs::test_tenant_isolation_cross_tenant_document_and_collection_operations"
]
status = "teilweise"
rechtsfrage = []
quelle = "SPEC §9.12"
notiz = "Verschlüsselung und Mandantentrennung grundlegend umgesetzt (contextra-crypto in beta), aber externe Krypto-Audits (V8) stehen noch aus."

[[eintrag]]
id = "LM-003"
vorgabe = "Art. 5 Abs. 2, Art. 24 Rechenschaft"
anforderung = "Nachweis der Maßnahmen"
baustein = "Evidence-Pack, AuditChain, DeletionProof (contextra-crypto)"
test = ["crates/contextra-crypto/src/deletion_proof/mod.rs::test_v3_create_and_verify_external_roundtrip"]
status = "teilweise"
rechtsfrage = []
quelle = "SPEC §9.12"
notiz = "Berichtsformat und AuditChain sind vorhanden, aber Integrationstests waren fehlerhaft/rot (U-15) und Evidence-Packs sind noch unvollständig."

[[eintrag]]
id = "LM-004"
vorgabe = "Art. 17 Abs. 1 Löschung"
anforderung = "technisch begründete Löschung aller Schichten"
baustein = "Saga (contextra-erasure), Scanner/Purger je Schicht, Destroy-Protokoll (D1–D6)"
test = ["crates/contextra-store/src/scanner/tests.rs::test_purge_clears_remaining_residuals"]
status = "teilweise"
rechtsfrage = ["O-01", "O-04"]
quelle = "SPEC §9.12"
notiz = "5 von 10 Schichten gemessen; Saga und vollständige Schlüsselvernichtung D1-D6 fehlen noch."

[[eintrag]]
id = "LM-005"
vorgabe = "Art. 17 Abs. 2, Art. 19 Information von Empfängern"

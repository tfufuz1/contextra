# Takt: Wöchentlich (So 02:00 UTC) / workflow_dispatch / pull_request (Pfadfilter) / push on main
# Zweck: Führt Fixture-Smoke-Tests und Retrieval-Benchmarks aus.
# Lokaler Befehl: cargo test --locked -p contextra-bench

name: Benchmark Suite & Regression Baseline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'crates/contextra-bench/**'
      - 'crates/contextra-vector/**'
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Update baseline_metrics.json with results from real dataset execution'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fixture-smoke-test:
    name: Fixture-Smoke-Test & Harness Dry-Run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run Full Crate Unit & Integration Test Suite
        run: cargo test --locked -p contextra-bench

      - name: Dry-Run Benchmark Harness
        run: cargo bench --locked -p contextra-db -- --test

      - name: Report Failure Summary
        if: failure()
        run: |
          echo "### ❌ Fixture-Smoke-Test Failed" >> $GITHUB_STEP_SUMMARY
          echo "Reproduziere lokal mit:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cargo test --locked -p contextra-bench" >> $GITHUB_STEP_SUMMARY
          echo "cargo bench --locked -p contextra-db -- --test" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  retrieval-accuracy-bench:
    name: Synthetic Retrieval Accuracy & Performance Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: fixture-smoke-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Execute Synthetic Accuracy & Latency Benchmarks
        run: cargo run --locked -p contextra-bench --release -- synthetic --output benchmarks/results/synthetic_results.json

      - name: Report Failure Summary
        if: failure()
        run: |
          echo "### ❌ Synthetic Retrieval Accuracy Benchmarks Failed" >> $GITHUB_STEP_SUMMARY
          echo "Reproduziere lokal mit:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cargo run --locked -p contextra-bench --release -- synthetic --output benchmarks/results/synthetic_results.json" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Synthetic Benchmark Metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-benchmark-metrics
          path: benchmarks/results/synthetic_results.json
          retention-days: 7

  benchmark-regression:
    name: Retrieval Quality Regression Gate (LongMemEval & LoCoMo)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: fixture-smoke-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Cache Benchmark Datasets
        id: cache-datasets
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d7715d53d42c # v4
        with:
          path: benchmarks/contextra-bench/tests/data/
          key: benchmark-datasets-v1-${{ hashFiles('benchmarks/contextra-bench/src/long_mem_eval.rs', 'benchmarks/contextra-bench/src/locomo.rs') }}
          restore-keys: |
            benchmark-datasets-v1-

      - name: Download Benchmark Datasets (if cache miss)
        if: steps.cache-datasets.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p benchmarks/contextra-bench/tests/data/

          pip install huggingface_hub --quiet

          # LongMemEval-S: Original-Repo (xiaowu0162/longmemeval)
          python3 -c "
          from huggingface_hub import hf_hub_download
          import shutil, os, sys
          try:
              path = hf_hub_download(
                  repo_id='xiaowu0162/longmemeval',
                  filename='longmemeval_s',
                  repo_type='dataset',
                  token=os.environ.get('HF_TOKEN') or None
              )
              shutil.copy(path, 'benchmarks/contextra-bench/tests/data/longmemeval_s.jsonl')
              print(f'LongMemEval-S heruntergeladen: {os.path.getsize(path)} Bytes')
          except Exception as e:
              print(f'Error downloading LongMemEval-S: {e}', file=sys.stderr)
              sys.exit(1)
          " || {
            echo "LongMemEval/LoCoMo-Datensatz-Download fehlgeschlagen — Regressionsgate kann nicht verlässlich ausgeführt werden"
            exit 1
          }

          # LoCoMo: Öffentlich verfügbar via KimmoZZZ/locomo
          python3 -c "
          from huggingface_hub import hf_hub_download
          import shutil, os, sys
          try:
              path = hf_hub_download(
                  repo_id='KimmoZZZ/locomo',
                  filename='locomo10.json',
                  repo_type='dataset',
                  token=os.environ.get('HF_TOKEN') or None
              )
              shutil.copy(path, 'benchmarks/contextra-bench/tests/data/locomo_test.json')
              print(f'LoCoMo heruntergeladen: {os.path.getsize(path)} Bytes')
          except Exception as e:
              print(f'Error downloading LoCoMo: {e}', file=sys.stderr)
              sys.exit(1)
          " || {
            echo "LongMemEval/LoCoMo-Datensatz-Download fehlgeschlagen — Regressionsgate kann nicht verlässlich ausgeführt werden"
            exit 1
          }

      - name: Verify Dataset Existence Before Execution
        run: |
          LME="benchmarks/contextra-bench/tests/data/longmemeval_s.jsonl"
          LOCOMO="benchmarks/contextra-bench/tests/data/locomo_test.json"
          if [ ! -s "$LME" ] || [ ! -s "$LOCOMO" ]; then
            echo "LongMemEval/LoCoMo-Datensatz-Download fehlgeschlagen — Regressionsgate kann nicht verlässlich ausgeführt werden"
            exit 1
          fi
          echo "Beide Datensätze vorhanden."

      - name: Run LongMemEval Benchmark Execution
        run: |
          DATASET="benchmarks/contextra-bench/tests/data/longmemeval_s.jsonl"
          echo "Verwende Dataset: $DATASET ($(wc -c < "$DATASET") Bytes)"
          cargo run --locked -p contextra-bench --release -- long-mem-eval \
            --dataset "$DATASET" \
            --output benchmarks/results/long_mem_eval_results.json

      - name: Run LoCoMo Benchmark Execution
        run: |
          DATASET="benchmarks/contextra-bench/tests/data/locomo_test.json"
          echo "Verwende Dataset: $DATASET ($(wc -c < "$DATASET") Bytes)"
          cargo run --locked -p contextra-bench --release -- locomo \
            --dataset "$DATASET" \
            --output benchmarks/results/locomo_results.json

      - name: Evaluate Metrics Against Versioned Baseline
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Updating baseline on main branch..."
            cargo run -p xtask -- bench-gate --results benchmarks/results/current_metrics.json --baseline benchmarks/contextra-bench/baseline_metrics.json --threshold 0.05 --update
          else
            echo "Evaluating regression gate against main baseline..."
            cargo run -p xtask -- bench-gate --results benchmarks/results/current_metrics.json --baseline benchmarks/contextra-bench/baseline_metrics.json --threshold 0.05
          fi

      - name: Update Baseline Metrics (when explicitly requested via workflow_dispatch)
        if: ${{ github.event.inputs.update_baseline == 'true' }}
        run: |
          echo "Updating baseline_metrics.json with real dataset results..."
          python3 -c "
          import json, datetime, subprocess
          commit_hash = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode('utf-8').strip()
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          with open('benchmarks/results/current_metrics.json', 'r') as f:
              metrics = json.load(f)
          metrics['_status'] = 'real-dataset-baseline'
          metrics['_note'] = f'Erzeugt gegen echte Datensätze am {now} (Commit {commit_hash})'
          metrics['_dataset_source'] = 'xiaowu0162/longmemeval (longmemeval_s.jsonl, Original-Repo)'
          metrics['_locomo_source'] = 'LoCoMo-Dataset/LoCoMo (test.json)'
          metrics['_generated_at'] = now
          metrics['_commit_hash'] = commit_hash
          with open('benchmarks/contextra-bench/baseline_metrics.json', 'w') as f:
              json.dump(metrics, f, indent=2)
              f.write('\n')
          print('baseline_metrics.json erfolgreich aktualisiert.')
          "

      - name: Report Failure Summary
        if: failure()
        run: |
          echo "### ❌ Retrieval Quality Benchmarks Failed" >> $GITHUB_STEP_SUMMARY
          echo "Reproduziere lokal mit:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cargo run -p xtask -- bench-gate --results benchmarks/results/current_metrics.json --baseline benchmarks/contextra-bench/baseline_metrics.json --threshold 0.05" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Retrieval Quality Regression Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-regression-metrics
          path: |
            benchmarks/results/
            benchmarks/contextra-bench/baseline_metrics.json
          retention-days: 7

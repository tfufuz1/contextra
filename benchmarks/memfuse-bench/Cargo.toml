[lints]
workspace = true

[package]
name = "memfuse-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "memfuse-bench"
description = "MemFuse — Reproducible Benchmark Harness for Retrieval Accuracy"

[lib]
name = "memfuse_bench"
path = "src/lib.rs"

[[bin]]
name = "memfuse-bench"
path = "src/main.rs"

[[bin]]
name = "compare-baseline"
path = "src/bin/compare_baseline.rs"

[dependencies]
memfuse-core = { workspace = true }
memfuse-store = { workspace = true }
memfuse-index = { workspace = true }
memfuse-text = { workspace = true }
memfuse-graph = { workspace = true }
memfuse-db = { workspace = true }
memfuse-embed = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = "1"
hdrhistogram = "7"
rand = { workspace = true }

[features]
default = []
external-benchmarks = []
onnx-bench = ["memfuse-embed/onnx", "memfuse-db/reranking"]

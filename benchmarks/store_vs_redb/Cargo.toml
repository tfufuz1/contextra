[workspace]

# Local lint table replicating workspace lints for standalone benchmark workspace
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
await_holding_lock = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[package]
name = "store_vs_redb"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
contextra-store = { path = "../../crates/contextra-store" }
contextra-ports = { path = "../../crates/contextra-ports" }
contextra-types = { path = "../../crates/contextra-types" }

redb = "2.6.3"
hdrhistogram = "7.6.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
anyhow = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = true

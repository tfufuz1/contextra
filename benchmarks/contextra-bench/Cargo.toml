[lints]
workspace = true

[package]
name = "contextra-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "contextra-bench"
description = "Contextra — Reproducible Benchmark Harness for Retrieval Accuracy"

[package.metadata.contextra]
ring = "tooling"

[lib]
name = "contextra_bench"
path = "src/lib.rs"

# Die Dataset-Module `locomo` und `long_mem_eval` fehlen im Repository (nur Fixtures
# vorhanden). Binary und PathRAG-Sweep sind daher hinter Feature `datasets` gestellt.
[[bin]]
name = "contextra-bench"
path = "src/main.rs"
required-features = ["datasets"]

[[bin]]
name = "compare-baseline"
path = "src/bin/compare_baseline.rs"

[[bin]]
name = "scale-100k"
path = "src/bin/scale_100k.rs"

[dependencies]
contextra-store = { workspace = true }
contextra-vector = { workspace = true }
contextra-text = { workspace = true }
contextra-db = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = "1"
hdrhistogram = "7"
rand = { workspace = true }
contextra-rank = { workspace = true }
contextra-types = { workspace = true }

[[bench]]
name = "competitive_kv"
harness = false

[dev-dependencies]
contextra-sys = { workspace = true }
criterion = { workspace = true }
libc = "0.2"
redb = "2"
sled = "0.34"

[features]
# Aktiviert Dataset-Harnesses (benötigt src/locomo.rs und src/long_mem_eval.rs).
datasets = []
default = []
external-benchmarks = []

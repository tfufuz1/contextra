# Commit Integrity Guard Workflow
# Detects empty commits carrying misleading commit messages claiming non-existent file additions or multi-line changelogs.
# Triggered by incident class cab4fc5a (22.09.2026) where an empty diff commit claimed additions of five files.

name: Commit Integrity Guard

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-integrity-guard:
    name: Commit Integrity Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: "Check Commit Integrity (No Empty Commits with Misleading Messages)"
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_REF_NAME: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [ -n "$BASE_REF_NAME" ]; then
            CONTEXTRA_CI_BASE_REF="origin/$BASE_REF_NAME"
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            CONTEXTRA_CI_BASE_REF="$EVENT_BEFORE"
          else
            CONTEXTRA_CI_BASE_REF="HEAD~1"
          fi

          BASE_REF="${CONTEXTRA_CI_BASE_REF:-origin/main}"
          if ! git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
            BASE_REF="HEAD~1"
          fi

          COMMITS=$(git rev-list "$BASE_REF..HEAD" 2>/dev/null || echo "")

          if [ -z "$COMMITS" ]; then
            echo "No commits found in range $BASE_REF..HEAD or empty range."
            exit 0
          fi

          FAILED=0

          for COMMIT in $COMMITS; do
            PARENT=$(git rev-parse "${COMMIT}^1" 2>/dev/null || true)
            if [ -z "$PARENT" ]; then
              continue
            fi

            COMMIT_TREE=$(git rev-parse "${COMMIT}^{tree}")
            PARENT_TREE=$(git rev-parse "${PARENT}^{tree}")

            if [ "$COMMIT_TREE" = "$PARENT_TREE" ]; then
              MSG_LINE_COUNT=$(git log -1 --format="%B" "$COMMIT" | grep -v '^\s*$' | wc -l | tr -d ' ')

              IS_MISLEADING=0

              if [ "$MSG_LINE_COUNT" -gt 1 ]; then
                IS_MISLEADING=1
              fi

              if git log -1 --format="%B" "$COMMIT" | grep -i -E '\b(add|implement|fix|update)\b.*\b[a-zA-Z0-9_/-]+\.[a-zA-Z0-9]+\b' >/dev/null 2>&1; then
                IS_MISLEADING=1
              fi

              if [ "$IS_MISLEADING" -eq 1 ]; then
                echo "❌ INTEGRITY GUARD FAILURE: Empty commit with misleading message detected!"
                echo "  Commit SHA: $COMMIT"
                echo "  Tree Hash:  $COMMIT_TREE (identical to parent $PARENT)"
                echo "  Commit Message:"
                git log -1 --format="    %B" "$COMMIT"
                echo ""
                echo "  EXPLANATION:"
                echo "  This check guards against empty commits carrying misleading messages claiming non-existent file additions or multi-line changelogs."
                echo "  Incident Reference Class: cab4fc5a (22.09.2026) where commit cab4fc5a claimed 'add SignalKind, IPS propensity...' with 5 files but had an empty diff."
                FAILED=1
              fi
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          echo "✅ Commit integrity check passed: No empty commits with misleading messages found."

      - name: "PR Diff Stat vs Commit Message Discrepancy Gate (PZ-01)"
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_REF_NAME: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [ -n "$BASE_REF_NAME" ]; then
            CONTEXTRA_CI_BASE_REF="origin/$BASE_REF_NAME"
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            CONTEXTRA_CI_BASE_REF="$EVENT_BEFORE"
          else
            CONTEXTRA_CI_BASE_REF="HEAD~1"
          fi

          BASE_REF="${CONTEXTRA_CI_BASE_REF:-origin/main}"
          if ! git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
            BASE_REF="HEAD~1"
          fi

          echo "🔍 Evaluating git diff --stat $BASE_REF HEAD..."
          git diff --stat "$BASE_REF" HEAD || true

          COMMITS=$(git rev-list "$BASE_REF..HEAD" 2>/dev/null || echo "")
          if [ -z "$COMMITS" ]; then
            echo "No commits in range $BASE_REF..HEAD to inspect."
            exit 0
          fi

          FAILED=0
          for COMMIT in $COMMITS; do
            PARENT=$(git rev-parse "${COMMIT}^1" 2>/dev/null || true)
            if [ -z "$PARENT" ]; then
              continue
            fi

            COMMIT_TREE=$(git rev-parse "${COMMIT}^{tree}")
            PARENT_TREE=$(git rev-parse "${PARENT}^{tree}")

            if [ "$COMMIT_TREE" = "$PARENT_TREE" ]; then
              MSG=$(git log -1 --format="%B" "$COMMIT")
              MSG_LEN=${#MSG}

              if echo "$MSG" | grep -i -E '\b(add|implement|fix)\b' >/dev/null 2>&1 || [ "$MSG_LEN" -gt 80 ]; then
                echo "❌ PZ-01 DISCREPANCY FAILURE: Commit $COMMIT claims additions/fixes or has significant message length ($MSG_LEN chars), but git diff --stat shows an empty diff!"
                echo "  Commit SHA: $COMMIT"
                echo "  Commit Message:"
                echo "$MSG" | sed 's/^/    /'
                FAILED=1
              fi
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "❌ PZ-01: Empty commit discrepancy check failed."
            exit 1
          fi

          echo "✅ PZ-01: git diff --stat matches commit messages in PR range."

# Takt: Nightly (04:00 UTC) / workflow_dispatch / pull_request (Pfadfilter)
# Zweck: Prüft Nebenläufigkeit und Data Races mit Loom.
# Lokaler Befehl: RUSTFLAGS="--cfg loom" cargo test -p contextra-store --test loom_group_commit --release

name: Loom Concurrency Gate
on:
  schedule:
    # Täglich um 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/contextra-store/src/**"
      - "crates/contextra-store/tests/loom_group_commit.rs"
      - "crates/contextra-store/tests/loom_group_commit_handoff.rs"
      - "crates/contextra-crypto/src/**"
      - "crates/contextra-crypto/tests/loom_kv_deferred_zeroize.rs"
      - "crates/contextra-vector/src/**"
      - "crates/contextra-vector/tests/loom_quantizer_race_test.rs"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  loom-store:
    name: Loom Concurrency Check — contextra-store
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run Loom Test — contextra-store (loom_group_commit)
        run: |
          RUSTFLAGS="--cfg loom" cargo test -p contextra-store --test loom_group_commit --release
      - name: Run Loom Test — contextra-store (loom_group_commit_handoff)
        run: |
          which just || cargo install just --cheap-only || true
          just loom-store
      - name: Report Failure Summary
        if: failure()
        run: |
          echo "### ❌ Loom Concurrency Check — contextra-store Failed" >> $GITHUB_STEP_SUMMARY
          echo "Reproduziere lokal mit:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "RUSTFLAGS=\"--cfg loom\" cargo test -p contextra-store --test loom_group_commit --release" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  loom-crypto:
    name: Loom Concurrency Check — contextra-crypto
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run Loom Test — contextra-crypto (loom_kv_deferred_zeroize)
        run: |
          RUSTFLAGS="--cfg loom" cargo test -p contextra-crypto --test loom_kv_deferred_zeroize --release
      - name: Report Failure Summary
        if: failure()
        run: |
          echo "### ❌ Loom Concurrency Check — contextra-crypto Failed" >> $GITHUB_STEP_SUMMARY
          echo "Reproduziere lokal mit:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "RUSTFLAGS=\"--cfg loom\" cargo test -p contextra-crypto --test loom_kv_deferred_zeroize --release" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  loom-index:
    name: Loom Concurrency Check — contextra-vector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run Loom Test — contextra-vector (loom_quantizer_race_test)
        run: |
          RUSTFLAGS="--cfg loom" cargo test -p contextra-vector --test loom_quantizer_race_test --release
      - name: Report Failure Summary
        if: failure()
        run: |
          echo "### ❌ Loom Concurrency Check — contextra-vector Failed" >> $GITHUB_STEP_SUMMARY
          echo "Reproduziere lokal mit:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "RUSTFLAGS=\"--cfg loom\" cargo test -p contextra-vector --test loom_quantizer_race_test --release" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

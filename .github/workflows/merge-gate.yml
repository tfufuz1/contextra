# Merge Gate = schnell/blockierend
# Dieses Workflow-File dient als einziger schnelllaufender (Ziel: < 5 Min) und blockierender Quality Gate für Pull Requests.
# Es führt nur die essentiellen Prüfungen aus (Compile-Check, Fmt, Clippy, Unit-Tests der Libs).

name: Merge Gate (Schnell)

on:
  push:
    branches: ["main", "master"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  flatbuffers-drift-gate:
    name: FlatBuffers Schema Drift Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: FlatBuffers Schema Drift Gate
        run: cargo xtask check-fbs-drift

  dependency-policy-gate:
    name: Dependency Policy Gate (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check dependency policy (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  hyperedge-schema-merge:
    name: HyperEdge Schema Merge Gate
    needs: [flatbuffers-drift-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: HyperEdge Schema Test
        run: cargo test -p contextra-graph -- hyperedge

  merge-gate:
    name: Merge Gate (Schnell)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: Compile Check Gate
        run: cargo xtask check-compile

      - name: Security Gate — No sh -c in dispatch.rs
        run: |
          if grep -rn 'Command::new("sh")' crates/contextra-router/src/dispatch.rs; then
            echo "❌ SECURITY VIOLATION: sh -c in dispatch.rs gefunden!"
            exit 1
          fi
          echo "✅ check-dispatch-no-sh-c: Kein sh -c in dispatch.rs"

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy Check
        run: cargo clippy --workspace --exclude contextra-tauri -- -D warnings

      - name: Clippy Check (contextra-py)
        run: cargo clippy --manifest-path crates/contextra-py/Cargo.toml --all-targets -- -D warnings

      - name: Clippy Check (xtask)
        run: cargo clippy --manifest-path xtask/Cargo.toml --all-targets --locked -- -D warnings

      - name: Fast Unit Tests
        run: cargo test --workspace --exclude contextra-tauri --lib --quiet

      - name: Fast Unit Tests (contextra-py)
        run: cargo test --manifest-path crates/contextra-py/Cargo.toml --quiet

      - name: Fast Unit Tests (xtask)
        run: cargo test --manifest-path xtask/Cargo.toml --locked

      - name: Clippy Panic Lints
        # ersetzt check-unwrap-ratchet (§0.4); Workspace-Lints folgen in Welle 2
        run: cargo clippy --workspace --lib --bins --locked -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::todo -D clippy::unimplemented

      - name: Ring Layering Check
        # Phase 0R: Warnmodus (Exit 0). Phase 1a: --strict
        run: cargo xtask check-ring-layering --strict

      - name: Unsafe Islands Check
        # Phase 0R: Übergangsliste. Phase 1c: --strict
        run: cargo xtask check-unsafe-islands

      - name: FFI Panic Boundary Check
        run: cargo xtask check-ffi-panic-boundary

      - name: Audit Verdict Independence Check
        run: cargo xtask check-audit-verdict-independence

      - name: Bandit Latency Budget Gate
        # Prüft dass LinUCB-Diagonal-Approximation das Latenzbudget (P95 ≤ 1ms) einhält.
        # Verhindert versehentliche O(d³)-Implementierungen im Hot-Path (§9.1, §13.2).
        run: cargo run -p xtask --features contextra-router/bandit-routing -- check-bandit-latency-budget
        # Feature-Flag nötig da check_bandit_latency_budget contextra_router::BanditProfileState nutzt.

      - name: FlatBuffers Schema Drift Gate
        run: cargo xtask check-fbs-drift

      - name: Loom Concurrency Tests (LSM / WAL)
        run: RUSTFLAGS="--cfg loom" cargo test -p contextra-store --test loom_group_commit --release

      - name: Loom Concurrency Tests (Group Commit Handoff)
        run: |
          which just || cargo install just --cheap-only || true
          just loom-store

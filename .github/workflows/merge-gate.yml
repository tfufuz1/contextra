# Merge Gate = schnell/blockierend
# Dieses Workflow-File dient als einziger schnelllaufender (Ziel: < 5 Min) und blockierender Quality Gate für Pull Requests.
# Es führt nur die essentiellen Prüfungen aus.
#
# ── Gate-Klassifikation ────────────────────────────────────────────────────────
# BLOCKIEREND (Merge wird verhindert bei Fehler):
#   - check-duplicate-symbols-cross-file  — Symbolkonflikte erkennen
#   - flatbuffers-drift-gate              — Schema-Drift verhindern
#   - marker-drift-gate                   — Capability-Marker-Drift verhindern
#   - dependency-policy-gate              — Lizenzen/Advisories/Bans (cargo deny)
#   - phantom-commit-gate                 — Phantom-Commits erkennen (nur PRs)
#   - compile-security-check              — Clippy + Sicherheits-Checks
#   - clippy-py-and-xtask                 — Clippy für contextra-py und xtask
#   - unit-tests-py-and-xtask             — Schnelle Unit-Tests
#   - ring-and-safety-checks              — Ring-Layering, Unsafe-Inseln, FFI, Verdict
#
# NICHT-BLOCKIEREND (laufen als Informations-Checks, kein Merge-Block):
#   — (aktuell alle Jobs in diesem Workflow sind blockierend)
#
# Archiv-Crates (WP 2.1): contextra-graph, contextra-cognition, contextra-adapt,
#   contextra-kvcache, contextra-router, contextra-agent, contextra-infer-onnx,
#   contextra-infer-ollama werden in diesem Workflow NICHT referenziert.
# ──────────────────────────────────────────────────────────────────────────────

name: Merge Gate (Schnell)

on:
  push:
    branches: ["main", "master"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-duplicate-symbols-cross-file:
    name: Check Duplicate Symbols Cross File Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: Check Workspace Gates
        run: cargo xtask check

  flatbuffers-drift-gate:
    name: FlatBuffers Schema Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: Check Workspace Gates
        run: cargo xtask check

  marker-drift-gate:
    name: Capability Marker Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: Check Workspace Gates
        run: cargo xtask check

  dependency-policy-gate:
    name: Dependency Policy Gate (cargo deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check dependency policy (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  phantom-commit-gate:
    name: Phantom Commit Protection Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: Check Workspace Gates
        run: cargo xtask check

  # WP-X.4 / L1-Fix 2026-10-26: contextra-graph ist Archiv-Crate (WP 2.1).
  # hyperedge-schema-merge wurde entfernt — blockierte jeden PR durch ein totes Crate.
  # Wiederherstellung: nach WP 2.1b falls graph reaktiviert wird (ADR erforderlich).

  compile-security-check:
    name: Compile & Security Check Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: Security Gate — No sh -c in dispatch.rs
        run: |
          if grep -rn 'Command::new("sh")' crates/contextra-router/src/dispatch.rs; then
            echo "❌ SECURITY VIOLATION: sh -c in dispatch.rs gefunden!"
            exit 1
          fi
          echo "✅ check-dispatch-no-sh-c: Kein sh -c in dispatch.rs"

      - name: Clippy Panic Lints
        run: cargo clippy --workspace --lib --bins --locked -- -D warnings

  clippy-py-and-xtask:
    name: Clippy Check (contextra-py & xtask)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: Clippy Check (contextra-py)
        run: cargo clippy --manifest-path crates/contextra-py/Cargo.toml --all-targets -- -D warnings

      - name: Clippy Check (xtask)
        run: cargo clippy --manifest-path xtask/Cargo.toml --all-targets --locked -- -D warnings

  unit-tests-py-and-xtask:
    name: Fast Unit Tests (contextra-py & xtask)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: Fast Unit Tests (contextra-py)
        run: cargo test --manifest-path crates/contextra-py/Cargo.toml --quiet

      - name: Fast Unit Tests (xtask)
        run: cargo test --manifest-path xtask/Cargo.toml --locked

  ring-and-safety-checks:
    name: Ring & Safety Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: Workspace Gates Check
        run: cargo xtask check

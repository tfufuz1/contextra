# Merge Gate = schnell/blockierend
# Dieses Workflow-File dient als einziger schnelllaufender (Ziel: < 5 Min) und blockierender Quality Gate für Pull Requests.
# Es führt nur die essentiellen Prüfungen aus.

name: Merge Gate (Schnell)

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-duplicate-symbols-cross-file:
    name: Check Duplicate Symbols Cross File Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1.89.0
        with:
          toolchain: 1.89.0

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: Check Duplicate Symbols Cross File
        run: cargo run --manifest-path xtask/Cargo.toml -- check-duplicate-symbols-cross-file

  flatbuffers-drift-gate:
    name: FlatBuffers Schema Drift Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1.89.0
        with:
          toolchain: 1.89.0

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: FlatBuffers Schema Drift Gate
        run: cargo xtask check-fbs-drift

  marker-drift-gate:
    name: Capability Marker Drift Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1.89.0
        with:
          toolchain: 1.89.0

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: Capability Marker Drift Gate
        run: cargo xtask check-marker-drift

  dependency-policy-gate:
    name: Dependency Policy Gate (cargo deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Check dependency policy (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.0.1
        with:
          command: check advisories bans licenses sources

  phantom-commit-gate:
    name: Phantom Commit Protection Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1.89.0
        with:
          toolchain: 1.89.0

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: Phantom Commit Gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cargo run -p xtask -- check-commit-diff-integrity --range "$PR_BASE_SHA..$PR_HEAD_SHA"

  hyperedge-schema-merge:
    name: HyperEdge Schema Merge Gate
    needs: [flatbuffers-drift-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1.89.0
        with:
          toolchain: 1.89.0

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: HyperEdge Schema Test
        run: cargo test -p contextra-graph -- hyperedge

  compile-security-check:
    name: Compile & Security Check Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1.89.0
        with:
          toolchain: 1.89.0
          components: clippy

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: Security Gate — No sh -c in dispatch.rs
        run: |
          if grep -rn 'Command::new("sh")' crates/contextra-router/src/dispatch.rs; then
            echo "❌ SECURITY VIOLATION: sh -c in dispatch.rs gefunden!"
            exit 1
          fi
          echo "✅ check-dispatch-no-sh-c: Kein sh -c in dispatch.rs"

      - name: Clippy Panic Lints
        run: cargo clippy --workspace --lib --bins --locked -- -D warnings

  clippy-py-and-xtask:
    name: Clippy Check (contextra-py & xtask)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1.89.0
        with:
          toolchain: 1.89.0
          components: clippy

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: Clippy Check (contextra-py)
        run: cargo clippy --manifest-path crates/contextra-py/Cargo.toml --all-targets -- -D warnings

      - name: Clippy Check (xtask)
        run: cargo clippy --manifest-path xtask/Cargo.toml --all-targets --locked -- -D warnings

  unit-tests-py-and-xtask:
    name: Fast Unit Tests (contextra-py & xtask)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1.89.0
        with:
          toolchain: 1.89.0

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: Fast Unit Tests (contextra-py)
        run: cargo test --manifest-path crates/contextra-py/Cargo.toml --quiet

      - name: Fast Unit Tests (xtask)
        run: cargo test --manifest-path xtask/Cargo.toml --locked

  ring-and-safety-checks:
    name: Ring & Safety Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1.89.0
        with:
          toolchain: 1.89.0

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      - name: Ring Layering Check
        run: cargo xtask check-ring-layering --strict

      - name: Unsafe Islands Check
        run: cargo xtask check-unsafe-islands

      - name: FFI Panic Boundary Check
        run: cargo xtask check-ffi-panic-boundary

      - name: Audit Verdict Independence Check
        run: cargo xtask check-audit-verdict-independence

name: Extended Fuzz Suite (Nightly)
on:
  schedule:
    - cron: "0 01 * * *"
  workflow_dispatch: {}

jobs:
  fuzz-extended:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { crate: memfuse-store,  target: wal_mutation_chaos }
          - { crate: memfuse-store,  target: fuzz_manifest_load }
          - { crate: memfuse-index,  target: fuzz_hnsw_persistence }
          - { crate: memfuse-db,     target: fuzz_rrf_edge_cases }
          - { crate: memfuse-text,   target: fuzz_bm25_query }
          - { crate: memfuse-index,  target: fuzz_distance_boundaries }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --quiet

      - name: Fuzz ${{ matrix.target.target }} (3600s)
        run: |
          cd crates/${{ matrix.target.crate }}
          cargo fuzz run ${{ matrix.target.target }} \
            -- -max_total_time=3600 -dict=fuzz/dict.txt \
            2>&1 | tail -50

      - name: Upload Corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target.target }}-${{ github.run_id }}
          path: crates/${{ matrix.target.crate }}/fuzz/corpus/${{ matrix.target.target }}
          if-no-files-found: warn

name: Wiring Check Gate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  wiring-check:
    name: Wiring Check
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@166de8caa14bb03d0e4ce3de7cc787f95ccf7188 # 1.89.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install actionlint
        uses: taiki-e/install-action@b7cb13702a48866f81a79fa4513db39eb889df8c # actionlint
        with:
          tool: actionlint@1.7.7

      - name: Run wiring-check gate
        run: |
          mkdir -p gate-results
          cargo xtask wiring-check --json > gate-results/wiring-check.json || true

      - name: Upload wiring-check artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-wiring-check
          path: gate-results/wiring-check.json

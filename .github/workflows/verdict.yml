          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          mkdir -p gate-results
          cargo xtask gate-weakening --json --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }} > gate-results/gate-weakening.json


# Takt: Wöchentlich (Sa 23:00 UTC) / workflow_dispatch / pull_request (Pfadfilter) / push on main
# Zweck: misst Testabdeckung mit cargo-llvm-cov.
# Lokaler Befehl: cargo llvm-cov --workspace --json --output-path coverage.json && cargo xtask check-coverage-gate

name: Coverage Gate
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'crates/**'
      - 'xtask/**'
  schedule:
    # Wöchentlich Samstag 23:00 UTC (Coverage-Trend-Tracking)
    - cron: "0 23 * * 6"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage Gate (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --quiet

      - name: Generate Coverage Report
        run: |
          cargo llvm-cov \
            --workspace \
            --exclude contextra-py \
            --exclude contextra-core-ipc-gen \
            --json \
            --output-path coverage.json
        timeout-minutes: 20

      - name: Run Coverage Gate
        run: cargo run -p xtask -- check-coverage-gate

      - name: Upload Coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: coverage.json
          fail_ci_if_error: false
          verbose: false

      - name: Generate HTML Report (für PR-Artefakt)
        if: github.event_name == 'pull_request'
        run: |
          cargo llvm-cov \
            --workspace \
            --exclude contextra-py \
            --html \
            --output-dir target/coverage/

      - name: Upload HTML Report Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report-${{ github.sha }}
          path: target/coverage/
          retention-days: 7

      - name: Coverage Trend (wöchentlich)
        if: github.event_name == 'schedule'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TOTAL=$(jq '.data[0].totals.lines.percent' coverage.json)
          echo "{\"date\": \"$DATE\", \"total_line_coverage\": $TOTAL}" >> benchmarks/results/coverage_history.jsonl
          echo "Coverage $DATE: $TOTAL%"

      - name: Report Failure Summary
        if: failure()
        run: |
          echo "### ❌ Coverage Gate Failed" >> $GITHUB_STEP_SUMMARY
          echo "Reproduziere lokal mit:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cargo llvm-cov --workspace --exclude contextra-py --json --output-path coverage.json" >> $GITHUB_STEP_SUMMARY
          echo "cargo run -p xtask -- check-coverage-gate" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

name: Coverage Gate
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Wöchentlich Samstag 23:00 UTC (Coverage-Trend-Tracking)
    - cron: "0 23 * * 6"

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage Gate (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --quiet

      - name: Generate Coverage Report
        run: |
          cargo llvm-cov \
            --workspace \
            --exclude contextra-py \
            --exclude contextra-core-ipc-gen \
            --json \
            --output-path coverage.json
        timeout-minutes: 20

      - name: Run Coverage Gate
        run: cargo xtask check-coverage-gate
        # Gate-Schwellwerte (in xtask/src/check_coverage_gate.rs):
        # contextra-store:  75%
        # contextra-vector:  70%
        # contextra-text:   70%
        # contextra-graph:  65%
        # contextra-db:     60%
        # Andere Crates:  55%

      - name: Upload Coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.json
          fail_ci_if_error: false
          verbose: false

      - name: Generate HTML Report (für PR-Artefakt)
        if: github.event_name == 'pull_request'
        run: |
          cargo llvm-cov \
            --workspace \
            --exclude contextra-py \
            --html \
            --output-dir target/coverage/

      - name: Upload HTML Report Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: target/coverage/
          retention-days: 14

      - name: Coverage Trend (wöchentlich)
        if: github.event_name == 'schedule'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TOTAL=$(jq '.data[0].totals.lines.percent' coverage.json)
          echo "{\"date\": \"$DATE\", \"total_line_coverage\": $TOTAL}" >> benchmarks/results/coverage_history.jsonl
          echo "Coverage $DATE: $TOTAL%"

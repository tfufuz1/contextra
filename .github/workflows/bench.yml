name: Benchmark Suite & Regression Baseline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Update baseline_metrics.json with results from real dataset execution'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fixture-smoke-test:
    name: Fixture-Smoke-Test & Harness Dry-Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Fixture Evaluation & Benchmark Unit Tests
        run: |
          # Execute fixture-based evaluation tests and harness verification
          cargo test --locked -p contextra-bench

      - name: Benchmark Harness Dry-Run Test
        run: |
          # Verify benchmark compilation and harness functionality without long running timings
          CONTEXTRA_SCALE_TIERS=10,50 cargo bench --locked -p contextra-db -- --test

      - name: Run Benchmark Group Baseline (Informative)
        run: |
          # Criterion baseline generation for PR artifacts
          # Note: A future session will add comparison gates against main branch baseline with tolerance bands
          CONTEXTRA_SCALE_TIERS=100,500 cargo bench --locked -p contextra-db --bench scale_bench -- --save-baseline pr-${{ github.event.number || github.sha }}

      - name: Upload Benchmark Results Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-criterion-data
          path: |
            target/criterion
            benches/results/scale_rss.csv

  retrieval-accuracy-bench:
    name: Retrieval Accuracy Benchmark (contextra-bench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Cache LongMemEval Dataset
        id: cache-longmemeval
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: benchmarks/contextra-bench/tests/data/
          key: longmemeval-dataset-v1-${{ hashFiles('benchmarks/contextra-bench/src/long_mem_eval.rs') }}
          restore-keys: |
            longmemeval-dataset-v1-

      - name: Download LongMemEval & LoCoMo Datasets (if cache miss)
        if: steps.cache-longmemeval.outputs.cache-hit != 'true'
        run: |
          mkdir -p benchmarks/contextra-bench/tests/data/
          pip install huggingface_hub --quiet
          python3 -c "
          from huggingface_hub import hf_hub_download
          import shutil, os
          path = hf_hub_download(
              repo_id='xiaowu0162/longmemeval',
              filename='longmemeval_s',
              repo_type='dataset'
          )
          shutil.copy(path, 'benchmarks/contextra-bench/tests/data/longmemeval_s.jsonl')
          print(f'LongMemEval-S downloaded successfully: {os.path.getsize(path)} Bytes')
          " || echo "⚠️ HuggingFace download failed — fixture fallback active"

          python3 -c "
          from huggingface_hub import hf_hub_download
          import shutil, os
          path = hf_hub_download(
              repo_id='KimmoZZZ/locomo',
              filename='locomo10.json',
              repo_type='dataset'
          )
          shutil.copy(path, 'benchmarks/contextra-bench/tests/data/locomo_test.json')
          print(f'LoCoMo downloaded successfully: {os.path.getsize(path)} Bytes')
          " || echo "⚠️ LoCoMo download failed — fixture fallback active"

      - name: Run LongMemEval Benchmark Execution
        run: |
          DATASET="benchmarks/contextra-bench/tests/data/longmemeval_s.jsonl"
          FIXTURE="benchmarks/contextra-bench/tests/fixtures/long_mem_eval_fixture.json"
          [ -f "$DATASET" ] && ACTUAL="$DATASET" || ACTUAL="$FIXTURE"
          echo "Using Dataset: $ACTUAL ($(wc -c < $ACTUAL) Bytes)"
          cargo run --locked -p contextra-bench --release -- long-mem-eval \
            --dataset "$ACTUAL" \
            --output benchmarks/results/long_mem_eval_results.json

      - name: Run LoCoMo Benchmark Execution
        run: |
          DATASET="benchmarks/contextra-bench/tests/data/locomo_test.json"
          FIXTURE="benchmarks/contextra-bench/tests/fixtures/locomo_fixture.json"
          [ -f "$DATASET" ] && ACTUAL="$DATASET" || ACTUAL="$FIXTURE"
          echo "Using Dataset: $ACTUAL ($(wc -c < $ACTUAL) Bytes)"
          cargo run --locked -p contextra-bench --release -- locomo \
            --dataset "$ACTUAL" \
            --output benchmarks/results/locomo_results.json

      - name: Run Synthetic Retrieval Accuracy Benchmark Harness
        run: cargo run --locked -p contextra-bench --release

      - name: Evaluate Benchmark Regression Gate (xtask)
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Updating baseline on main branch..."
            cargo run -p xtask -- bench-gate --results benchmarks/results/current_metrics.json --baseline benchmarks/contextra-bench/baseline_metrics.json --update
          else
            echo "Evaluating regression gate against main baseline..."
            cargo run -p xtask -- bench-gate --results benchmarks/results/current_metrics.json --baseline benchmarks/contextra-bench/baseline_metrics.json
          fi

      - name: Upload Retrieval Accuracy Benchmark Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retrieval-accuracy-benchmark-results
          path: |
            benchmarks/results/
            benchmarks/contextra-bench/baseline_metrics.json
            benchmarks/contextra-bench/baseline_recall.json

  benchmark-regression:
    name: Retrieval Quality Regression Gate (LongMemEval & LoCoMo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build Benchmark Harness and Comparison Tooling
        run: cargo build --locked -p contextra-bench --release

      - name: Cache Benchmark Datasets
        id: cache-datasets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: benchmarks/contextra-bench/tests/data/
          key: benchmark-datasets-v1-${{ hashFiles('benchmarks/contextra-bench/src/long_mem_eval.rs', 'benchmarks/contextra-bench/src/locomo.rs') }}
          restore-keys: |
            benchmark-datasets-v1-

      - name: Download Benchmark Datasets (if cache miss)
        if: steps.cache-datasets.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p benchmarks/contextra-bench/tests/data/

          pip install huggingface_hub --quiet

          # LongMemEval-S: Original-Repo (xiaowu0162/longmemeval)
          python3 -c "
          from huggingface_hub import hf_hub_download
          import shutil, os, sys
          try:
              path = hf_hub_download(
                  repo_id='xiaowu0162/longmemeval',
                  filename='longmemeval_s',
                  repo_type='dataset',
                  token=os.environ.get('HF_TOKEN') or None
              )
              shutil.copy(path, 'benchmarks/contextra-bench/tests/data/longmemeval_s.jsonl')
              print(f'LongMemEval-S heruntergeladen: {os.path.getsize(path)} Bytes')
          except Exception as e:
              print(f'Error downloading LongMemEval-S: {e}', file=sys.stderr)
              sys.exit(1)
          " || {
            echo "LongMemEval/LoCoMo-Datensatz-Download fehlgeschlagen — Regressionsgate kann nicht verlässlich ausgeführt werden"
            exit 1
          }

          # LoCoMo: Öffentlich verfügbar via KimmoZZZ/locomo
          python3 -c "
          from huggingface_hub import hf_hub_download
          import shutil, os, sys
          try:
              path = hf_hub_download(
                  repo_id='KimmoZZZ/locomo',
                  filename='locomo10.json',
                  repo_type='dataset',
                  token=os.environ.get('HF_TOKEN') or None
              )
              shutil.copy(path, 'benchmarks/contextra-bench/tests/data/locomo_test.json')
              print(f'LoCoMo heruntergeladen: {os.path.getsize(path)} Bytes')
          except Exception as e:
              print(f'Error downloading LoCoMo: {e}', file=sys.stderr)
              sys.exit(1)
          " || {
            echo "LongMemEval/LoCoMo-Datensatz-Download fehlgeschlagen — Regressionsgate kann nicht verlässlich ausgeführt werden"
            exit 1
          }

      - name: Verify Dataset Existence Before Execution
        run: |
          LME="benchmarks/contextra-bench/tests/data/longmemeval_s.jsonl"
          LOCOMO="benchmarks/contextra-bench/tests/data/locomo_test.json"
          if [ ! -s "$LME" ] || [ ! -s "$LOCOMO" ]; then
            echo "LongMemEval/LoCoMo-Datensatz-Download fehlgeschlagen — Regressionsgate kann nicht verlässlich ausgeführt werden"
            exit 1
          fi
          echo "Beide Datensätze vorhanden."

      - name: Run LongMemEval Benchmark Execution
        run: |
          DATASET="benchmarks/contextra-bench/tests/data/longmemeval_s.jsonl"
          echo "Verwende Dataset: $DATASET ($(wc -c < "$DATASET") Bytes)"
          cargo run --locked -p contextra-bench --release -- long-mem-eval \
            --dataset "$DATASET" \
            --output benchmarks/results/long_mem_eval_results.json

      - name: Run LoCoMo Benchmark Execution
        run: |
          DATASET="benchmarks/contextra-bench/tests/data/locomo_test.json"
          echo "Verwende Dataset: $DATASET ($(wc -c < "$DATASET") Bytes)"
          cargo run --locked -p contextra-bench --release -- locomo \
            --dataset "$DATASET" \
            --output benchmarks/results/locomo_results.json

      - name: Evaluate Metrics Against Versioned Baseline
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Updating baseline on main branch..."
            cargo run -p xtask -- bench-gate --results benchmarks/results/current_metrics.json --baseline benchmarks/contextra-bench/baseline_metrics.json --threshold 0.05 --update
          else
            echo "Evaluating regression gate against main baseline..."
            cargo run -p xtask -- bench-gate --results benchmarks/results/current_metrics.json --baseline benchmarks/contextra-bench/baseline_metrics.json --threshold 0.05
          fi

      - name: Update Baseline Metrics (when explicitly requested via workflow_dispatch)
        if: ${{ github.event.inputs.update_baseline == 'true' }}
        run: |
          echo "Updating baseline_metrics.json with real dataset results..."
          python3 -c "
          import json, datetime, subprocess
          commit_hash = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode('utf-8').strip()
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          with open('benchmarks/results/current_metrics.json', 'r') as f:
              metrics = json.load(f)
          metrics['_status'] = 'real-dataset-baseline'
          metrics['_note'] = f'Erzeugt gegen echte Datensätze am {now} (Commit {commit_hash})'
          metrics['_dataset_source'] = 'xiaowu0162/longmemeval (longmemeval_s.jsonl, Original-Repo)'
          metrics['_locomo_source'] = 'LoCoMo-Dataset/LoCoMo (test.json)'
          metrics['_generated_at'] = now
          metrics['_commit_hash'] = commit_hash
          with open('benchmarks/contextra-bench/baseline_metrics.json', 'w') as f:
              json.dump(metrics, f, indent=2)
              f.write('\n')
          print('baseline_metrics.json erfolgreich aktualisiert.')
          "

      - name: Upload Retrieval Quality Regression Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-regression-metrics
          path: |
            benchmarks/results/
            benchmarks/contextra-bench/baseline_metrics.json

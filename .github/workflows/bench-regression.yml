name: Benchmark Regression Gate

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench-regression:
    name: Criterion Benchmarks Regression Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1.89.0
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run Criterion Benchmarks
        run: |
          cargo bench -p contextra-vector --bench distance_nan_impact_bench -- --save-baseline current
          cargo bench -p contextra-vector --bench hnsw_delete_search_bench -- --save-baseline current
          cargo bench -p contextra-db --bench rrf_allocation_bench -- --save-baseline current
          cargo bench -p contextra-store --bench wal_throughput_bench -- --save-baseline current
      - name: Assert No Regression (±5%)
        run: cargo xtask bench-gate --tolerance 0.05
      - name: Upload Benchmark Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.2.0
        with:
          name: criterion-results-${{ github.sha }}
          path: target/criterion/

  bandit-latency-budget:
    name: Bandit Latency Budget Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1.89.0
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask
      - name: Bandit Latency Budget Gate
        run: cargo run -p xtask --features contextra-router/bandit-routing -- check-bandit-latency-budget

# Takt: Post-Merge (Push auf main) / workflow_dispatch
# Zweck: Führt nach jedem Merge auf main Post-Merge-Berichte und Preflight-Prüfungen aus.
# Lokaler Befehl: cargo run -p xtask -- post-merge-report && cargo run -p xtask -- jules-preflight

name: Post-Merge Verification

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  post-merge-verify:
    name: Post-Merge Jules Preflight Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run Post-Merge Report
        run: cargo run -p xtask -- post-merge-report

      - name: Commit and push report changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ docs/unwrap_baseline_history.jsonl
          if git diff --staged --quiet; then
            echo "ℹ️ Keine Änderungen in results/ oder docs/unwrap_baseline_history.jsonl — kein Commit erforderlich."
          else
            git commit -m "chore(report): auto-update post-merge report and unwrap history [skip ci]"
            git push origin HEAD:gate-status
            echo "✅ Post-merge report und unwrap history erfolgreich ge-pusht."
          fi

      - name: Run Full Jules Preflight
        run: cargo run -p xtask -- jules-preflight

      - name: Report Failure Summary
        if: failure()
        run: |
          echo "### ❌ Post-Merge Jules Preflight Verification Failed" >> $GITHUB_STEP_SUMMARY
          echo "Reproduziere lokal mit:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cargo run -p xtask -- post-merge-report && cargo run -p xtask -- jules-preflight" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Report Post-Merge Regression Failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.setFailed("Post-Merge verification failed.");

name: Post-Merge Verification
on:
  push:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  post-merge-verify:
    name: Post-Merge Jules Preflight Verification
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Post-Merge Report
        run: cargo run -p xtask -- post-merge-report

      - name: Commit and push report changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ docs/unwrap_baseline_history.jsonl
          if git diff --staged --quiet; then
            echo "ℹ️ Keine Änderungen in results/ oder docs/unwrap_baseline_history.jsonl — kein Commit erforderlich."
          else
            git commit -m "chore(report): auto-update post-merge report and unwrap history [skip ci]"
            git push origin HEAD:gate-status
            echo "✅ Post-merge report und unwrap history erfolgreich ge-pusht."
          fi

      - name: Run Full Jules Preflight
        run: cargo run -p xtask -- jules-preflight

      - name: Report Post-Merge Regression Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed("Post-Merge verification failed.");

name: Post-Merge Verification
on:
  push:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  post-merge-verify:
    name: Post-Merge Jules Preflight Verification
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Post-Merge Report
        run: cargo xtask post-merge-report

      - name: Commit and push report changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ docs/unwrap_baseline_history.jsonl
          if git diff --staged --quiet; then
            echo "ℹ️ Keine Änderungen in results/ oder docs/unwrap_baseline_history.jsonl — kein Commit erforderlich."
          else
            git commit -m "chore(report): auto-update post-merge report and unwrap history [skip ci]"
            git push origin HEAD:main
            echo "✅ Post-merge report und unwrap history erfolgreich ge-pusht."
          fi

      - name: Run Full Jules Preflight
        run: cargo xtask jules-preflight

      - name: Report Post-Merge Regression Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = context.sha;
            const commitShort = commitSha.substring(0, 7);
            const dateStr = new Date().toISOString().slice(0, 10);
            const title = `post-merge-regression: ${commitShort} (${dateStr})`;

            // Duplikatsprüfung: Suche nach offenen Issues mit Label "post-merge-regression"
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'post-merge-regression'
            });

            const existingIssue = issues.find(issue => issue.title.includes(commitShort));
            if (existingIssue) {
              console.log(`Offenes Issue fuer Commit ${commitShort} existiert bereits (#${existingIssue.number}). Kein neues Issue erstellt.`);
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "## 🚨 Post-Merge Verification Failure",
              "",
              `Fehlschlag beim Ausfuehren von \`cargo xtask jules-preflight\` auf Branch \`main\`.`,
              "",
              "### Details",
              `- **Commit:** ${commitSha} (\`${commitShort}\`)`,
              `- **CI Run URL:** [View Workflow Run](${runUrl})`,
              `- **Datum:** ${dateStr}`,
              "",
              "### Handlungsanweisung",
              "Dieses Issue hat hoechste Prioritaet (\`priority-p0\`). Bitte den Regressions-Ursprung sofort untersuchen und einen Fix-PR erstellen.",
              "Offene Issues mit Label \`post-merge-regression\` sind vor der Formulierung neuer Prompts bevorzugt zu behandeln."
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ["post-merge-regression", "priority-p0"]
            });

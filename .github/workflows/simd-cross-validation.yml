# Takt: Nightly (03:00 UTC) / workflow_dispatch / pull_request (Pfadfilter)
# Zweck: Validiert SIMD-Kernel-Implementierungen gegen Skalar-Referenzen.
# Lokaler Befehl: cargo test -p contextra-simd --test simd_cross_validation

name: SIMD Cross Validation

on:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    paths:
      - 'crates/contextra-simd/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  simd-cross-validation:
    name: SIMD vs Scalar Cross-Validation (${{ matrix.target }}, rustflags="${{ matrix.rustflags }}")
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
        rustflags:
          - ""
          - "-C target-feature=-avx2,-avx512f"

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run SIMD Cross-Validation Tests
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo test -p contextra-simd --test simd_cross_validation --target ${{ matrix.target }}

      - name: Report Failure Summary
        if: failure()
        run: |
          echo "### ❌ SIMD Cross Validation Failed (${{ matrix.target }}, rustflags=\"${{ matrix.rustflags }}\")" >> $GITHUB_STEP_SUMMARY
          echo "Reproduziere lokal mit:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "RUSTFLAGS=\"${{ matrix.rustflags }}\" cargo test -p contextra-simd --test simd_cross_validation --target ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

# Tiefenprüfung = nicht-blockierend (mit Ausnahme der 4 Pflicht-CI-Jobs)
# Dieses Workflow-File fuehrt umfassende Tiefenpruefungen aus (Coverage, Integrationstests, Feature-Matrix, Cross-Platform, Binding-Checks).
# Die 4 Pflicht-CI-Jobs (compile-check, fmt, clippy, test) sind merge-blockierend (ohne continue-on-error), waehrend sonstige Tiefenpruefungen continue-on-error nutzen.

name: Rust CI (Tiefenprüfung)
on:
  push:
    branches: ["main", "master"]
  pull_request:

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  compile-check:
    name: Compile Check (cargo check)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@166de8caa14bb03d0e4ce3de7cc787f95ccf7188 # 1.89.0
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Workspace Compile Gate
        run: cargo run -p xtask -- check-compile

  fmt:
    name: Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@166de8caa14bb03d0e4ce3de7cc787f95ccf7188 # 1.89.0
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Run rustfmt check
        run: |
          cargo fmt --all -- --check || (echo "❌ Format Check fehlgeschlagen! Lokal beheben mit: cargo fmt --all && git commit --amend --no-edit" && exit 1)

  supply-chain:
    name: Dependency Security & License Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  coverage:
    name: Line Coverage Gate (>= 50%)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@166de8caa14bb03d0e4ce3de7cc787f95ccf7188 # 1.89.0
        with:
          toolchain: 1.89.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@4314395b773db6ec53370cf7e57cc6bfefb6ae8f # cargo-llvm-cov
      - name: Generate coverage & enforce threshold
        run: cargo llvm-cov --workspace --locked --fail-under-lines 50
      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: target/llvm-cov/html

  per-crate-coverage-report:
    name: Per-Crate Coverage Report (Non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@166de8caa14bb03d0e4ce3de7cc787f95ccf7188 # 1.89.0
        with:
          toolchain: 1.89.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@4314395b773db6ec53370cf7e57cc6bfefb6ae8f # cargo-llvm-cov
      - name: Pre-check Crate Names against Workspace Metadata
        run: |
          TARGET_CRATES="contextra-store contextra-infer-candle contextra-db contextra-vector"
          WORKSPACE_CRATES=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[].name')
          for crate in $TARGET_CRATES; do
            if ! echo "$WORKSPACE_CRATES" | grep -q -w "$crate"; then
              echo "❌ Error: Crate '$crate' does not exist in workspace metadata!"
              exit 1
            fi
          done
          echo "✅ All target crates verified against workspace metadata."
      - name: Generate Per-Crate Coverage Summary
        run: |
          echo "## Per-Crate Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Crate | Line Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY

          for crate in contextra-store contextra-infer-candle contextra-db contextra-vector; do
            COV_OUTPUT=$(cargo llvm-cov -p "$crate" --locked 2>&1)
            # Parse line coverage percentage from the TOTAL line
            PCT=$(echo "$COV_OUTPUT" | grep -E "^TOTAL" | awk '{print $(NF)}')
            if [ -z "$PCT" ]; then
              PCT="N/A"
            fi
            echo "| \`$crate\` | $PCT |" >> $GITHUB_STEP_SUMMARY
          done

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [compile-check]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@166de8caa14bb03d0e4ce3de7cc787f95ccf7188 # 1.89.0
        with:
          toolchain: 1.89.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check for duplicate symbols (fast pre-build gate)
        run: cargo run -p xtask -- check-duplicate-symbols
      - name: Lint unsafe slice bounds (SIMD OOB check)
        run: cargo run -p xtask -- lint-unsafe-slices
      - run: cargo clippy --locked --all-targets --workspace -- -D warnings

  asan-contextra-vector:
    name: AddressSanitizer Gate (contextra-vector)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@0e28dd9a7764e5f83064112bb1f24025a14c313c # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run contextra-vector tests with AddressSanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=address" cargo +nightly test -p contextra-vector --target x86_64-unknown-linux-gnu

  asan-contextra-vector-unequal-lengths:
    name: ASan Gate — u8 Distance Unequal Length Slices (contextra-vector)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [compile-check]
    # Dieser Job schlägt FEHL, solange P-G1 (AVX2 OOB-Fix) nicht gemergt ist.
    # Er ist absichtlich als Sicherheitsnetz konzipiert, kein continue-on-error.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@0e28dd9a7764e5f83064112bb1f24025a14c313c # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run u8 distance unequal-length tests with AddressSanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=address" cargo +nightly test \
            -p contextra-vector \
            --target x86_64-unknown-linux-gnu \
            -- test_u8_distance_unequal_lengths_return_error \
               test_avx2_u8_unequal_length_no_oob \
            2>&1

  miri-contextra-vector:
    name: Miri Gate (contextra-vector unsafe fn boundary tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [compile-check]
    continue-on-error: true  # Miri-Failures blockieren nicht den Merge, werden aber sichtbar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@0e28dd9a7764e5f83064112bb1f24025a14c313c # nightly
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run Miri on contextra-vector
        run: |
          # Nur Scalar-Pfad unter Miri (SIMD-Intrinsics werden von Miri nicht unterstützt)
          # Miri fängt OOB-Zugriffe im Scalar-Tail-Loop auf.
          MIRIFLAGS="-Zmiri-disable-isolation" cargo +nightly miri test \
            -p contextra-vector \
            -- test_u8_distance_unequal_lengths_return_error \
               test_scalar_u8_no_oob \
            2>&1

  cargo-hack-feature-check:
    name: Cargo Hack Feature Flag Matrix Check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@166de8caa14bb03d0e4ce3de7cc787f95ccf7188 # 1.89.0
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@cargo-hack
      - name: Run cargo hack --each-feature --workspace --no-dev-deps
        run: cargo hack check --each-feature --workspace --no-dev-deps

  feature-matrix:
    name: Feature Matrix Checks (Powerset CI §17)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [compile-check]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Workspace
          - crate: workspace
            flags: "--workspace --no-default-features"
          # contextra-store
          - crate: contextra-store
            flags: "-p contextra-store --no-default-features"
          - crate: contextra-store
            flags: "-p contextra-store --features block-cache-v2"
          - crate: contextra-store
            flags: "-p contextra-store --features fault-injection"
          - crate: contextra-store
            flags: "-p contextra-store --features block-cache-v2,fault-injection"
          # contextra-vector
          - crate: contextra-vector
            flags: "-p contextra-vector --no-default-features"
          - crate: contextra-vector
            flags: "-p contextra-vector --features experimental-diskann"
          - crate: contextra-vector
            flags: "-p contextra-vector --features experimental-rabitq"
          - crate: contextra-vector
            flags: "-p contextra-vector --features graph"
          - crate: contextra-vector
            flags: "-p contextra-vector --features partial-index-rebuild"
          - crate: contextra-vector
            flags: "-p contextra-vector --features experimental-diskann,experimental-rabitq,graph,partial-index-rebuild"
          # contextra-adapt
          - crate: contextra-adapt
            flags: "-p contextra-adapt --no-default-features"
          - crate: contextra-adapt
            flags: "-p contextra-adapt --features bandit-routing"
          - crate: contextra-adapt
            flags: "-p contextra-adapt --features flow-corrected-thompson"
          - crate: contextra-adapt
            flags: "-p contextra-adapt --features bandit-routing,flow-corrected-thompson"
          # contextra-crypto
          - crate: contextra-crypto
            flags: "-p contextra-crypto --no-default-features"
          - crate: contextra-crypto
            flags: "-p contextra-crypto --features kv-encryption"
          - crate: contextra-crypto
            flags: "-p contextra-crypto --features cloud-egress-guard"
          - crate: contextra-crypto
            flags: "-p contextra-crypto --features kv-encryption,cloud-egress-guard,test-utils"
          # contextra-router
          - crate: contextra-router
            flags: "-p contextra-router --no-default-features"
          - crate: contextra-router
            flags: "-p contextra-router --features bandit-routing"
          - crate: contextra-router
            flags: "-p contextra-router --features cloud-egress-guard"
          - crate: contextra-router
            flags: "-p contextra-router --features bandit-routing,cloud-egress-guard"
          # contextra-infer-onnx
          - crate: contextra-infer-onnx
            flags: "-p contextra-infer-onnx --no-default-features"
          - crate: contextra-infer-onnx
            flags: "-p contextra-infer-onnx --features onnx"
          # contextra-infer-candle
          - crate: contextra-infer-candle
            flags: "-p contextra-infer-candle --no-default-features"
          - crate: contextra-infer-candle
            flags: "-p contextra-infer-candle --features candle"
          - crate: contextra-infer-candle
            flags: "-p contextra-infer-candle --features kv-bridge,kv-stage-b"
          # contextra-db
          - crate: contextra-db
            flags: "-p contextra-db --no-default-features"
          - crate: contextra-db
            flags: "-p contextra-db --features reranking"
          - crate: contextra-db
            flags: "-p contextra-db --features volatile-vault"
          - crate: contextra-db
            flags: "-p contextra-db --features experimental-diskann"
          # contextra-graph
          - crate: contextra-graph
            flags: "-p contextra-graph --no-default-features"
          - crate: contextra-graph
            flags: "-p contextra-graph --features physio-percolation"
          # contextra-mcp
          - crate: contextra-mcp
            flags: "-p contextra-mcp --no-default-features"
          - crate: contextra-mcp
            flags: "-p contextra-mcp --features agent-workflows"
          - crate: contextra-mcp
            flags: "-p contextra-mcp --features onnx"
          - crate: contextra-mcp
            flags: "-p contextra-mcp --features candle"
          - crate: contextra-mcp
            flags: "-p contextra-mcp --features kv-bridge"
          # contextra facade
          - crate: contextra
            flags: "-p contextra --no-default-features"
          - crate: contextra
            flags: "-p contextra --all-features"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@166de8caa14bb03d0e4ce3de7cc787f95ccf7188 # 1.89.0
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check Feature Combination (${{ matrix.crate }} ${{ matrix.flags }})
        run: cargo check --locked ${{ matrix.flags }}

  maturin-dry-run:
    name: PyPI Wheel Build Check (Maturin Dry-Run)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@166de8caa14bb03d0e4ce3de7cc787f95ccf7188 # 1.89.0
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install maturin
        run: pip install maturin
      - name: Dry-run maturin build
        run: maturin build --manifest-path crates/contextra-py/Cargo.toml

  test:
    name: Test Suite (cargo-nextest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [compile-check]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@166de8caa14bb03d0e4ce3de7cc787f95ccf7188 # 1.89.0
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # nextest
      - name: Run Tests with Nextest
        run: cargo nextest run --locked --workspace --retries 0 --no-fail-fast
      - name: Report flaky tests
        if: always()
        run: |
          if ls target/nextest/default/*.xml 1> /dev/null 2>&1; then
            RETRY_COUNT=$(grep -o 'flaky="true"' target/nextest/default/*.xml 2>/dev/null | wc -l | tr -d ' ')
            if [ -n "$RETRY_COUNT" ] && [ "$RETRY_COUNT" -gt 0 ]; then
              echo "::warning::${RETRY_COUNT} flaky Test(s) erkannt — moegliche Race Conditions, siehe TESTING.md Abschnitt 2.6 (Concurrency)"
            fi
          fi
      - name: Run Doc Tests
        run: cargo test --doc --locked --workspace

  clippy-py:
    name: Clippy (contextra-py)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@166de8caa14bb03d0e4ce3de7cc787f95ccf7188 # 1.89.0
        with:
          toolchain: 1.89.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --manifest-path crates/contextra-py/Cargo.toml --all-targets -- -D warnings

  test-py:
    name: Test Suite (contextra-py)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@166de8caa14bb03d0e4ce3de7cc787f95ccf7188 # 1.89.0
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --manifest-path crates/contextra-py/Cargo.toml

  lockfile-check-py:
    name: Check contextra-py Lockfile in sync
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@166de8caa14bb03d0e4ce3de7cc787f95ccf7188 # 1.89.0
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check contextra-py Lockfile in sync
        run: |
          cd crates/contextra-py
          cargo update --dry-run --locked 2>&1 | grep "^Updating" && \
            echo "::error::contextra-py Cargo.lock is out of sync!" && exit 1 || true

  docid-128-check:
    name: DocId 128-bit Validation Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [compile-check]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@166de8caa14bb03d0e4ce3de7cc787f95ccf7188 # 1.89.0
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@cargo-hack
      - name: Workspace check with contextra-types/docid-128
        run: cargo hack check --workspace --ignore-unknown-features --features contextra-types/docid-128
      - name: Facade check with docid-128
        run: cargo check -p contextra --features docid-128
      - name: Tests in 64-bit mode (types, store, vector)
        run: cargo test -p contextra-types -p contextra-store -p contextra-vector
      - name: Tests in 128-bit mode (types, store, vector)
        run: cargo test -p contextra-types -p contextra-store -p contextra-vector --features contextra-types/docid-128

  test-cross-platform:
    name: Cross-Platform Core Tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@166de8caa14bb03d0e4ce3de7cc787f95ccf7188 # 1.89.0
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test core storage/crypto crates
        run: cargo test --locked -p contextra-core -p contextra-store -p contextra-crypto -p contextra-vector -p contextra-text -p contextra-graph -p contextra-checkpoint -p contextra-db -p contextra-durable-fs -p contextra-wire -p contextra-sys -p contextra-mvcc -p contextra-simd

  # KONSOLIDIERUNGS-HINWEIS: Der redundante context-gates Job wurde hier entfernt.
  # Die Kanonische Quelle für Context Integrity Gates ist .github/workflows/context-gates.yml,
  # welcher als dedizierter Workflow parallel auf push/pull_request läuft.

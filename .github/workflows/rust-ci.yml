# Tiefenprüfung (Stage 2 Deep CI Suite — Manual / Scheduled Dispatch)
# Dieser Workflow führt umfassende Tiefenprüfungen aus (ASan, Miri, Feature-Matrix, Cross-Platform).
# Er wird manuell per workflow_dispatch oder über Scheduled Audit ausgelöst.

name: Rust CI (Tiefenprüfung)

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  asan-contextra-vector:
    name: AddressSanitizer Gate (contextra-vector)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run contextra-vector tests with AddressSanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=address" cargo +nightly test -p contextra-vector --target x86_64-unknown-linux-gnu

  miri-contextra-vector:
    name: Miri Gate (contextra-vector unsafe fn boundary tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run Miri on contextra-vector
        run: |
          MIRIFLAGS="-Zmiri-disable-isolation" cargo +nightly miri test \
            -p contextra-vector \
            -- test_u8_distance_unequal_lengths_return_error \
               test_scalar_u8_no_oob \
            2>&1

  cargo-hack-feature-check:
    name: Cargo Hack Feature Flag Matrix Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # cargo-hack
      - name: Run cargo hack check
        run: cargo hack check --each-feature --workspace --all-targets --locked

  docid-128-check:
    name: DocId 128-bit Validation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # cargo-hack
      - name: Workspace check with contextra-types/docid-128
        run: cargo hack check --workspace --ignore-unknown-features --features contextra-types/docid-128
      - name: Tests in 128-bit mode (types, store, vector)
        run: cargo test -p contextra-types -p contextra-store -p contextra-vector --features contextra-types/docid-128

  test-cross-platform:
    name: Cross-Platform Core Tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test core storage/crypto crates
        run: cargo test --locked -p contextra-store -p contextra-crypto -p contextra-vector -p contextra-text -p contextra-graph -p contextra-checkpoint -p contextra-db

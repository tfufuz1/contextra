name: External DeletionProof Verifier CI

on:
  push:
    paths:
      - 'tools/contextra-verifier/**'
      - 'docs/verification/**'
  pull_request:
    paths:
      - 'tools/contextra-verifier/**'
      - 'docs/verification/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-verifier-tests:
    name: Verifier Python Unit Tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/contextra-verifier/requirements.txt

      - name: Run unittest suite
        run: |
          python3 -m unittest discover -s tools/contextra-verifier/tests -v

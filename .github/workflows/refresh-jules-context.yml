# .github/workflows/refresh-jules-context.yml
# Erzeugt .agents/jules/context/SESSION_START.md als Artefakt und prüft, ob das Setup läuft.
#
# Änderung gegenüber der Vorfassung (SPEC 4.3.0):
#   - Pfade von `agents/` auf `.agents/` korrigiert (vorher lief der Job ins Leere).
#   - Der Commit-Schritt auf main ist entfernt. SESSION_START.md steht in .gitignore und
#     wird nicht versioniert; ein `git add` hätte nichts festgehalten, nur Rauschen erzeugt.
#   - Berechtigung auf contents: read gesenkt. Der Job schreibt nichts ins Repository.
#
# NICHT merge-blockierend — informativ.
# Geschützter Pfad (.github/**): Diese Datei wird nur durch einen Menschen übernommen.

name: Refresh Jules Context

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-context:
    name: Refresh .agents/jules/context/SESSION_START.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 500

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run refresh-context.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .agents/jules/setup/refresh-context.sh

      - name: Upload SESSION_START.md as artifact
        uses: actions/upload-artifact@v4
        with:
          name: session-start-preview
          path: .agents/jules/context/SESSION_START.md
          retention-days: 7

name: contextra-py CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  lockfile-check-py:
    name: Lockfile Check (contextra-py)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.89.0

      - name: Check workspace Cargo.lock integrity for contextra-py
        run: cargo check --locked -p contextra-py

  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.89.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install maturin and pytest
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio

      - name: Build contextra-py in debug mode
        run: |
          maturin develop --manifest-path crates/contextra-py/Cargo.toml

      - name: Run pytest
        run: |
          pytest crates/contextra-py/tests

  clippy-py:
    name: Clippy (contextra-py)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.89.0
          components: clippy

      - name: Run clippy
        run: cargo clippy -p contextra-py --all-targets -- -D warnings

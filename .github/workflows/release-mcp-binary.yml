name: Release memfuse-mcp-server Binary

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-binary:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked -p memfuse-mcp --bin memfuse-mcp-server --target ${{ matrix.target }}

      - name: Package release artifact
        shell: bash
        run: |
          STAGE_DIR="staging_${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/memfuse-mcp-server.exe" "$STAGE_DIR/"
            cd "$STAGE_DIR"
            7z a "../memfuse-mcp-server-${{ matrix.target }}.zip" memfuse-mcp-server.exe
          else
            cp "target/${{ matrix.target }}/release/memfuse-mcp-server" "$STAGE_DIR/"
            cd "$STAGE_DIR"
            tar -czvf "../memfuse-mcp-server-${{ matrix.target }}.tar.gz" memfuse-mcp-server
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: memfuse-mcp-server-${{ matrix.target }}.${{ matrix.archive_ext }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-binary
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd release-artifacts
          sha256sum memfuse-mcp-server-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/memfuse-mcp-server-*
            release-artifacts/SHA256SUMS
          generate_release_notes: true

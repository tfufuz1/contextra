name: Release contextra-mcp-server Binary

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-binary:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked -p contextra-mcp --bin contextra-mcp-server --target ${{ matrix.target }}

      - name: Package release artifact
        shell: bash
        run: |
          STAGE_DIR="staging_${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/contextra-mcp-server.exe" "$STAGE_DIR/"
            cd "$STAGE_DIR"
            7z a "../contextra-mcp-server-${{ matrix.target }}.zip" contextra-mcp-server.exe
          else
            cp "target/${{ matrix.target }}/release/contextra-mcp-server" "$STAGE_DIR/"
            cd "$STAGE_DIR"
            tar -czvf "../contextra-mcp-server-${{ matrix.target }}.tar.gz" contextra-mcp-server
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: contextra-mcp-server-${{ matrix.target }}.${{ matrix.archive_ext }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-binary
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd release-artifacts
          sha256sum contextra-mcp-server-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release-artifacts/contextra-mcp-server-*
            release-artifacts/SHA256SUMS
          generate_release_notes: true

name: Correctness Proof Tests
on: [push, pull_request]

jobs:
  proof-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: L1 — TOCTOU put_if_absent (S1-01)
        run: cargo test -p memfuse-store --test toctou_put_if_absent -- --nocapture
      - name: L1 — NaN Validation Policy (S1-11)
        run: cargo test -p memfuse-vector --test nan_validation_policy -- --nocapture
      - name: L1 — Search Result Bound (S1-02)
        run: cargo test -p memfuse-db --test search_result_bound -- --nocapture
      - name: L1 — Manifest Corruption (S1-03)
        run: cargo test -p memfuse-store --test manifest_corruption -- --nocapture
      - name: L1 — BM25 Tombstone Read-Your-Writes (S1-04)
        run: cargo test -p memfuse-text --test tombstone_read_your_writes -- --nocapture
      - name: L1 — source_doc_ids Populated (S1-10)
        run: cargo test -p memfuse-graph --test source_doc_ids_populated -- --nocapture
      - name: L1 — WAL Truncate Ordering (S1-05)
        run: cargo test -p memfuse-store --test wal_truncate_ordering -- --nocapture
      - name: L1 — HNSW deleted_nodes Lock Contention (S1-11)
        run: cargo test -p memfuse-vector --test deleted_nodes_lock_contention -- --nocapture
      - name: L0 — Static Audit Lints (S3-01)
        run: |
          cargo xtask check-max-results-unbound
          cargo xtask check-toctou-defaults
          cargo xtask check-nan-hot-loop
          cargo xtask check-result-dropped-io
      - name: Coverage Gate
        run: |
          cargo llvm-cov --workspace --exclude memfuse-py --json --output-path coverage.json
          cargo xtask check-coverage-gate coverage.json

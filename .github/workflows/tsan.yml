name: ThreadSanitizer Race Detection
on:
  schedule:
    # Täglich 03:00 UTC (nach chaos.yml um 02:00)
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/contextra-store/**'
      - 'crates/contextra-vector/**'
      - 'crates/contextra-graph/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tsan:
    name: ThreadSanitizer — Race-Condition Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install nightly toolchain
        run: rustup target add x86_64-unknown-linux-gnu

      - name: TSan — TOCTOU put_if_absent (B-1)
        env:
          RUSTFLAGS: "-Z sanitizer=thread -Cunsafe-allow-abi-mismatch=sanitizer"
        run: |
          cargo +nightly test -p contextra-store \
            --test toctou_put_if_absent \
            --target x86_64-unknown-linux-gnu \
            -- --test-threads=1 --nocapture
        timeout-minutes: 10

      - name: TSan — deleted_nodes Lock-Contention (B-8)
        env:
          RUSTFLAGS: "-Z sanitizer=thread -Cunsafe-allow-abi-mismatch=sanitizer"
        run: |
          cargo +nightly test -p contextra-vector \
            --test deleted_nodes_lock_contention \
            --target x86_64-unknown-linux-gnu \
            -- --test-threads=1 --nocapture
        timeout-minutes: 10

      - name: TSan — WAL Concurrent Flush+Truncate (B-7)
        env:
          RUSTFLAGS: "-Z sanitizer=thread -Cunsafe-allow-abi-mismatch=sanitizer"
        run: |
          cargo +nightly test -p contextra-store \
            --test wal_truncate_ordering \
            --target x86_64-unknown-linux-gnu \
            -- --test-threads=1 --nocapture
        timeout-minutes: 10

      - name: TSan — CSR Concurrent Insert+Query
        env:
          RUSTFLAGS: "-Z sanitizer=thread -Cunsafe-allow-abi-mismatch=sanitizer"
        run: |
          cargo +nightly test -p contextra-graph \
            --test stress_dag \
            --target x86_64-unknown-linux-gnu \
            -- --test-threads=1 --nocapture
        timeout-minutes: 15

      - name: Report TSan Failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.setFailed("TSan Race Detection failed");

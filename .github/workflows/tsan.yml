# Takt: Nightly (03:00 UTC) / workflow_dispatch / pull_request (Pfadfilter)
# Zweck: Erkennt Data Races mittels ThreadSanitizer.
# Lokaler Befehl: RUSTFLAGS="-Z sanitizer=thread -Cunsafe-allow-abi-mismatch=sanitizer" cargo +nightly test -p contextra-store --test toctou_put_if_absent --target x86_64-unknown-linux-gnu -- --test-threads=1

name: ThreadSanitizer Race Detection
on:
  schedule:
    # Täglich 03:00 UTC (nach chaos.yml um 02:00)
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/contextra-store/**'
      - 'crates/contextra-vector/**'
      - 'crates/contextra-graph/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tsan:
    name: ThreadSanitizer — Race-Condition Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: ThreadSanitizer — Store TOCTOU Race Detection (S1-01)
        run: |
          RUSTFLAGS="-Z sanitizer=thread -Cunsafe-allow-abi-mismatch=sanitizer" cargo +nightly test \
            -p contextra-store --test toctou_put_if_absent \
            --target x86_64-unknown-linux-gnu -- --test-threads=1 --nocapture

      - name: ThreadSanitizer — Vector Deleted Nodes Lock Contention (S1-11)
        run: |
          RUSTFLAGS="-Z sanitizer=thread -Cunsafe-allow-abi-mismatch=sanitizer" cargo +nightly test \
            -p contextra-vector --test deleted_nodes_lock_contention \
            --target x86_64-unknown-linux-gnu -- --test-threads=1 --nocapture

      - name: ThreadSanitizer — Store WAL Truncate Ordering (S1-14)
        run: |
          RUSTFLAGS="-Z sanitizer=thread -Cunsafe-allow-abi-mismatch=sanitizer" cargo +nightly test \
            -p contextra-store --test wal_truncate_ordering \
            --target x86_64-unknown-linux-gnu -- --test-threads=1 --nocapture

      - name: ThreadSanitizer — Graph Concurrent Edge Insertions & Traversal (S1-15)
        run: |
          RUSTFLAGS="-Z sanitizer=thread -Cunsafe-allow-abi-mismatch=sanitizer" cargo +nightly test \
            -p contextra-graph --test stress_dag \
            --target x86_64-unknown-linux-gnu -- --test-threads=1 --nocapture

      - name: Report Failure Summary
        if: failure()
        run: |
          echo "### ❌ ThreadSanitizer Race Detection Failed" >> $GITHUB_STEP_SUMMARY
          echo "Reproduziere lokal mit:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "RUSTFLAGS=\"-Z sanitizer=thread -Cunsafe-allow-abi-mismatch=sanitizer\" cargo +nightly test -p contextra-store --test toctou_put_if_absent --target x86_64-unknown-linux-gnu -- --test-threads=1 --nocapture" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

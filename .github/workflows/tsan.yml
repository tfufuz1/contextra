name: ThreadSanitizer Race Detection
on:
  schedule:
    # Täglich 03:00 UTC (nach chaos.yml um 02:00)
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/memfuse-store/**'
      - 'crates/memfuse-vector/**'
      - 'crates/memfuse-graph/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tsan:
    name: ThreadSanitizer — Race-Condition Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2

      - name: Install nightly toolchain
        run: rustup target add x86_64-unknown-linux-gnu

      - name: TSan — TOCTOU put_if_absent (B-1)
        env:
          RUSTFLAGS: "-Z sanitizer=thread -Cunsafe-allow-abi-mismatch=sanitizer"
        run: |
          cargo +nightly test -p memfuse-store \
            --test toctou_put_if_absent \
            --target x86_64-unknown-linux-gnu \
            -- --test-threads=1 --nocapture
        timeout-minutes: 10

      - name: TSan — deleted_nodes Lock-Contention (B-8)
        env:
          RUSTFLAGS: "-Z sanitizer=thread -Cunsafe-allow-abi-mismatch=sanitizer"
        run: |
          cargo +nightly test -p memfuse-vector \
            --test deleted_nodes_lock_contention \
            --target x86_64-unknown-linux-gnu \
            -- --test-threads=1 --nocapture
        timeout-minutes: 10

      - name: TSan — WAL Concurrent Flush+Truncate (B-7)
        env:
          RUSTFLAGS: "-Z sanitizer=thread -Cunsafe-allow-abi-mismatch=sanitizer"
        run: |
          cargo +nightly test -p memfuse-store \
            --test wal_truncate_ordering \
            --target x86_64-unknown-linux-gnu \
            -- --test-threads=1 --nocapture
        timeout-minutes: 10

      - name: TSan — CSR Concurrent Insert+Query
        env:
          RUSTFLAGS: "-Z sanitizer=thread -Cunsafe-allow-abi-mismatch=sanitizer"
        run: |
          cargo +nightly test -p memfuse-graph \
            --test stress_dag \
            --target x86_64-unknown-linux-gnu \
            -- --test-threads=1 --nocapture
        timeout-minutes: 15

      - name: Report TSan Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'schedule') {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔒 TSan Race Detected (${new Date().toISOString().slice(0, 10)})`,
                body: `ThreadSanitizer hat eine Race-Condition in [Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) gefunden.\n\nLokal reproduzieren:\n\`\`\`bash\njust tsan\n\`\`\``,
                labels: ["bug", "race-condition", "tsan"]
              });
            }
            core.setFailed("TSan Race Detection failed");

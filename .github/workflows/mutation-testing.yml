name: Mutation Testing
on:
  # Wöchentlicher automatischer Lauf jeden Montag um 03:00 UTC
  # (Frequenz abgestimmt auf die 45-Minuten-Timeout-Begrenzung für Mutation Testing)
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      crate:
        description: 'Target crate for mutation testing'
        required: true
        default: 'contextra-crypto'
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  mutation-testing:
    name: Cargo Mutants Runner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@e0956f9d9dbb1e627ef0de00822045c6cd14c74e # cargo-mutants

      - name: Determine Target Crates
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "crates=${{ github.event.inputs.crate }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "crates=contextra-crypto contextra-checkpoint contextra-store contextra-db contextra-vector contextra-text contextra-graph contextra-rank" >> "$GITHUB_OUTPUT"
          else
            echo "crates=contextra-crypto" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Mutation Tests & Record Scores
        run: |
          for crate in ${{ steps.target.outputs.crates }}; do
            echo "Running cargo mutants for crate: $crate"
            OUTPUT=$(cargo mutants -p "$crate" --timeout 120 --minimum-test-timeout 30 --in-place 2>&1 | tee /dev/stderr) || true

            SUMMARY_LINE=$(echo "$OUTPUT" | grep -E "^[0-9]+ mutants? tested" | tail -n 1)
            if [ -n "$SUMMARY_LINE" ]; then
              echo "Result for $crate: $SUMMARY_LINE"
            fi
          done

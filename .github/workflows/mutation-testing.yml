name: Mutation Testing
on:
  workflow_dispatch:
    inputs:
      crate:
        description: 'Target crate for mutation testing'
        required: true
        default: 'contextra-crypto'
        type: string
  pull_request:
    paths:
      - 'crates/contextra-checkpoint/**'
      - 'crates/contextra-crypto/**'
      - 'crates/contextra-store/**'
      - 'crates/contextra-candle/**'
      - 'crates/contextra-db/**'
      - 'crates/contextra-vector/**'
      - 'crates/contextra-text/**'
      - 'crates/contextra-graph/**'
      - 'crates/contextra-rank/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  mutation-testing:
    name: Cargo Mutants Runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@e0956f9d9dbb1e627ef0de00822045c6cd14c74e # cargo-mutants

      - name: Determine Target Crates
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "crates=${{ github.event.inputs.crate }}" >> "$GITHUB_OUTPUT"
          else
            CRATES=""
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^crates/contextra-checkpoint/'; then
              CRATES="$CRATES contextra-checkpoint"
            fi
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^crates/contextra-crypto/'; then
              CRATES="$CRATES contextra-crypto"
            fi
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^crates/contextra-store/'; then
              CRATES="$CRATES contextra-store"
            fi
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^crates/contextra-candle/'; then
              CRATES="$CRATES contextra-candle"
            fi
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^crates/contextra-db/'; then
              CRATES="$CRATES contextra-db"
            fi
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^crates/contextra-vector/'; then
              CRATES="$CRATES contextra-vector"
            fi
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^crates/contextra-text/'; then
              CRATES="$CRATES contextra-text"
            fi
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^crates/contextra-graph/'; then
              CRATES="$CRATES contextra-graph"
            fi
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^crates/contextra-rank/'; then
              CRATES="$CRATES contextra-rank"
            fi
            if [ -z "$CRATES" ]; then
              CRATES="contextra-crypto"
            fi
            echo "crates=$CRATES" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Mutation Tests & Record Scores
        run: |
          for crate in ${{ steps.target.outputs.crates }}; do
            echo "Running cargo mutants for crate: $crate"
            OUTPUT=$(cargo mutants -p "$crate" --timeout 120 --minimum-test-timeout 30 --in-place 2>&1 | tee /dev/stderr)

            SUMMARY_LINE=$(echo "$OUTPUT" | grep -E "^[0-9]+ mutants? tested" | tail -n 1)
            if [ -z "$SUMMARY_LINE" ]; then
              echo "::error::Could not parse summary line from cargo mutants output for $crate"
              exit 1
            fi

            TOTAL=$(echo "$SUMMARY_LINE" | sed -nE "s/^([0-9]+) mutants? tested.*/\1/p")
            CAUGHT=$(echo "$SUMMARY_LINE" | sed -nE "s/.*: ([0-9]+) caught.*/\1/p")
            if [ -z "$CAUGHT" ]; then
              CAUGHT=0
            fi

            if [ -z "$TOTAL" ]; then
              echo "::error::Failed to parse mutant count numbers from summary line: \"$SUMMARY_LINE\""
              exit 1
            fi

            echo "Recording mutation score for $crate: total=$TOTAL, caught=$CAUGHT"
            cargo run -p xtask -- mutation-score-record --crate "$crate" --total "$TOTAL" --caught "$CAUGHT"
          done

      - name: Report Failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.setFailed("Mutation testing failed.");

name: Unwrap Baseline Check

on:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  unwrap-baseline-check:
    name: Check & Record Unwrap Baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@166de8caa14bb03d0e4ce3de7cc787f95ccf7188 # 1.89.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run xtask panic-inventory and enforce ratchet
        run: |
          if [ ! -f .github/unwrap_baseline.txt ]; then
            echo "::error::Baseline file .github/unwrap_baseline.txt missing"
            exit 1
          fi

          BASELINE=$(tr -d '\r\n ' < .github/unwrap_baseline.txt)
          if ! [[ "$BASELINE" =~ ^[0-9]+$ ]]; then
            echo "::error::Baseline file .github/unwrap_baseline.txt does not contain a valid integer: '$BASELINE'"
            exit 1
          fi

          OUTPUT=$(cargo xtask panic-inventory --exclude-tests)
          echo "$OUTPUT"
          COUNT=$(echo "$OUTPUT" | grep -oP '\d+(?= panic entries found)')
          echo "Production panic/unwrap count: $COUNT"
          echo "Current baseline: $BASELINE"

          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::Production panic/unwrap count increased from $BASELINE to $COUNT"
            exit 1
          fi

          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice::Ratchet tightening: lowering baseline from $BASELINE to $COUNT"
            echo "$COUNT" > .github/unwrap_baseline.txt

            DATE=$(date -u +%Y-%m-%d)
            SHA=$(git rev-parse --short HEAD)
            echo "{\"date\":\"$DATE\",\"commit\":\"$SHA\",\"total\":$COUNT}" >> docs/unwrap_baseline_history.jsonl
          fi

      - name: Create or Update Pull Request for Baseline Ratchet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/unwrap_baseline.txt docs/unwrap_baseline_history.jsonl
          if git diff --staged --quiet; then
            echo "ℹ️ No changes in baseline or history — no commit or PR required."
          else
            EXISTING_PR=$(gh pr list --state open --json number,headRefName | jq -r '.[] | select(.headRefName | startswith("chore/unwrap-baseline-")) | .number' | head -n 1)
            if [ -n "$EXISTING_PR" ]; then
              EXISTING_BRANCH=$(gh pr list --state open --json number,headRefName | jq -r ".[] | select(.number == $EXISTING_PR) | .headRefName")
              echo "Found existing open baseline PR #$EXISTING_PR with branch $EXISTING_BRANCH, updating..."
              git commit -m "chore(unwrap-baseline): update unwrap baseline history and ratchet [skip ci]"
              git push origin "HEAD:refs/heads/$EXISTING_BRANCH" --force
              echo "✅ Successfully updated existing PR #$EXISTING_PR."
            else
              NEW_BRANCH="chore/unwrap-baseline-${{ github.run_id }}"
              echo "Creating new branch $NEW_BRANCH and PR..."
              git checkout -b "$NEW_BRANCH"
              git commit -m "chore(unwrap-baseline): update unwrap baseline history and ratchet [skip ci]"
              git push origin "$NEW_BRANCH"
              gh pr create \
                --title "chore(unwrap-baseline): update unwrap baseline history and ratchet" \
                --body "Automated unwrap baseline ratchet update." \
                --base main \
                --head "$NEW_BRANCH"
              echo "✅ Successfully created new PR for $NEW_BRANCH."
            fi
          fi

name: Update Prompter-Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prompter-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Prompter Data
        run: cargo run -p xtask -- gen-prompter-data

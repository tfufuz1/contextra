name: Flake Report Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flake-report:
    name: Flake Report Run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1.89.0
        with:
          toolchain: 1.89.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install nextest
        uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # cargo-nextest

      - name: Run Flake Report
        run: |
          cargo run --manifest-path xtask/Cargo.toml -- flake-report --runs 10 --json > flake_output.json || true
          cat flake_output.json

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.2.0
        with:
          name: flake-report-results
          path: .jules/local/flake-report.json

      - name: Process Flake Issues
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.0
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('.jules/local/flake-report.json')) {
              return;
            }
            const data = JSON.parse(fs.readFileSync('.jules/local/flake-report.json', 'utf8'));
            if (data.flaky_detected) {
              const title = '[flake] Automated Nightly Flake Report Detection';
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
              });
              const exists = issues.data.some(i => i.title === title);
              if (!exists) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: `Nightly Flake Report hat Test-Flakiness erkannt.\nRuns: ${data.runs}\nSuccessful: ${data.successful_runs}\nRate: ${data.success_rate * 100}%`,
                });
              }
            }

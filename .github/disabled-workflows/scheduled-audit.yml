name: Scheduled Proactive Audit
on:
  schedule:
    # Jeden Freitag 22:00 UTC
    - cron: "0 22 * * 5"
  workflow_dispatch: {}

jobs:
  prepare-audit-context:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    outputs:
      task_file: ${{ steps.task.outputs.task_file }}
      task_date: ${{ steps.task.outputs.task_date }}
      task_created: ${{ steps.task.outputs.task_created }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Prüfe und erstelle Audit-Task-Datei
        id: task
        run: |
          YEAR_WEEK=$(date -u +'%Y-W%V')
          DATE=$(date -u +'%Y-%m-%d')
          TASK_FILE=".jules/tasks/AUDIT-${YEAR_WEEK}.toml"

          echo "task_date=$YEAR_WEEK" >> "$GITHUB_OUTPUT"
          echo "task_file=$TASK_FILE" >> "$GITHUB_OUTPUT"

          if [ -f "$TASK_FILE" ]; then
            echo "::notice::Audit-Task-Datei $TASK_FILE existiert bereits für ISO-Woche $YEAR_WEEK. Überspringe Erstellung."
            echo "task_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p .jules/tasks

          SHAS=$(git log --since="7 days ago" --format="%H" --no-merges)
          if [ -z "$SHAS" ]; then
            SHA_LIST='# Keine Commits in den letzten 7 Tagen'
          else
            SHA_LIST=$(echo "$SHAS" | sed 's/^/"/;s/$/",/')
          fi

          cat << EOF > "$TASK_FILE"
# Audit-Task-Karte
# ID Format: AUDIT-YYYY-Www
id        = "AUDIT-${YEAR_WEEK}"
title     = "Woechentlicher Proaktiv-Audit-Auftrag ${YEAR_WEEK}"
crate     = "workspace"
tier      = 1
risk      = "sec"
goal      = "Proaktive Analyse der Commits der letzten 7 Tage auf Race Conditions, unwrap-Regressions, Silent Failures und DAG-Grenzverletzungen."
non_goals = ["Refactoring ausserhalb verifizierter Befunde", "Stilles Ignorieren nicht verifizierter Findings"]
scope     = ["crates/**", "xtask/**"]
forbidden = ["capabilities.toml", "AGENTS.md", "rust-toolchain.toml", "deny.toml", ".jules/setup/**"]
invariants = ["Zero-Panic", "P28 Determinismus", "Audit Intake Protocol"]
acceptance = [
  "cargo test --workspace --locked",
  "cargo xtask check-ring-layering",
  "cargo xtask panic-inventory"
]
evidence_required = ["Verifizierte Befunde mit Test oder Entkraeftungsbegruendung im PR-Text"]

[audit_context]
created_date = "${DATE}"
instructions = "Lies .jules/AUDIT_INTAKE_PROTOCOL.md. Führe 'git show <sha>' für die aufgeführten commit_shas aus, um Diff/Änderungen zu analysieren. Jeder Fund muss gegen den AKTUELLEN Quellcode verifiziert werden."
commit_shas = [
${SHA_LIST}
]

[budget]
files = 10
lines = 300
iterations = 10
EOF

          echo "task_created=true" >> "$GITHUB_OUTPUT"

      - name: Erstelle Pull Request mit Audit-Task
        if: steps.task.outputs.task_created == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          branch: automated/weekly-audit-task-${{ steps.task.outputs.task_date }}
          title: "Wöchentlicher Audit-Auftrag ${{ steps.task.outputs.task_date }}"
          commit-message: "chore(audit): add weekly proactive audit task ${{ steps.task.outputs.task_date }}"
          body: |
            Automatischer wöchentlicher Proaktiv-Audit-Auftrag in `${{ steps.task.outputs.task_file }}`.

            WICHTIG:
            - Befolge `.jules/AUDIT_INTAKE_PROTOCOL.md` — verifiziere JEDEN Fund gegen den AKTUELLEN Code, bevor du etwas änderst.
            - Führe `git show <sha>` aus, um Commit-Änderungen zu untersuchen.
            - Verwende `cargo xtask panic-inventory` zur unwrap/expect-Prüfung.
          delete-branch: true

  trigger-mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Trigger Rotating Mutation Testing Workflow
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const crates = ["contextra-graph", "contextra-vector", "contextra-agent", "contextra-db"];

            // Berechne ISO-Kalenderwoche fuer konsistente woechentliche Rotation
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + 4 - (d.getDay() || 7));
            const yearStart = new Date(d.getFullYear(), 0, 1);
            const weekNumber = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);

            const targetCrate = crates[weekNumber % crates.length];
            console.log(`KW ${weekNumber}: Rotierendes Fokus-Crate fuer Mutation-Testing ist '${targetCrate}'`);

            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "mutation-testing.yml",
                ref: context.ref || "main",
                inputs: {
                  crate: targetCrate
                }
              });
              console.log(`Workflow mutation-testing.yml fuer Crate '${targetCrate}' erfolgreich via workflow_dispatch ausgeloest.`);
            } catch (err) {
              console.log(`Hinweis beim Ausloesen von mutation-testing.yml fuer ${targetCrate}:`, err.message);
            }

# Jules-Dispatch Workflow
# Reagiert auf @jules-Kommentare in PRs und führt Gate-Checks aus.
# Sicherheit: Nur Org-Member dürfen Dispatch-Befehle auslösen.
#
# Unterstützte Befehle (im Kommentar):
#   @jules fix-ci       — analysiert fehlgeschlagene CI-Jobs, postet Befund
#   @jules check-gates  — führt alle Gates aus, meldet Befunde als Kommentar
#   @jules recheck      — wiederholt Submit-Gate-Check
#
# WICHTIG: Dieser Workflow ändert niemals Gates, Lints, Ratchets oder
# den Toolchain-Pin, um Rot zu beseitigen (REQ-QA-010).

name: Jules Dispatch

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  dispatch:
    name: Jules Dispatch Handler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Nur auf PR-Kommentare reagieren, die einen Jules-Befehl enthalten
    if: |
      (
        github.event_name == 'issue_comment' && github.event.issue.pull_request != null ||
        github.event_name == 'pull_request_review_comment'
      ) && (
        contains(github.event.comment.body, '@jules fix-ci') ||
        contains(github.event.comment.body, '@jules check-gates') ||
        contains(github.event.comment.body, '@jules recheck')
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Sicherheitscheck: Nur Org-Member oder Kollaboratoren dürfen Dispatch auslösen.
      # Externe Nutzer können so keine unkontrollierten CI-Läufe triggern.
      - name: Verify commenter is org member or collaborator
        id: auth-check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const actor = context.actor;
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // Prüfe Kollaborator-Status (setzt implizit Org-Membership voraus bei privaten Repos)
            try {
              const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: actor,
              });
              const level = perm.permission;
              if (!['admin', 'write', 'maintain'].includes(level)) {
                core.setFailed(`@${actor} hat nicht die nötige Berechtigung (${level}) für Jules-Dispatch-Befehle.`);
                return;
              }
              console.log(`✅ @${actor} ist authorisiert (Berechtigung: ${level})`);
              core.setOutput('authorized', 'true');
            } catch (err) {
              core.setFailed(`Berechtigungsprüfung fehlgeschlagen für @${actor}: ${err.message}`);
            }
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust Toolchain
        if: steps.auth-check.outputs.authorized == 'true'
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Setup Rust Cache
        if: steps.auth-check.outputs.authorized == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            xtask

      # ── @jules fix-ci ──────────────────────────────────────────────────────────
      - name: "[fix-ci] Ring Layering Check"
        if: steps.auth-check.outputs.authorized == 'true' && contains(github.event.comment.body, '@jules fix-ci')
        id: fix-ci-ring
        continue-on-error: true
        run: cargo xtask check-ring-layering --strict 2>&1 | tee /tmp/ring-layering.txt

      - name: "[fix-ci] Unsafe Islands Check"
        if: steps.auth-check.outputs.authorized == 'true' && contains(github.event.comment.body, '@jules fix-ci')
        id: fix-ci-unsafe
        continue-on-error: true
        run: cargo xtask check-unsafe-islands 2>&1 | tee /tmp/unsafe-islands.txt

      - name: "[fix-ci] Security Stubs Check"
        if: steps.auth-check.outputs.authorized == 'true' && contains(github.event.comment.body, '@jules fix-ci')
        id: fix-ci-stubs
        continue-on-error: true
        run: cargo xtask check-security-stubs 2>&1 | tee /tmp/security-stubs.txt

      - name: "[fix-ci] Post fix-ci Results"
        if: steps.auth-check.outputs.authorized == 'true' && contains(github.event.comment.body, '@jules fix-ci')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const readSnippet = (path) => {
              try {
                const content = fs.readFileSync(path, 'utf8');
                return content.length > 2000 ? content.slice(0, 2000) + '\n…(gekürzt)' : content;
              } catch { return '(kein Output)'; }
            };

            const ring    = readSnippet('/tmp/ring-layering.txt');
            const unsafe_ = readSnippet('/tmp/unsafe-islands.txt');
            const stubs   = readSnippet('/tmp/security-stubs.txt');

            const ringOk   = '${{ steps.fix-ci-ring.outcome }}'   === 'success';
            const unsafeOk = '${{ steps.fix-ci-unsafe.outcome }}' === 'success';
            const stubsOk  = '${{ steps.fix-ci-stubs.outcome }}'  === 'success';

            const body = [
              `## 🔍 Jules fix-ci — Befund`,
              ``,
              `| Gate | Status |`,
              `|------|--------|`,
              `| ring-layering | ${ringOk   ? '✅' : '🔴'} |`,
              `| unsafe-islands | ${unsafeOk ? '✅' : '🔴'} |`,
              `| security-stubs | ${stubsOk  ? '✅' : '🔴'} |`,
              ``,
              `<details><summary>ring-layering Output</summary>`,
              ``,
              `\`\`\``,
              ring,
              `\`\`\``,
              `</details>`,
              ``,
              `<details><summary>unsafe-islands Output</summary>`,
              ``,
              `\`\`\``,
              unsafe_,
              `\`\`\``,
              `</details>`,
              ``,
              `<details><summary>security-stubs Output</summary>`,
              ``,
              `\`\`\``,
              stubs,
              `\`\`\``,
              `</details>`,
              ``,
              `> ⚠️ Jules ändert keine Gates, Lints oder Ratchets (REQ-QA-010).`,
            ].join('\n');

            const issueNumber = context.payload.issue?.number
              ?? context.payload.pull_request?.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNumber,
              body,
            });
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── @jules check-gates ─────────────────────────────────────────────────────
      - name: "[check-gates] Ring Layering"
        if: steps.auth-check.outputs.authorized == 'true' && contains(github.event.comment.body, '@jules check-gates')
        id: cg-ring
        continue-on-error: true
        run: cargo xtask check-ring-layering --strict 2>&1 | tee /tmp/cg-ring.txt

      - name: "[check-gates] Unsafe Islands"
        if: steps.auth-check.outputs.authorized == 'true' && contains(github.event.comment.body, '@jules check-gates')
        id: cg-unsafe
        continue-on-error: true
        run: cargo xtask check-unsafe-islands 2>&1 | tee /tmp/cg-unsafe.txt

      - name: "[check-gates] Security Stubs"
        if: steps.auth-check.outputs.authorized == 'true' && contains(github.event.comment.body, '@jules check-gates')
        id: cg-stubs
        continue-on-error: true
        run: cargo xtask check-security-stubs 2>&1 | tee /tmp/cg-stubs.txt

      - name: "[check-gates] Compile Check"
        if: steps.auth-check.outputs.authorized == 'true' && contains(github.event.comment.body, '@jules check-gates')
        id: cg-compile
        continue-on-error: true
        run: cargo xtask check-compile 2>&1 | tee /tmp/cg-compile.txt

      - name: "[check-gates] DAG Integrity"
        if: steps.auth-check.outputs.authorized == 'true' && contains(github.event.comment.body, '@jules check-gates')
        id: cg-dag
        continue-on-error: true
        run: cargo xtask check-dag 2>&1 | tee /tmp/cg-dag.txt

      - name: "[check-gates] FFI Panic Boundary"
        if: steps.auth-check.outputs.authorized == 'true' && contains(github.event.comment.body, '@jules check-gates')
        id: cg-ffi
        continue-on-error: true
        run: cargo xtask check-ffi-panic-boundary 2>&1 | tee /tmp/cg-ffi.txt

      - name: "[check-gates] Post check-gates Results"
        if: steps.auth-check.outputs.authorized == 'true' && contains(github.event.comment.body, '@jules check-gates')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const icon = (outcome) => outcome === 'success' ? '✅' : '🔴';

            const gates = [
              ['compile-check',    '${{ steps.cg-compile.outcome }}'],
              ['ring-layering',    '${{ steps.cg-ring.outcome }}'],
              ['unsafe-islands',   '${{ steps.cg-unsafe.outcome }}'],
              ['security-stubs',   '${{ steps.cg-stubs.outcome }}'],
              ['dag-integrity',    '${{ steps.cg-dag.outcome }}'],
              ['ffi-panic-boundary','${{ steps.cg-ffi.outcome }}'],
            ];

            const rows = gates.map(([name, outcome]) =>
              `| \`${name}\` | ${icon(outcome)} |`
            ).join('\n');

            const allGreen = gates.every(([, o]) => o === 'success');

            const body = [
              `## ${allGreen ? '✅' : '🔴'} Jules check-gates — Gate-Übersicht`,
              ``,
              `| Gate | Status |`,
              `|------|--------|`,
              rows,
              ``,
              allGreen
                ? `Alle geprüften Gates sind grün. PR kann gemergt werden.`
                : `Ein oder mehrere Gates sind rot. Bitte die Ursache beheben (REQ-QA-010).`,
              ``,
              `> ⚠️ Jules ändert keine Gates, Lints oder Ratchets (REQ-QA-010).`,
            ].join('\n');

            const issueNumber = context.payload.issue?.number
              ?? context.payload.pull_request?.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNumber,
              body,
            });
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── @jules recheck ─────────────────────────────────────────────────────────
      - name: "[recheck] Jules Preflight"
        if: steps.auth-check.outputs.authorized == 'true' && contains(github.event.comment.body, '@jules recheck')
        id: recheck-preflight
        continue-on-error: true
        run: cargo xtask jules-preflight --fast 2>&1 | tee /tmp/recheck-preflight.txt

      - name: "[recheck] Ring Layering (strict)"
        if: steps.auth-check.outputs.authorized == 'true' && contains(github.event.comment.body, '@jules recheck')
        id: recheck-ring
        continue-on-error: true
        run: cargo xtask check-ring-layering --strict 2>&1 | tee /tmp/recheck-ring.txt

      - name: "[recheck] Audit Verdict Independence"
        if: steps.auth-check.outputs.authorized == 'true' && contains(github.event.comment.body, '@jules recheck')
        id: recheck-verdict
        continue-on-error: true
        run: cargo xtask check-audit-verdict-independence 2>&1 | tee /tmp/recheck-verdict.txt

      - name: "[recheck] Post recheck Results"
        if: steps.auth-check.outputs.authorized == 'true' && contains(github.event.comment.body, '@jules recheck')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const icon = (outcome) => outcome === 'success' ? '✅' : '🔴';

            const checks = [
              ['jules-preflight',           '${{ steps.recheck-preflight.outcome }}'],
              ['ring-layering (strict)',     '${{ steps.recheck-ring.outcome }}'],
              ['audit-verdict-independence','${{ steps.recheck-verdict.outcome }}'],
            ];

            const rows = checks.map(([name, outcome]) =>
              `| \`${name}\` | ${icon(outcome)} |`
            ).join('\n');

            const allGreen = checks.every(([, o]) => o === 'success');

            const body = [
              `## ${allGreen ? '✅' : '🔴'} Jules recheck — Submit-Gate-Check`,
              ``,
              `| Check | Status |`,
              `|-------|--------|`,
              rows,
              ``,
              allGreen
                ? `Submit-Gate-Check bestanden. PR ist merge-ready.`
                : `Submit-Gate-Check fehlgeschlagen. Bitte Ursache beheben — niemals Gates schwächen (REQ-QA-010).`,
              ``,
              `> ⚠️ Jules ändert keine Gates, Lints oder Ratchets (REQ-QA-010).`,
            ].join('\n');

            const issueNumber = context.payload.issue?.number
              ?? context.payload.pull_request?.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNumber,
              body,
            });
          github-token: ${{ secrets.GITHUB_TOKEN }}

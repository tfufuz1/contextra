# Context Integrity Gates Workflow
# Enforces context integrity, Baukasten modularity gates, tag grammar, and preflight checks.

name: Context Integrity Gates

on: [push, pull_request]

jobs:
  context-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Gate 0: Workspace Compile Check"
        run: cargo check -p contextra-types -p contextra-ports -p contextra-simd -p contextra-sys

      - name: "Gate G1: Crate-Klassen & Dependencies Gate (SPEC v4.1 §8 / G1)"
        run: python3 tools/gate_dependencies.py --json

      - name: "Gate 1: Keine ungelösten kritischen AI-TAGs"
        run: |
          COUNT=$(grep -rE "AI-TAG\[[^]]+\]\[(CRITICAL|BLOCKER)\]" crates/ \
            --include="*.rs" 2>/dev/null | grep -vcP "(?<!UN)RESOLVED" || true)
          if [ "$COUNT" -gt 0 ]; then
            echo "❌ $COUNT ungelöste AI-TAG[CRITICAL|BLOCKER] gefunden"
            grep -rE "AI-TAG\[[^]]+\]\[(CRITICAL|BLOCKER)\]" crates/ --include="*.rs" | grep -vP "(?<!UN)RESOLVED"
            exit 1
          fi
          echo "✅ Keine offenen kritischen/blockierenden Tags"

      - name: "Gate 2b: Unsafe-Islands Inventory Gate"
        run: python3 tools/unsafe_boundary_auditor.py --crate contextra-simd --json > /dev/null

      - name: "Gate 3: Kein silent let _ für IO-Operationen"
        run: |
          if grep -rn "let _ = .*sync\|let _ = .*flush\|let _ = .*write" \
             crates/ --include="*.rs" 2>/dev/null; then
            echo "❌ Silent IO-Fehler gefunden — propagiere mit ?"
            exit 1
          fi
          cargo clippy --workspace --lib --bins -- \
            -D clippy::unused_must_use \
            -W clippy::let_underscore_must_use
          echo "✅ Keine silent IO-Fehler"

      - name: "Gate 4: axum nicht in contextra-mcp"
        run: |
          if grep -q "axum" crates/contextra-mcp/Cargo.toml 2>/dev/null; then
            echo "❌ axum-Dependency in contextra-mcp — ADR-010 verletzt (stdio only)"
            exit 1
          fi
          echo "✅ contextra-mcp korrekt: kein axum"

      - name: "Gate 6: Keine TODOs ohne AI-TAG Grammatik"
        run: |
          TODO_WITHOUT_TAG=$(grep -rn "TODO" crates/ --include="*.rs" 2>/dev/null | grep -v "AI-TAG" || true)
          if [ -n "$TODO_WITHOUT_TAG" ]; then
            echo "❌ TODO ohne AI-TAG Grammatik in Rust-Dateien gefunden:"
            echo "$TODO_WITHOUT_TAG"
            exit 1
          fi
          echo "✅ Alle TODOs nutzen AI-TAG Syntax"

      - name: "Gate 11: AGENTS.md Template Validierung"
        run: |
          # Prüft, ob alle AGENTS.md die erforderlichen 8 Sektionen enthalten
          for file in crates/*/AGENTS.md; do
            if [ -f "$file" ]; then
              for section in \
                "## 1. Zweck & Architekturrolle" \
                "## 2. Modul-Karte" \
                "## 3. Kritische Invarianten" \
                "## 4. Public API Quick-Reference" \
                "## 5. Anti-Patterns & LLM-Fallstricke" \
                "## 6. Concurrency & Lock-Hierarchie" \
                "## 7. Cross-Crate-Schnittstellen & DAG-Grenzen" \
                "## 8. Relevante ADRs & Rules"; do
                if ! grep -q "$section" "$file"; then
                  echo "❌ Sektion fehlt in $file: $section"
                  exit 1
                fi
              done
            fi
          done
          echo "✅ Alle AGENTS.md Dateien entsprechen dem 8-Sektionen-Template"

      - name: "Gate 15: Context-Read-Evidence im PR-Body"
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          if echo "$PR_BODY" | grep -q "Context-Read:"; then
            echo "✅ Context-Read-Evidence im PR-Body gefunden"
          else
            echo "⚠️ SOFT-WARNING: Keine 'Context-Read:' Zeile im PR-Body gefunden."
            echo "Bitte Pflicht-Leseordnung beachten: JULES_CONTEXT.md → AGENTS.md → crates/{crate}/AGENTS.md → WORKING_STATE.md"
          fi

      - name: "Wöchentlicher Shell-Commit-Audit"
        run: |
          COUNT=$(git log --since="7 days ago" --format="%s" origin/main 2>/dev/null | grep -ic "^shell-commit$" || true)
          echo "ℹ️ Shell-Commits der letzten 7 Tage auf main: $COUNT"
          if [ "$COUNT" -gt 5 ]; then
            echo "⚠️ WARNUNG: Erhöhte Anzahl von Shell-Commits ($COUNT > 5) in den letzten 7 Tagen auf main erkannt!"
          else
            echo "✅ Shell-Commit-Audit unauffällig ($COUNT <= 5)"
          fi

name: Baukasten Quality Gates (SPEC v4.1)

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  baukasten-gates:
    name: Baukasten Verification Gates (G1-G10)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt

      - name: "Gate G1: Crate-Klassen & Dependencies Gate (SPEC §8 G1)"
        run: |
          python3 tools/gate_dependencies.py --json

      - name: "Gate G2: Öffentliche API Reinheit (SPEC §8 G2)"
        run: |
          echo "Prüfe öffentliche Schnittstellen der Klasse-A Bausteine auf Fremdtypen-Lecks..."
          python3 tools/port_contract_auditor.py --output-dir /tmp/port_audit || true
          echo "✅ Gate G2: Port Contract Audit abgeschlossen."

      - name: "Gate G3: Standalone Export Readiness (SPEC §8 G3)"
        run: |
          echo "Prüfe Exportierbarkeit autarker Bausteine via tools/export-crate..."
          python3 tools/export_crate.py contextra-sys --out /tmp/export-sys || true
          echo "✅ Gate G3: Export-Test ausgeführt."

      - name: "Gate G4: Feature-Matrix Check (SPEC §8 G4)"
        run: |
          echo "Prüfe Minimal-Feature-Build ausgewählter autarker Bausteine..."
          cargo check -p contextra-types --no-default-features
          cargo check -p contextra-ports --no-default-features
          cargo check -p contextra-simd --no-default-features
          echo "✅ Gate G4: Minimal-Feature-Kompilierung erfolgreich."

      - name: "Gate G5: Domänenreinheit in Indizes (SPEC §8 G5)"
        run: |
          echo "Prüfe Indizes (vector, text, graph) auf unzulässige Löschdomänen-Typen..."
          VIOLATIONS=$(grep -rnE "(Purger|WitnessLayer|DeletionProof)" crates/contextra-vector/src crates/contextra-text/src crates/contextra-graph/src 2>/dev/null || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "⚠️ Domänen-Typen in Indizes identifiziert (in Entkopplung):"
            echo "$VIOLATIONS" | head -n 10
          else
            echo "✅ Gate G5: Domänenreinheit in Indizes gewahrt."
          fi

      - name: "Gate G6: Dokumentations-Vollständigkeit (SPEC §8 G6)"
        run: |
          MISSING=0
          for c in crates/* benchmarks/*; do
            if [ -d "$c" ] && [ -f "$c/Cargo.toml" ] && [ ! -f "$c/README.md" ]; then
              echo "❌ Fehlende README.md in $c"
              MISSING=$((MISSING + 1))
            fi
          done
          test "$MISSING" -eq 0
          echo "✅ Gate G6: Alle Module besitzen eigenständige README.md."

      - name: "Gate G7: Minimal-Kompositions-Check (SPEC §8 G7)"
        run: |
          echo "Prüfe Minimal-Komposition von Bausteinen..."
          cargo check -p contextra-types --locked
          cargo check -p contextra-ports --locked
          echo "✅ Gate G7: Basis-Bausteine kompilieren erfolgreich."

      - name: "Gate G8: Meta-Test (Gate-Prüfskripte Negativtests)"
        run: |
          python3 tests/test_gate_g8_negative.py
          echo "✅ Gate G8: Gate-Selbsttests erfolgreich bestanden."

      - name: "Gate G9: Formatierung & Zero-Warning Gate (SPEC §8 G9)"
        run: |
          cargo fmt --all -- --check
          echo "✅ Gate G9: Formatierung verifiziert."

      - name: "Gate G10: Zero-Panic & Unsafe Boundary Audit (SPEC §8 G10)"
        run: |
          python3 tools/zero_panic_analyzer.py --crate contextra-simd --json > /dev/null || true
          python3 tools/unsafe_boundary_auditor.py --crate contextra-simd --json > /dev/null || true
          echo "✅ Gate G10: Unsafe & Zero-Panic Audit durchgeführt."

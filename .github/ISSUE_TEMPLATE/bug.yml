name: Bug Report
description: Melde ein fehlerhaftes Verhalten oder ein Problem
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: dropdown
    id: crate
    attributes:
      label: Betroffenes Crate
      description: Wählen Sie das betroffene Crate aus
      options:
        - contextra
        - contextra-adapt
        - contextra-agent
        - contextra-audit-export
        - contextra-avv-generator
        - contextra-checkpoint
        - contextra-cognition
        - contextra-core
        - contextra-crypto
        - contextra-db
        - contextra-durable-fs
        - contextra-engine
        - contextra-graph
        - contextra-infer-candle
        - contextra-infer-ollama
        - contextra-infer-onnx
        - contextra-kvcache
        - contextra-license
        - contextra-mcp
        - contextra-mvcc
        - contextra-ports
        - contextra-privacy
        - contextra-py
        - contextra-rank
        - contextra-router
        - contextra-sandbox
        - contextra-simd
        - contextra-store
        - contextra-store-redb
        - contextra-sys
        - contextra-testkit
        - contextra-text
        - contextra-types
        - contextra-vector
        - contextra-wire
        - benchmarks/contextra-bench
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduktion
      description: Schritt-für-Schritt Anweisung zur Reproduktion des Fehlers
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
      description: Was sollte stattdessen passieren?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
      description: Was passiert stattdessen (inkl. Fehlermeldungen/Logs)?
    validations:
      required: true

name: Wartung / Chore
description: Wartungsaufgabe oder Refactoring anfordern
title: "[CHORE] "
labels: ["type:chore"]
body:
  - type: dropdown
    id: crate
    attributes:
      label: Betroffenes Crate
      description: Wählen Sie das primär betroffene Crate aus
      options:
        - contextra
        - contextra-adapt
        - contextra-agent
        - contextra-audit-export
        - contextra-avv-generator
        - contextra-checkpoint
        - contextra-cognition
        - contextra-core
        - contextra-crypto
        - contextra-db
        - contextra-durable-fs
        - contextra-engine
        - contextra-graph
        - contextra-infer-candle
        - contextra-infer-ollama
        - contextra-infer-onnx
        - contextra-kvcache
        - contextra-license
        - contextra-mcp
        - contextra-mvcc
        - contextra-ports
        - contextra-privacy
        - contextra-py
        - contextra-rank
        - contextra-sandbox
        - contextra-simd
        - contextra-store
        - contextra-store-redb
        - contextra-sys
        - contextra-testkit
        - contextra-text
        - contextra-types
        - contextra-vector
        - contextra-wire
        - benchmarks/contextra-bench
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Beschreibung der Wartungsaufgabe
      description: Detaillierte Beschreibung der auszuführenden Wartungs- oder Refactoring-Arbeiten
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Akzeptanzkriterien
      description: Wie wird der Erfolg der Wartungsaufgabe verifiziert?
    validations:
      required: true

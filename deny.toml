[graph]
targets = []

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = [
    # §4.2 Ring-Modell: tokio-Nutzung ist in Ring-0-Kernen (contextra-vector, contextra-text, contextra-graph) verboten und nur in Höher-Ring-Fassaden sowie erlaubter Peripherie gestattet
    { crate = "tokio", wrappers = [
        "criterion",
        "hyper",
        "hyper-rustls",
        "hyper-util",
        "contextra",
        "contextra-adapt",
        "contextra-agent",
        "contextra-bench",
        "contextra-checkpoint",
        "contextra-cognition",
        "contextra-core",
        "contextra-crypto",
        "contextra-db",
        "contextra-engine",
        "contextra-graph",
        "contextra-infer-candle",
        "contextra-infer-ollama",
        "contextra-infer-onnx",
        "contextra-kvcache",
        "contextra-mcp",
        "contextra-mvcc",
        "contextra-ports",
        "contextra-privacy",
        "contextra-py",
        "contextra-rank",
        "contextra-router",
        "contextra-sandbox",
        "contextra-store",
        "contextra-testkit",
        "contextra-text",
        "contextra-vector",
        "reqwest",
        "tokio-rustls",
        "tokio-util",
        "tower",
    ] },
    # §4.2 Ring-Modell: Candle-Inferenz nur in contextra-candle (TRANSITION; künftig contextra-infer-candle) sowie Candle-Eigencrates
    { crate = "candle-core", wrappers = ["candle-nn", "candle-transformers", "contextra-candle", "contextra-infer-candle"] },
    # §4.2 Ring-Modell: ONNX/ort nur in contextra-embed (TRANSITION; künftig contextra-infer-onnx)
    { crate = "ort", wrappers = ["contextra-embed", "contextra-infer-onnx"] },
    # §4.2 Ring-Modell: PyO3 nur in contextra-py (isoliertes Workspace-Crate) und Interop-Crates
    { crate = "pyo3", wrappers = ["contextra-py", "numpy", "pythonize"] },
    # §4.2 Ring-Modell: reqwest nur in contextra-ollama (TRANSITION; künftig contextra-infer-ollama)
    { crate = "reqwest", wrappers = ["contextra-ollama", "contextra-infer-ollama"] },
    # §4.2 Ring-Modell: Wasmtime-Sandbox nur in contextra-sandbox
    { crate = "wasmtime", wrappers = ["contextra-sandbox", "contextra-privacy"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

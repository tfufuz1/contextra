[licenses]
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
]
clarify = [
    { name = "contextra-mcp", expression = "MIT OR Apache-2.0", license-files = [] },
]
confidence-threshold = 0.8


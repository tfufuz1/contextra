[graph]
targets = []

[output]
feature-depth = 1

[advisories]
ignore = [
    # RUSTSEC-2025-0141: bincode 1.3.3 unmaintained; Migration zu bincode 2 oder rkyv geplant bis 2027-06-30 (REQ-SER-1)
    "RUSTSEC-2025-0141",
    # RUSTSEC-2026-0253: lru 0.16.4 use-after-free bei Panics in Drop; keine panikenden Drop-Typen im Core; Update auf >=0.18.2 bis 2027-04-30 (REQ-DEP-LRU)
    "RUSTSEC-2026-0253",
    # RUSTSEC-2026-0386: tokio 1.53.1 AsyncFd IO safety; AsyncFd wird im Core nicht direkt verwendet; Update auf >=1.53.3 bis 2027-04-30 (REQ-DEP-TOKIO)
    "RUSTSEC-2026-0386",
]

[licenses]
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    "MIT-0",
    "Unlicense",
]
clarify = []
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = [
    { crate = "tokio", wrappers = [
        "criterion",
        "contextra",
        "contextra-crypto", # TRANSITION E29, bis 2027-04-30, REQ-ASYNC-1 (dev-deps)
        "contextra-engine",
        "contextra-mvcc", # TRANSITION E29, bis 2027-04-30, REQ-ASYNC-1 (dev-deps)
        "contextra-ports", # TRANSITION E29, bis 2027-04-30, REQ-ASYNC-1 (dev-deps)
        "contextra-rank", # TRANSITION E29, bis 2027-04-30, REQ-ASYNC-1 (dev-deps)
        "contextra-store", # TRANSITION E29, bis 2027-04-30, REQ-ASYNC-1
        "contextra-testkit",
        "contextra-text", # TRANSITION E29, bis 2027-04-30, REQ-ASYNC-1 (dev-deps)
        "contextra-vector", # TRANSITION E29, bis 2027-04-30, REQ-ASYNC-1 (dev-deps)
        "tokio-util",
    ] },
    { crate = "candle-core", wrappers = [] },
    { crate = "pyo3", wrappers = [] },
    { crate = "reqwest", wrappers = [] },
    { crate = "wasmtime", wrappers = [] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

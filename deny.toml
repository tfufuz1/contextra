[graph]
targets = []

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = [
    # §4.2 Ring-Modell: tokio-Nutzung ist in Ring-0-Kernen (memfuse-vector, memfuse-text, memfuse-graph) verboten und nur in Höher-Ring-Fassaden sowie erlaubter Peripherie gestattet
    { crate = "tokio", wrappers = [
        "criterion",
        "hyper",
        "hyper-rustls",
        "hyper-util",
        "memfuse",
        "memfuse-agent",
        "memfuse-bench",
        "memfuse-checkpoint",
        "memfuse-cognition",
        "memfuse-crypto",
        "memfuse-db",
        "memfuse-engine",
        "memfuse-infer-candle",
        "memfuse-infer-ollama",
        "memfuse-infer-onnx",
        "memfuse-kvcache",
        "memfuse-mcp",
        "memfuse-privacy",
        "memfuse-py",
        "memfuse-router",
        "memfuse-sandbox",
        "memfuse-store",
        "reqwest",
        "tokio-rustls",
        "tokio-util",
        "tower",
    ] },
    # §4.2 Ring-Modell: Candle-Inferenz nur in memfuse-candle (TRANSITION; künftig memfuse-infer-candle) sowie Candle-Eigencrates
    { crate = "candle-core", wrappers = ["candle-nn", "candle-transformers", "memfuse-candle", "memfuse-infer-candle"] },
    # §4.2 Ring-Modell: ONNX/ort nur in memfuse-embed (TRANSITION; künftig memfuse-infer-onnx)
    { crate = "ort", wrappers = ["memfuse-embed", "memfuse-infer-onnx"] },
    # §4.2 Ring-Modell: PyO3 nur in memfuse-py (isoliertes Workspace-Crate) und Interop-Crates
    { crate = "pyo3", wrappers = ["memfuse-py", "numpy", "pythonize"] },
    # §4.2 Ring-Modell: reqwest nur in memfuse-ollama (TRANSITION; künftig memfuse-infer-ollama)
    { crate = "reqwest", wrappers = ["memfuse-ollama", "memfuse-infer-ollama"] },
    # §4.2 Ring-Modell: Wasmtime-Sandbox nur in memfuse-sandbox
    { crate = "wasmtime", wrappers = ["memfuse-sandbox", "memfuse-privacy"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

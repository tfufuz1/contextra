[graph]
targets = []

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = [
    # Audit-Befund „deny.toml redundante, aber wirkungslose zweite Verteidigungslinie“ (Abschnitt 4.3):
    # Die wrappers-Liste wurde am 2026-09-26 auf tatsächliche Nicht-Ring-0/1-Wrapper reduziert, damit
    # cargo deny check bans echte zukünftige Production-Dependency-Regressionen zusätzlich zum xtask-Gate abdeckt.
    # §4.2 Ring-Modell: tokio-Nutzung ist in Ring-0/1-Kernen verboten und nur in Höher-Ring-Fassaden sowie erlaubter Peripherie gestattet
    { crate = "tokio", wrappers = [
        "criterion",
        "hyper",
        "hyper-rustls",
        "hyper-util",
        "contextra",
        "contextra-agent",
        "contextra-bench",
        "contextra-cognition",
        "contextra-db",
        "contextra-engine",
        "contextra-infer-candle",
        "contextra-infer-ollama",
        "contextra-infer-onnx",
        "contextra-mcp",
        "contextra-privacy",
        "contextra-py",
        "contextra-router",
        "contextra-sandbox",
        "contextra-testkit",
        "reqwest",
        "tokio-rustls",
        "tokio-util",
        "tower",
    ] },
    # §4.2 Ring-Modell: Candle-Inferenz nur in contextra-infer-candle (TRANSITION; künftig contextra-infer-candle) sowie Candle-Eigencrates
    { crate = "candle-core", wrappers = ["candle-nn", "candle-transformers", "contextra-infer-candle", "contextra-infer-candle"] },
    # §4.2 Ring-Modell: ONNX/ort nur in contextra-infer-onnx (TRANSITION; künftig contextra-infer-onnx)
    { crate = "ort", wrappers = ["contextra-infer-onnx", "contextra-infer-onnx"] },
    # §4.2 Ring-Modell: PyO3 nur in contextra-py (isoliertes Workspace-Crate) und Interop-Crates
    { crate = "pyo3", wrappers = ["contextra-py", "numpy", "pythonize"] },
    # §4.2 Ring-Modell: reqwest nur in contextra-infer-ollama (TRANSITION; künftig contextra-infer-ollama)
    { crate = "reqwest", wrappers = ["contextra-infer-ollama", "contextra-infer-ollama"] },
    # §4.2 Ring-Modell: Wasmtime-Sandbox nur in contextra-sandbox
    { crate = "wasmtime", wrappers = ["contextra-sandbox", "contextra-privacy"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = [
    { crate = "tokio", wrappers = [
        "criterion",
        "contextra",
        "contextra-crypto",
        "contextra-durable-fs",
        "contextra-engine",
        "contextra-erasure",
        "contextra-mvcc",
        "contextra-ports",
        "contextra-rank",
        "contextra-store",
        "contextra-testkit",
        "contextra-testmacros",
        "contextra-text",
        "contextra-vector",
        "tokio-util",
    ] },
    { crate = "candle-core", wrappers = ["candle-nn", "candle-transformers"] },
    { crate = "pyo3", wrappers = ["numpy", "pythonize"] },
    { crate = "reqwest" },
    { crate = "wasmtime" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

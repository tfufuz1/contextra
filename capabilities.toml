# capabilities.toml — Contextra Capabilities & Feature Maturity Manifest (ADR-N08 / P12)
# Single Source of Truth for Crate Maturity Levels, Architecture Rings, and Capability Guarantees.

[version]
schema = "2"
spec = "v4"

# Schema-Erweiterung SPEC v4.0 (§8.1 Gate G1):
# - klasse: "A" (isolierte Bausteine), "B" (Storage-Bundle), "C" (Anwendungsschicht), "T" (Testwerkzeuge)
# - may_depend_on: Liste erlaubter interner Abhängigkeiten (Klasse A Soll: leer)
# - transitional: Temporär erlaubte Übergangskanten mit Verfallsdatum Welle 6 (erzeugt Warnung in Gate G1)

[crates.contextra]
klasse = 'C'
ring = 'Ring 4'
maturity = 'stable'
description = 'Haupt-Library Facade für Endanwender'
capabilities = ['public-api', 'facade']
path = "crates/contextra"
unsafe_island = false
may_depend_on = ['contextra-db', 'contextra-ports', 'contextra-types']
ci_class = 'pr'
spec = ['A2', 'A3', 'A4', '0', '2', '3', '4', '5', '6', '7', '8', '9', '12', '13', '15', '16', '17', '18', '19', '20', '21', 'B', 'D']
test = "cargo test -p contextra --locked"

[crates.contextra-checkpoint]
klasse = 'B'
ring = 'Ring 1'
maturity = 'stable'
description = 'Persistent Checkpoint Engine und Blake3 Manifest-Verifikation'
capabilities = ['blake3-checkpoints', 'orphan-recovery']
path = "crates/contextra-checkpoint"
unsafe_island = false
may_depend_on = ['contextra-ports', 'contextra-types']
ci_class = 'pr'
spec = ['A2', '0', '4', '20']
test = "cargo test -p contextra-checkpoint --locked"



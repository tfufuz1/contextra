# capabilities.toml — Contextra Capabilities & Feature Maturity Manifest (ADR-N08 / P12)
# Single Source of Truth for Crate Maturity Levels, Architecture Rings, and Capability Guarantees.
# Synchronisiert mit Zielarchitektur docs/SPEC.md §5.1 (14 Kern-Crates + Hilfs-Crates).

[version]
schema = "2"
spec = "v4"

[crates.contextra]
ring = 'Ring 4'
maturity = 'stable'
description = 'Haupt-Library Facade für Endanwender'
capabilities = ['public-api', 'facade']
path = "crates/contextra"
unsafe_island = false
may_depend_on = ['contextra-crypto', 'contextra-engine', 'contextra-mvcc', 'contextra-ports', 'contextra-rank', 'contextra-store', 'contextra-types']
ci_class = 'pr'
spec = ['A2', 'A3', 'A4', '0', '2', '3', '4', '5', '6', '7', '8', '9', '12', '13', '15', '16', '17', '18', '19', '20', '21', 'B', 'D']
test = "cargo test -p contextra --locked"


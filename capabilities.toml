# capabilities.toml — Contextra Capabilities & Feature Maturity Manifest (ADR-N08 / P12)
# Single Source of Truth for Crate Maturity Levels, Architecture Rings, and Capability Guarantees.

[version]
schema = "1.0"
spec = "v6"

[crates.contextra-types]
ring = "Ring 0"
maturity = "stable"
description = "Grundlegende Typdefinitionen (DocId, TxId, TenantId, Error-Typen)"
capabilities = ["zero-copy-types", "type-safety"]

[crates.contextra-ports]
ring = "Ring 0"
maturity = "stable"
description = "Abstrakte Port-Schnittstellen und Trait-Definitionen für Entkopplung"
capabilities = ["trait-interfaces", "ring0-decoupling"]

[crates.contextra-mvcc]
ring = "Ring 0"
maturity = "stable"
description = "Multi-Version Concurrency Control und Isolation-Mechanismen"
capabilities = ["snapshot-isolation", "lockless-read"]

[crates.contextra-vector]
ring = "Ring 0"
maturity = "stable"
description = "Vektorsuche und Indexierung (HNSW, DiskANN, Quantisierung)"
capabilities = ["hnsw-index", "diskann-index", "scalar-quantization"]

[crates.contextra-rank]
ring = "Ring 0"
maturity = "stable"
description = "Ranking-, Fusion- und Score-Kalibrierungs-Algorithmen (RRF, Isotonische/Platt Kalibrierung, Bonus Scorers)"
capabilities = ["rrf-fusion", "coherence-bonus", "platt-scaler", "isotonic-calibrator"]

[crates.contextra-adapt]
ring = "Ring 0"
maturity = "experimental"
description = "Anpassungs- und Transformations-Layer für Datenmodelle (PID Latency Controller)"
capabilities = ["model-adaption", "pid-latency-controller"]

[crates.contextra-text]
ring = "Ring 0"
maturity = "stable"
description = "Volltextsuche und Inverted-Index (BM25 Engine)"
capabilities = ["bm25-search", "inverted-index"]

[crates.contextra-graph]
ring = "Ring 0"
maturity = "stable"
description = "CSR Graph-Engine, Path Graphing und GraphRAG Community Detection"
capabilities = ["csr-traversal", "label-propagation", "deadlock-free-dag"]

[crates.contextra-crypto]
ring = "Ring 0"
maturity = "stable"
description = "Kryptographische Vaults, Zeroize, Egress-Verschlüsselung und HMAC"
capabilities = ["aes-256-gcm", "hmac-sha256", "zeroize-on-drop"]

[crates.contextra-simd]
ring = "Ring 0"
maturity = "stable"
description = "SIMD-beschleunigte Distanzberechnungen und Vektor-Operationen"

# Schema v3 capabilities fragment for contextra-engine (SPEC §8.3)
[crates.contextra-engine]
group = "integration"
level = 2
tier = "stable"
path = "crates/contextra-engine"
unsafe_island = false
allowed_internal = [
    "contextra-types",
    "contextra-ports",
    "contextra-mvcc",
    "contextra-checkpoint",
    "contextra-store",
    "contextra-vector",
    "contextra-text",
    "contextra-graph",
    "contextra-rank",
]

[crates.contextra-engine.feature_closure_allowed]
adaptive-candidate-pool-sizing = ["contextra-adapt"]
onnx = ["contextra-infer-onnx"]
sandbox = ["contextra-sandbox"]

[crates.contextra-engine.dev_allowed]
ingest = ["contextra-ingest"]
testkit = ["contextra-testkit"]
test = "cargo test -p contextra-engine --locked"

[lints]
workspace = true

[package]
name = "contextra-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Contextra — Core storage, index, and transaction orchestrator engine"

[package.metadata.contextra]
ring = "3"

[dependencies]
contextra-sys = { workspace = true }
contextra-types = { workspace = true }
contextra-ports = { workspace = true }
contextra-mvcc = { workspace = true }
bytes = { workspace = true }
contextra-crypto = { workspace = true }
contextra-store = { workspace = true }
blake3 = { workspace = true }
contextra-vector = { workspace = true }
contextra-text = { workspace = true }
contextra-checkpoint = { workspace = true }
contextra-rank = { workspace = true }
ahash = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
tokio-util = { version = "0.7.18", features = ["rt"] }
zeroize = { version = "1", features = ["derive", "zeroize_derive"] }
thiserror = { workspace = true }
bincode = { workspace = true }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
contextra-crypto = { workspace = true }
contextra-testkit = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
proptest = "1.4"
loom = "0.7"
wat = "1"
contextra-vector = { workspace = true, features = ["experimental-diskann"] }

[[test]]
name = "kv_delete_cascade_e2e"
path = "tests/kv_delete_cascade_e2e.rs"

[features]
default = []
fast = []
erasure = []
# Assumes contextra-store has the encryption-at-rest feature (Aufgabe 7 / Spec §15.2, ADR-15)
encryption-at-rest = ["contextra-store/encryption-at-rest"]
bench = []
background-maintenance = []

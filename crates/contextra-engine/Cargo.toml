[lints]
workspace = true

[package]
name = "contextra-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Contextra — Core storage, index, and transaction orchestrator engine (Deprecated Façade)"

[package.metadata.contextra]
ring = "3"

[dependencies]
contextra-db = { workspace = true }

[features]
default = []
reranking = ["contextra-db/reranking"]
experimental-diskann = ["contextra-db/experimental-diskann"]
background-maintenance = ["contextra-db/background-maintenance"]
graph-connectivity-health = ["contextra-db/graph-connectivity-health"]
edge-reinforcement-learning = ["contextra-db/edge-reinforcement-learning"]
exp-extraction = ["contextra-db/exp-extraction"]
entity-extraction = ["contextra-db/entity-extraction"]
auto-extraction-opt-out = ["contextra-db/auto-extraction-opt-out"]

[dev-dependencies]
contextra-types = { workspace = true }
contextra-ports = { workspace = true }
contextra-vector = { workspace = true, features = ["workspace"] }
contextra-store = { workspace = true }
contextra-text = { workspace = true }
contextra-graph = { workspace = true }
contextra-rank = { workspace = true }
contextra-checkpoint = { workspace = true }
contextra-testkit = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tracing = { workspace = true }
sha2 = "0.10"
tempfile = { workspace = true }
proptest = "1.4"

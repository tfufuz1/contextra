[package]
autobenches = false
name = "contextra-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cryptographic primitives for Contextra: AES-256-GCM-SIV AEAD, HKDF key hierarchy, Argon2id KDF, zeroize-protected keys"
readme = "README.md"
repository = "https://github.com/tfufuz1/contextra"
keywords = ["cryptography", "aead", "kdf", "wal", "zeroize"]
categories = ["cryptography"]
# Internes Bausteinlager fuer die Contextra-Architektur, kein externes Crates.io-Release
publish = false

[package.metadata.contextra]
ring = "0"
klasse = "A"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
sha2 = "0.10"
hmac = "0.12"
aes-gcm-siv = "0.11"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
hkdf = "0.12"
subtle = "2.6"
blake3 = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
contextra-ids = { path = "../contextra-ids", version = "0.1.0" }
contextra-env = { path = "../contextra-env", version = "0.1.0" }
rand = { workspace = true }
tracing = { workspace = true }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
parking_lot = { workspace = true }
ahash = { workspace = true }
lru = "0.16.4"
regex = { workspace = true }

[features]
default = []
std = ["contextra-ids/std", "contextra-env/std"]
test-utils = []

[dev-dependencies]
contextra-crypto = { path = ".", features = ["test-utils"] }
contextra-env = { path = "../contextra-env", features = ["test-utils"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
proptest = "1.4"
criterion = { workspace = true }
loom = "0.7"

[[bench]]
name = "crypto_benchmarks"
harness = false

[lints]
workspace = true



[package]
autobenches = false
name = "contextra-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Encryption at Rest and KV-Cache Security utilities for Contextra"

[package.metadata.contextra]
ring = "0"

[dependencies]
thiserror = { workspace = true }
sha2 = "0.10"
hmac = "0.12"
aes-gcm-siv = "0.11"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
hkdf = "0.12"
subtle = "2.6"
blake3 = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
contextra-ids = { path = "../contextra-ids", version = "0.1.0" }
contextra-env = { path = "../contextra-env", version = "0.1.0" }
contextra-types = { path = "../contextra-types", version = "0.1.0", optional = true }
contextra-ports = { path = "../contextra-ports", version = "0.1.0", optional = true }
rand = { workspace = true }
tracing = { workspace = true }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
parking_lot = { workspace = true }
ahash = { workspace = true }
lru = "0.16.4"
regex = { workspace = true }

[features]
default = ["kv-encryption", "workspace"]
workspace = ["dep:contextra-types", "dep:contextra-ports"]
types-compat = ["workspace"]
ports-compat = ["workspace"]
test-utils = []
kv-encryption = []
cloud-egress-guard = []

[dev-dependencies]
contextra-crypto = { path = ".", features = ["test-utils"] }
contextra-types = { path = "../contextra-types" }
contextra-ports = { path = "../contextra-ports" }
contextra-testkit = { workspace = true }
contextra-env = { path = "../contextra-env", features = ["test-utils"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
proptest = "1.4"
criterion = { workspace = true }
loom = "0.7"

[[bench]]
name = "crypto_benchmarks"
harness = false


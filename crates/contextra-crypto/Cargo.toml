[package]
autobenches = false
name = "contextra-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cryptographic primitives, AES-256-GCM-SIV AEAD, HKDF key derivation, and Argon2id for Contextra"
readme = "README.md"
repository = "https://github.com/tfufuz1/contextra"
keywords = ["cryptography", "aead", "kdf", "wal", "zeroize"]
categories = ["cryptography"]
# Internes Bausteinlager fuer die Contextra-Architektur, kein externes Crates.io-Release
publish = false

[package.metadata.contextra]
ring = "0"
klasse = "A"

[lints]
workspace = true

[dependencies]
# E0-Fundamente (Kern-Closure: ids, env)
contextra-ids = { workspace = true }
contextra-env = { workspace = true }
thiserror = { workspace = true }

# Kryptographische Primitive (SPEC §4)
aes-gcm-siv = "0.11"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
subtle = "2.6"
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
rand = { workspace = true }

# WAL-Integritaet, Audit-Chain und KV-Segmente (INV-6: Verhalten unveraendert)
hmac = "0.12"
blake3 = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
ahash = { workspace = true }
lru = "0.16.4"
regex = { workspace = true }

# Optionale Beobachtbarkeit (default-Features leer, R3)
tracing = { workspace = true, optional = true }

[features]
default = []
std = ["contextra-ids/std", "contextra-env/std"]
tracing = ["dep:tracing"]
test-utils = []

[dev-dependencies]
contextra-crypto = { path = ".", features = ["test-utils"] }
contextra-env = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
proptest = "1.4"
criterion = { workspace = true }
loom = "0.7"

[[bench]]
name = "crypto_benchmarks"
harness = false

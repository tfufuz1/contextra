# Local lint table replicating workspace lints for standalone fuzz workspace
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
await_holding_lock = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[package]
name = "contextra-crypto-fuzz" # <!-- crate-ref-ignore -->
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }
bincode = "1.3"
ed25519-dalek = "2.2"
contextra-types = { path = "../../contextra-types" }
contextra-crypto = { path = ".." }

[[bin]]
name = "deletion_proof_tamper"
path = "fuzz_targets/deletion_proof_tamper.rs"
test = false
doc = false

[[bin]]
name = "wal_hmac_chain_verify_fuzz"
path = "fuzz_targets/wal_hmac_chain_verify_fuzz.rs"
test = false
doc = false

[[bin]]
name = "deletion_proof_verify_external_fuzz"
path = "fuzz_targets/deletion_proof_verify_external_fuzz.rs"
test = false
doc = false

[[bin]]
name = "audit_chain_decode_fuzz"
path = "fuzz_targets/audit_chain_decode_fuzz.rs"
test = false
doc = false

[[bin]]
name = "revocation_log_decode_fuzz"
path = "fuzz_targets/revocation_log_decode_fuzz.rs"
test = false
doc = false

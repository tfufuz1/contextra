[package]
name = "contextra-crypto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }
bincode = "1.3"
ed25519-dalek = "2.2"
contextra-types = { path = "../../contextra-types" }
contextra-crypto = { path = ".." }

[[bin]]
name = "deletion_proof_tamper"
path = "fuzz_targets/deletion_proof_tamper.rs"
test = false
doc = false

[[bin]]
name = "deletion_proof_verify_external_fuzz"
path = "fuzz_targets/deletion_proof_verify_external_fuzz.rs"
test = false
doc = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)', 'cfg(loom)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"

[package]
name = "contextra-crypto-fuzz" # <!-- crate-ref-ignore -->
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }
bincode = "1.3"
ed25519-dalek = "2.2"
contextra-types = { path = "../../contextra-types" }
contextra-ports = { path = "../../contextra-ports" }
contextra-testkit = { path = "../../contextra-testkit" }
contextra-crypto = { path = ".." }

[[bin]]
name = "deletion_proof_tamper"
path = "fuzz_targets/deletion_proof_tamper.rs"
test = false
doc = false

[[bin]]
name = "wal_hmac_chain_verify_fuzz"
path = "fuzz_targets/wal_hmac_chain_verify_fuzz.rs"
test = false
doc = false

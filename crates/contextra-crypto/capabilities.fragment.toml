[crates.contextra-crypto]
group = "foundation"
level = 1
tier = "beta"
path = "crates/contextra-crypto"
unsafe_island = false
allowed_internal = ["contextra-ids", "contextra-env"]

[crates.contextra-crypto.feature_closure_allowed]
workspace = ["contextra-types", "contextra-ports"]

[crates.contextra-crypto.dev_allowed]
test = "cargo test -p contextra-crypto --locked"

[lints]
workspace = true

[package]
name = "contextra-checkpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Backup and snapshot management for Contextra storage"

[package.metadata.contextra]
ring = "1"

[features]
default = ["workspace"]
workspace = ["dep:contextra-types", "dep:contextra-ports"]
types-compat = ["workspace"]
ports-compat = ["workspace"]
docid-128 = ["contextra-ids/docid-128"]

[dependencies]
contextra-ids = { version = "0.1.0", path = "../contextra-ids" }
contextra-env = { version = "0.1.0", path = "../contextra-env" }
contextra-types = { version = "0.1.0", path = "../contextra-types", optional = true }
contextra-ports = { version = "0.1.0", path = "../contextra-ports", optional = true }
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
parking_lot = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
proptest = "1.4"
criterion = { version = "0.5", features = ["async_tokio"] }
contextra-testkit = { version = "0.1.0", path = "../contextra-testkit" }

[[bench]]
name = "checkpoint_bench"
harness = false

[lints]
workspace = true

[package]
name = "contextra-checkpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Backup and snapshot management for Contextra storage"

[package.metadata.contextra]
ring = "1"

[dependencies]
contextra-types = { version = "0.1.0", path = "../contextra-types" }
contextra-ports = { version = "0.1.0", path = "../contextra-ports" }
contextra-mvcc = { version = "0.1.0", path = "../contextra-mvcc" }
contextra-store = { version = "0.1.0", path = "../contextra-store" }
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
parking_lot = { workspace = true }
blake3 = { workspace = true }
futures-executor = "0.3"
dirs = "6.0.0"

[features]
test-utils = []

[dev-dependencies]
contextra-checkpoint = { path = ".", features = ["test-utils"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
proptest = "1.4"
criterion = { version = "0.5", features = ["async_tokio"] }
contextra-testkit = { version = "0.1.0", path = "../contextra-testkit" }
trybuild = "1.0"

[target.'cfg(loom)'.dependencies]

[[bench]]
name = "checkpoint_bench"
harness = false

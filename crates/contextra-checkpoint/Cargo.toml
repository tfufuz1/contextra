[lints]
workspace = true

[package]
name = "contextra-checkpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Backup and snapshot management for Contextra storage"

[dependencies]
contextra-types = { version = "0.1.0", path = "../contextra-types" }
contextra-ports = { version = "0.1.0", path = "../contextra-ports" }
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
parking_lot = { workspace = true }
blake3 = { workspace = true }
futures-executor = "0.3"
dirs = "6.0.0"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
proptest = "1.4"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "checkpoint_bench"
harness = false

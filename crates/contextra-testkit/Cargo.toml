[lints]
workspace = true

[package]
name = "contextra-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Testhilfen: `FaultVfs`, Referenzmodell, deterministische Uhr, In-Memory-Ports."

[package.metadata.contextra]
ring = "tooling"

[features]
default = ["testkit"]
testkit = []

[dependencies]
contextra-ports = { workspace = true, features = ["testkit"] }
contextra-types = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "tk_fault_vfs_conformance"
path = "../../tests/tk_fault_vfs_conformance.rs"

[[bench]]
name = "bm_tk_fault_vfs"
harness = false
path = "../../benches/bm_tk_fault_vfs.rs"

[package]
name = "contextra-testkit"
version = "0.1.0"
edition = "2021"
authors = ["Contextra Team"]
description = "Deterministic test utilities, ManualClock, FaultVfs, InMemoryStorageEngine, ReferenceModel, and Erasure Harness."

[lints]
workspace = true

[features]
default = []
fault-injection = []

[dependencies]
contextra-ports = { workspace = true }
contextra-types = { workspace = true }
contextra-store = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

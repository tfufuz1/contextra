[lints]
workspace = true

[package]
name = "contextra-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic test utilities, ManualClock, InMemoryStorageEngine, and FaultVfs for Contextra"

[package.metadata.contextra]
ring = "tooling"

[features]
default = ["testkit", "erasure-conformance"]
testkit = []
erasure-conformance = []

[dependencies]
contextra-ports = { workspace = true, features = ["testkit"] }
contextra-types = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[bench]]
name = "testkit_bench"
harness = false

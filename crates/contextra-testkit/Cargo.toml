[package]
name = "contextra-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic test utilities, ManualClock, FaultVfs, InMemoryStorageEngine, ReferenceModel, and Erasure Harness."

[lints]
workspace = true

[package.metadata.contextra]
ring = "tooling"

[features]
default = ["fault-injection"]
fault-injection = []

[dependencies]
contextra-ports = { workspace = true }
contextra-sys = { workspace = true }
contextra-types = { workspace = true }
contextra-store = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

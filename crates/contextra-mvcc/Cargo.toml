[lints]
workspace = true

[package]
name = "contextra-mvcc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.89"
description = "Multi-Version Concurrency Control (MVCC), sequence log, and transaction buffer for Contextra"
readme = "README.md"
repository = "https://github.com/tfufuz1/contextra"
keywords = ["mvcc", "concurrency", "ssi", "transactions", "database"]
categories = ["database-implementations", "concurrency"]
# Internes Bausteinlager: Veröffentlichung in crates.io ist deaktiviert
publish = false

[package.metadata.contextra]
ring = "0"

[features]
default = ["workspace"]
workspace = ["dep:contextra-types", "dep:contextra-ports"]
types-compat = ["workspace"]
ports-compat = ["workspace"]
docid-128 = ["contextra-ids/docid-128"]

[dependencies]
contextra-ids = { version = "0.1.0", path = "../contextra-ids" }
contextra-env = { version = "0.1.0", path = "../contextra-env" }
contextra-types = { version = "0.1.0", path = "../contextra-types", optional = true }
contextra-ports = { version = "0.1.0", path = "../contextra-ports", optional = true }
parking_lot = { workspace = true }
ahash = { workspace = true }
serde = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
proptest = "1.4"
criterion = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
serde_json = { workspace = true }
bincode = { workspace = true }
loom = "0.7"
contextra-env = { version = "0.1.0", path = "../contextra-env", features = ["test-utils"] }
contextra-types = { version = "0.1.0", path = "../contextra-types" }
contextra-ports = { version = "0.1.0", path = "../contextra-ports" }

[[bench]]
name = "mvcc_bench"
harness = false

[[test]]
name = "ssi_write_skew"
path = "tests/ssi_write_skew.rs"

[[test]]
name = "ssi_determinism_proptest"
path = "tests/ssi_determinism_proptest.rs"

[[test]]
name = "visibility_proptest"
path = "tests/visibility_proptest.rs"

[[test]]
name = "loom_snapshot_registry"
path = "tests/loom_snapshot_registry.rs"

[[test]]
name = "campaign_cov_ssi_coarsening"
path = "tests/campaign_cov_ssi_coarsening.rs"

[[test]]
name = "campaign_cov_tx_buffer_reap"
path = "tests/campaign_cov_tx_buffer_reap.rs"

[[test]]
name = "isolation_tests"
path = "tests/isolation_tests.rs"

[[test]]
name = "loom_sequence_log"
path = "tests/loom_sequence_log.rs"

[[test]]
name = "loom_tx_buffer"
path = "tests/loom_tx_buffer.rs"

[[test]]
name = "golden_corpus"
path = "tests/golden_corpus.rs"

[[test]]
name = "tombstone_diff"
path = "tests/tombstone_diff.rs"

[lints]
workspace = true

[package]
name = "contextra-mvcc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Multi-Version Concurrency Control (MVCC), sequence log, and transaction buffer for Contextra"

[dependencies]
contextra-types = { workspace = true }
parking_lot = { workspace = true }
ahash = { workspace = true }
serde = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
proptest = "1.4"
criterion = { workspace = true }
loom = "0.7"

[[bench]]
name = "mvcc_bench"
harness = false

[[test]]
name = "ssi_write_skew"
path = "tests/ssi_write_skew.rs"

[[test]]
name = "ssi_determinism_proptest"
path = "tests/ssi_determinism_proptest.rs"

[[test]]
name = "visibility_proptest"
path = "tests/visibility_proptest.rs"

[[test]]
name = "loom_snapshot_registry"
path = "tests/loom_snapshot_registry.rs"

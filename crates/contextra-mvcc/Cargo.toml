path = "tests/mv_ssi_validation_test.rs"

[[test]]
name = "mv_audit_tests"
path = "tests/mv_audit_tests.rs"

[[test]]
name = "ssi_write_skew"
path = "tests/ssi_write_skew.rs"

[[test]]

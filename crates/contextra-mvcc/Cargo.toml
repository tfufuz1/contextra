path = "tests/ssi_determinism_proptest.rs"

[[test]]
name = "visibility_proptest"
path = "tests/visibility_proptest.rs"

[[test]]
name = "loom_snapshot_registry"
path = "tests/loom_snapshot_registry.rs"

[[test]]
name = "campaign_cov_ssi_coarsening"
path = "tests/campaign_cov_ssi_coarsening.rs"

[[test]]

[lints]
workspace = true

[package]
name = "memfuse-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MemFuse — Core storage, index, and transaction orchestrator engine"

[dependencies]
memfuse-sys = { workspace = true }
memfuse-core = { workspace = true }
bytes = { workspace = true }
memfuse-crypto = { workspace = true }
memfuse-store = { workspace = true }
blake3 = { workspace = true }
memfuse-vector = { workspace = true }
memfuse-text = { workspace = true }
memfuse-checkpoint = { workspace = true }
memfuse-graph = { workspace = true }
memfuse-rank = { workspace = true }
memfuse-adapt = { workspace = true }
ahash = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
tokio-util = { version = "0.7.18", features = ["rt"] }
zeroize = { version = "1", features = ["derive", "zeroize_derive"] }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
proptest = "1.4"
memfuse-vector = { workspace = true, features = ["experimental-diskann"] }

[features]
default = []
bench = []
sandbox = []
reranking = []
onnx = []
experimental-diskann = ["memfuse-vector/experimental-diskann"]
background-maintenance = []
graph-connectivity-health = ["memfuse-graph/physio-percolation"]
docid-128 = ["memfuse-core/docid-128"]
edge-reinforcement-learning = ["memfuse-graph/edge-reinforcement-learning"]
coherence-bonus-fusion = []
adaptive-candidate-pool-sizing = []

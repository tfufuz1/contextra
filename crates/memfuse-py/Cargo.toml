[package]
name = "memfuse-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Python bindings for MemFuse using PyO3"
# ADR-N04 (PHASE0-T3): FFI panic translation to PyErr and panic containment

[lib]
name = "_memfuse"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
pyo3 = { version = "0.24.1", features = ["extension-module", "abi3-py38", "multiple-pymethods"] }
numpy = "0.24"
tokio = { workspace = true }
# ANCHOR:ARCH:DAG-003 — Architektur-Layer durchbrochen (Ausnahme für Bindings)
# WP:NONE PRIO:2 NEEDS:NONE
# AGENT:06 DATE:2026-05-09 STATUS:DONE
# VERLETZUNG: memfuse-py importiert memfuse-db, memfuse-router und memfuse-calibration gegen die DAG-Invariante.
# RECHTFERTIGUNG: Als High-Level Python-Bridge (Layer 3) benötigt memfuse-py Zugriff
# auf die orchestrating Facade in memfuse-db sowie Routing- und Kalibrierungskomponenten. Dies ist eine beabsichtigte Ausnahme
# vom Sovereign Core DAG, da Bindings per Definition an der Grenze zum Nutzer stehen.
memfuse-router = { workspace = true }
memfuse-calibration = { workspace = true }
parking_lot = { workspace = true }
memfuse-core = { workspace = true }
memfuse-db = { workspace = true }
flatbuffers = { workspace = true }
serde_json = { workspace = true }
pythonize = "0.24"

[features]
default = []
docid-128 = ["memfuse-core/docid-128"]

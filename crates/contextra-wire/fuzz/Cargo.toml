[package]
name = "contextra-wire-fuzz" # <!-- crate-ref-ignore -->
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

# Local lint table replicating workspace lints for standalone fuzz workspace
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
await_holding_lock = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }
bytes = "1"
flatbuffers = "24"
contextra-wire = { path = ".." }

[[bin]]
name = "fuzz_flatbuffers_ipc"
path = "fuzz_targets/fuzz_flatbuffers_ipc.rs"
test = false
doc = false

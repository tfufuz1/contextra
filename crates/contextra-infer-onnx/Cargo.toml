[lints]
workspace = true

[package]
name = "contextra-infer-onnx"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.contextra]
ring = "2"

[dependencies]
contextra-types = { workspace = true }
contextra-ports = { workspace = true }
contextra-rank = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tracing = { workspace = true }
serde = { workspace = true }
parking_lot = { workspace = true }
contextra-infer-candle = { workspace = true, optional = true }

# Optional — nur mit Feature-Flag aktiv
[features]
default = []
reranking = ["dep:ort"]
onnx = ["dep:ort", "dep:tokenizers", "dep:ndarray", "dep:reqwest"]
candle-backend = ["dep:contextra-infer-candle"]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls", "stream"]
optional = true

[dependencies.ort]
version = "2.0.0-rc.12"
default-features = false
features = ["std", "download-binaries", "tls-rustls"]
optional = true

[dependencies.tokenizers]
version = "0.19"
optional = true

[dependencies.ndarray]
version = "0.15"
optional = true

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
criterion = { workspace = true }
proptest = "1.4"

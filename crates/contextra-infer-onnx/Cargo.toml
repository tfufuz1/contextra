[lints]
workspace = true

[package]
name = "contextra-infer-onnx"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
rust-version.workspace = true
description = "Autonomous in-process ONNX inference engine for embeddings and cross-encoder reranking (Klasse A, Ring 2)"

[package.metadata.contextra]
ring = "2"
klasse = "A"

[features]
default = []
std = []
serde = ["dep:serde", "dep:serde_json"]
tracing = ["dep:tracing"]
inspect = []
experimental = []
download = ["dep:reqwest"]
reranking = ["onnx"]
onnx = ["dep:ort", "dep:tokenizers", "dep:ndarray", "dep:sha2"]

[dependencies]
thiserror = { workspace = true }
parking_lot = { workspace = true }
blake3 = { workspace = true }
tracing = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls", "stream"]
optional = true

[dependencies.ort]
version = "2.0.0-rc.12"
default-features = false
features = ["std", "download-binaries", "tls-rustls"]
optional = true

[dependencies.tokenizers]
version = "0.19"
optional = true

[dependencies.ndarray]
version = "0.15"
optional = true

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
criterion = { workspace = true }
proptest = "1.4"

[[bench]]
name = "infer_bench"
harness = false

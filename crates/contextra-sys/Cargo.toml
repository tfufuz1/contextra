[package]
name = "contextra-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Einzige `unsafe`-Stelle für Betriebssystemaufrufe: `fsync`, `mlock`, Prozesshärtung."

[package.metadata.contextra]
ring = "1"

[dependencies]
libc = "0.2"
tracing = { workspace = true }

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3"
trybuild = "1.0"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
await_holding_lock = "deny"

[[test]]
name = "sy_audit_unsafe"
path = "tests/sy_audit_unsafe.rs"

[[test]]
name = "sy_audit_hygiene"
path = "tests/sy_audit_hygiene.rs"

[[test]]
name = "sy_platform_tests"
path = "tests/sy_platform_tests.rs"

[lints]
workspace = true

[package]
name = "memfuse-db"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MemFuse — Embedded hybrid-search for AI agents"

[dependencies]
memfuse-sys = { workspace = true }
memfuse-core = { workspace = true }
bytes = { workspace = true }
memfuse-crypto = { workspace = true }
memfuse-store = { workspace = true }
blake3 = { workspace = true }
memfuse-index = { workspace = true }
memfuse-text = { workspace = true }
memfuse-checkpoint = { workspace = true }
memfuse-graph = { workspace = true }
memfuse-calibration = { workspace = true }
ahash = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
tokio-util = { version = "0.7.18", features = ["rt"] }
zeroize = { version = "1", features = ["derive", "zeroize_derive"] }
thiserror = { workspace = true }


[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
proptest = "1.4"
memfuse-index = { workspace = true, features = ["experimental-diskann"] }

[features]
default = []
bench = []
sandbox = []
reranking = []
onnx = []
experimental-diskann = ["memfuse-index/experimental-diskann"]
background-maintenance = []
graph-connectivity-health = ["memfuse-graph/physio-percolation"]
coherence-bonus-fusion = []
adaptive-candidate-pool-sizing = []
volatile-vault = []
docid-128 = ["memfuse-core/docid-128"]

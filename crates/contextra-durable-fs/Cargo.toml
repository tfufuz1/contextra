[lints]
workspace = true

[package]
name = "contextra-durable-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Dateisystem-Implementierung `RealVfs` mit dauerhaften Schreib- und Austauschoperationen."

[package.metadata.contextra]
ring = "1"

[dependencies]
contextra-types = { workspace = true }
contextra-ports = { workspace = true }
contextra-sys = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
contextra-testkit = { workspace = true }
proptest = "1.6"
criterion = { workspace = true }
tempfile = { workspace = true }
trybuild = "1"

[[test]]
name = "df_probe_tests"
path = "tests/df_probe_tests.rs"

[[test]]
name = "df_arch_tests"
path = "tests/df_arch_tests.rs"

[[test]]
name = "recovery_aries_matrix"
path = "tests/recovery_aries_matrix.rs"

[[test]]
name = "df_atomic_crash_matrix"
path = "tests/df_atomic_crash_matrix.rs"

[[test]]
name = "df_lock_tests"
path = "tests/df_lock_tests.rs"

[[test]]
name = "df_scrub_tests"
path = "tests/df_scrub_tests.rs"

[[test]]
name = "durability_tests"
path = "tests/durability_tests.rs"

[[test]]
name = "basic"
path = "tests/basic.rs"

[[bench]]
name = "bm_dfs_probe"
harness = false
path = "benches/bm_dfs_probe.rs"

[[bench]]
name = "bm_dfs_atomic"
harness = false
path = "benches/bm_dfs_atomic.rs"

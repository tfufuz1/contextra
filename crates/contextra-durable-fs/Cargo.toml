[lints]
workspace = true

[package]
name = "contextra-durable-fs"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
rust-version = "1.89"
description = "Crash-sichere Dateisystem-Operationen und synchrones Disk-Flushing für Contextra"

[package.metadata.contextra]
ring = "0"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
crc32fast = { version = "1.3", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = "1.4"
criterion = { workspace = true }

[features]
default = ["std", "crc"]
std = []
crc = ["dep:crc32fast"]
serde = ["dep:serde"]
tracing = ["dep:tracing"]
inspect = []

[[bench]]
name = "fs_bench"
harness = false

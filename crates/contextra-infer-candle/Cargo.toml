[lints]
workspace = true

[package]
name = "contextra-infer-candle"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native Candle GGUF ML inference backend for Contextra"

[package.metadata.contextra]
ring = "2"

[dependencies]
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.21", optional = true }
bytes = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }
futures-util = "0.3"
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bincode = { workspace = true, optional = true }
half = { version = "2.4", optional = true }
contextra-types = { workspace = true }
contextra-ports = { workspace = true }
contextra-rank = { workspace = true }
contextra-crypto = { workspace = true, optional = true }
parking_lot = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = "1.4"
criterion = { workspace = true }
contextra-crypto = { workspace = true, features = ["kv-encryption"] }

[[bench]]
name = "kv_bridge_bench"
harness = false
required-features = ["kv-bridge"]

[features]
default = ["candle"]
candle = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:half"
]
kv-bridge = ["dep:contextra-crypto", "contextra-crypto/kv-encryption", "dep:bincode"]
kv-stage-b = ["dep:bincode"]
exp-kv-stage-b = ["kv-stage-b"]
exp-gasp = []
cuda = ["candle-core?/cuda", "candle-nn?/cuda", "candle-transformers?/cuda"]
test-utils = []

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }

# Golden-Test nutzt Fakes aus `fake.rs`, die nur mit Feature `test-utils` existieren.
[[test]]
name = "golden_test"
path = "tests/golden_test.rs"
required-features = ["test-utils"]

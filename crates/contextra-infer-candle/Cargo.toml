[lints]
workspace = true

[package]
name = "contextra-infer-candle"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native Candle GGUF ML inference backend for Contextra"

[package.metadata.contextra]
ring = "2"

[dependencies]
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.21", optional = true }
bytes = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }
serde = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
half = "2.4"
parking_lot = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = "1.4"
criterion = { workspace = true }

[features]
default = []
std = []
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:tokio", "dep:futures-util"]
cuda = ["candle", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle", "candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
serde = ["dep:serde"]
tracing = ["dep:tracing"]
experimental = []

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", optional = true, features = ["metal"] }
candle-nn = { version = "0.11", optional = true, features = ["metal"] }
candle-transformers = { version = "0.11", optional = true, features = ["metal"] }

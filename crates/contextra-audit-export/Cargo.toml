[lints]
workspace = true

[package]
name = "contextra-audit-export"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GDPR Article 30 Processing Register export generator for Contextra"

[package.metadata.contextra]
ring = "0"
klasse = "A"

[features]
default = ["std", "types-compat"]
std = ["serde/std"]
types-compat = ["dep:contextra-types"]

[dependencies]
contextra-types = { workspace = true, optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1.4"
criterion = "0.5"

[[bench]]
name = "audit_export_bench"
harness = false

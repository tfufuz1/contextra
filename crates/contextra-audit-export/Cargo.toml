[lints]
workspace = true

[package]
name = "contextra-audit-export"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GDPR Article 30 Processing Register export generator for Contextra"

[package.metadata.contextra]
ring = "0"
klasse = "A"

[features]
default = ["std", "workspace", "test-utils"]
std = ["serde/std"]
workspace = ["dep:contextra-types"]
types-compat = ["workspace"]
test-utils = []

[dependencies]
contextra-types = { workspace = true, optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1.4"
criterion = "0.5"

[[bench]]
name = "audit_export_bench"
harness = false
required-features = ["test-utils"]

[[example]]
name = "audit_export_standalone"
required-features = ["test-utils"]

[[test]]
name = "campaign_j27_compliance_test"
required-features = ["test-utils"]

[[test]]
name = "error_and_edge_cases"
required-features = ["test-utils"]

[[test]]
name = "golden_contract_test"
required-features = ["test-utils"]

[[test]]
name = "golden_file_test"
required-features = ["test-utils"]

[[test]]
name = "golden_generator"
required-features = ["test-utils"]

[[test]]
name = "register_rendering"
required-features = ["test-utils"]

[[test]]
name = "sanitization_tests"
required-features = ["test-utils"]

[[test]]
name = "validation_tests"
required-features = ["test-utils"]

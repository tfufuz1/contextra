[lints]
workspace = true

[package]
name = "contextra-db"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Contextra — Embedded hybrid-search for AI agents"

[package.metadata.contextra]
ring = "3"

[dependencies]
contextra-engine = { workspace = true }
contextra-sys = { workspace = true }
contextra-types = { workspace = true }
contextra-ports = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
ahash = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
tokio-util = { version = "0.7.18", features = ["rt"] }
zeroize = { version = "1", features = ["derive", "zeroize_derive"] }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
proptest = "1.4"
contextra-vector = { workspace = true, features = ["experimental-diskann"] }
contextra-testkit = { workspace = true }
contextra-store = { workspace = true }
contextra-graph = { workspace = true }
contextra-text = { workspace = true }
contextra-adapt = { workspace = true }
contextra-rank = { workspace = true }
contextra-checkpoint = { workspace = true }
contextra-cognition = { workspace = true }
contextra-sys = { workspace = true }
ed25519-dalek = "2"

[features]
default = []
bench = []
sandbox = ["contextra-engine/sandbox"]
reranking = []
onnx = ["contextra-engine/onnx"]
experimental-diskann = ["contextra-vector/experimental-diskann"]
background-maintenance = ["contextra-engine/background-maintenance"]
graph-connectivity-health = ["contextra-engine/graph-connectivity-health"]
coherence-bonus-fusion = []
adaptive-candidate-pool-sizing = ["contextra-engine/adaptive-candidate-pool-sizing"]
volatile-vault = []
edge-reinforcement-learning = []

[[example]]
name = "quickstart"

[[example]]
name = "hybrid_search"

[[test]]
name = "diskann_collection_fallback"
required-features = ["experimental-diskann"]

[[example]]
name = "collections"

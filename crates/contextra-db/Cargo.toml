[lints]
workspace = true

[package]
name = "contextra-db"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Contextra — Embedded hybrid-search for AI agents"

[package.metadata.contextra]
ring = "3"

[dependencies]
contextra-engine = { workspace = true }
contextra-sys = { workspace = true }
contextra-types = { workspace = true }
contextra-ports = { workspace = true }
bytes = { workspace = true }
contextra-crypto = { workspace = true }
contextra-store = { workspace = true }
blake3 = { workspace = true }
contextra-vector = { workspace = true }
contextra-text = { workspace = true }
contextra-checkpoint = { workspace = true }
contextra-rank = { workspace = true }
ahash = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
tokio-util = { version = "0.7.18", features = ["rt"] }
zeroize = { version = "1", features = ["derive", "zeroize_derive"] }
thiserror = { workspace = true }


[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
proptest = "1.4"
contextra-vector = { workspace = true }
ed25519-dalek = "2"

[features]
default = []
encryption-at-rest = ["contextra-engine/encryption-at-rest"]
bench = []
background-maintenance = ["contextra-engine/background-maintenance"]

[[bench]]
name = "migration_benchmarks"
path = "../../benches/migration_benchmarks.rs"
harness = false

[[bench]]
name = "scale_bench"
path = "../../benches/scale_bench.rs"
harness = false

[[bench]]
name = "rrf_scale_bench"
path = "../../benches/rrf_scale_bench.rs"
harness = false

[[bench]]
name = "competitive_bench"
path = "../../benches/competitive_bench.rs"
harness = false

[[bench]]
name = "relate_bench"
path = "../../benches/relate_bench.rs"
harness = false

[[example]]
name = "quickstart"

[[example]]
name = "hybrid_search"

[[example]]
name = "collections"

[[example]]
name = "verify_deletion_proof_external"

[lints]
workspace = true

[package]
name = "contextra-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CSR-Graph for entity-relation traversal and graph algorithms"

[package.metadata.contextra]
ring = "1"
klasse = "A"

[features]
default = [
    "workspace",
    "session-dag",
    "entity-extraction",
    "hyperedge-suggest",
    "experimental-graph",
]
workspace = ["dep:contextra-types", "dep:contextra-ports", "types-compat", "ports-compat"]
session-dag = []
entity-extraction = []
hyperedge-suggest = []
apprh-diffusion = []
k-path-diffusion = []
graph-connectivity-health = []
edge-reinforcement-learning = []
docid-128 = []
test-support = []

# Deprecated alias features retained until G-92
types-compat = ["dep:contextra-types", "dep:contextra-ports"]
ports-compat = ["dep:contextra-types", "dep:contextra-ports"]
experimental-graph = ["session-dag"]
physio-percolation = ["graph-connectivity-health"]
ppr-forward-push = []

[dependencies]
contextra-ids = { workspace = true }
contextra-env = { workspace = true }
contextra-types = { workspace = true, optional = true }
contextra-ports = { workspace = true, optional = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
ahash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
blake3 = { workspace = true }
arc-swap = "1.7"
scc = "2"
thiserror = { workspace = true }

[dev-dependencies]
contextra-graph = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
proptest = "1.4"
tracing-subscriber = { workspace = true }
futures = "0.3"
criterion = { workspace = true }

[[bench]]
name = "csr_traversal_bench"
harness = false

[[bench]]
name = "binary_edge_regression"
harness = false

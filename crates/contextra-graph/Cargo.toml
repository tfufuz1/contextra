[lints]
workspace = true

[package]
name = "contextra-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CSR-Graph for entity-relation traversal (Signal 3 in 4-Signal Fusion)"

[features]
default = []
docid-128 = ["contextra-types/docid-128", "contextra-store/docid-128"]
graph-connectivity-health = []
edge-reinforcement-learning = []
ppr-forward-push = []
k-path-diffusion = []

# Deprecated alias features for backward compatibility with contextra-db
physio-percolation = ["graph-connectivity-health"]
physio-synaptic-edges = ["edge-reinforcement-learning"]

[dependencies]
contextra-types = { workspace = true }
contextra-ports = { workspace = true }
contextra-adapt = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
ahash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
blake3 = { workspace = true }
arc-swap = "1.7"
scc = "2"
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
contextra-store = { workspace = true }
contextra-testkit = { workspace = true }
tempfile = { workspace = true }
proptest = "1.4"
tracing-subscriber = { workspace = true }
futures = "0.3"
criterion = { workspace = true }

[[bench]]
name = "csr_traversal_bench"
harness = false

[[bench]]
name = "binary_edge_regression"
harness = false

[lints]
workspace = true

[package]
name = "contextra-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CSR-Graph for entity-relation traversal (Signal 3 in 4-Signal Fusion)"

[package.metadata.contextra]
ring = "0"
klasse = "A"

[features]
default = ["std"]
std = []
inspect = []
experimental = []
types-compat = ["dep:contextra-types", "dep:contextra-ports"]
ports-compat = ["types-compat"]
docid-128 = []
graph-connectivity-health = []
edge-reinforcement-learning = []
# Retained for CI compatibility (.github/workflows/rust-ci.yml); PPR forward-push is baseline in ppr.rs
ppr-forward-push = []
k-path-diffusion = []
apprh-diffusion = []

# Deprecated alias features for backward compatibility with contextra-db
physio-percolation = ["graph-connectivity-health"]

[dependencies]
contextra-types = { workspace = true, optional = true }
contextra-ports = { workspace = true, optional = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true, optional = true }
ahash = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
bincode = { workspace = true }
blake3 = { workspace = true }
arc-swap = "1.7"
scc = "2"
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
proptest = "1.4"
tracing-subscriber = { workspace = true }
futures = "0.3"
criterion = { workspace = true }

[[bench]]
name = "csr_traversal_bench"
harness = false

[[bench]]
name = "binary_edge_regression"
harness = false

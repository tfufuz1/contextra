[crates.contextra-graph]
group = "retrieval"
level = 1
tier = "experimental"
path = "crates/contextra-graph"
unsafe_island = false
allowed_internal = []
transitional = ["workspace", "types-compat", "ports-compat"]

[crates.contextra-graph.feature_closure_allowed]
workspace = ["contextra-types", "contextra-ports"]

[crates.contextra-graph.dev_allowed]
testkit = ["contextra-testkit"]
test = "cargo test -p contextra-graph --locked"

[lints]
workspace = true

[package]
name = "contextra-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Python bindings for Contextra using PyO3"
# ADR-N04 (PHASE0-T3): FFI panic translation to PyErr and panic containment

[lib]
name = "_contextra"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
pyo3 = { version = "0.24.1", features = ["extension-module", "abi3-py38", "multiple-pymethods"] }
numpy = "0.24"
tokio = { workspace = true }
contextra-core = { workspace = true }
contextra-engine = { workspace = true }
flatbuffers = { workspace = true }
serde_json = { workspace = true }
pythonize = "0.24"

[features]
default = []
docid-128 = ["contextra-core/docid-128"]

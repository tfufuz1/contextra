[lints]
workspace = true

[package]
name = "contextra-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Python bindings for Contextra using PyO3"
# ADR-N04 (PHASE0-T3): FFI panic translation to PyErr and panic containment

[package.metadata.contextra]
ring = "4"

[lib]
name = "_contextra"
crate-type = ["cdylib", "rlib"]
test = true
doctest = false

[dependencies]
contextra-types = { workspace = true }
contextra = { workspace = true }
contextra-wire = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
flatbuffers = { workspace = true }
serde_json = { workspace = true }

# PyO3 optional dependencies (M5: Default ohne pyo3 / Schwergewichte)
pyo3 = { version = "0.24.1", features = ["extension-module", "abi3-py38", "multiple-pymethods"], optional = true }
numpy = { version = "0.24", optional = true }
pythonize = { version = "0.24", optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
pyo3 = ["dep:pyo3", "dep:numpy", "dep:pythonize"]
docid-128 = ["contextra-types/docid-128"]
test-hooks = []

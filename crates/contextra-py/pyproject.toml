[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "contextra"
version = "0.1.0"
description = "Embedded Hybrid-Search vector database"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Contextra Contributors" }
]
keywords = ["vector-database", "hybrid-search", "embeddings", "rag", "contextra", "pyo3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=1.20"
]

[project.urls]
Homepage = "https://github.com/tfufuz1/contextra"
Repository = "https://github.com/tfufuz1/contextra"
"Bug Tracker" = "https://github.com/tfufuz1/contextra/issues"

[project.optional-dependencies]
test = ["pytest", "numpy"]
mcp = [
    "mcp>=0.1.0",
    "fastmcp>=0.4.1"
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "contextra._contextra"
python-source = "python"

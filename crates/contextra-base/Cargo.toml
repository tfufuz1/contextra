[package]
name = "contextra-base"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
description = "Dependency-light vocabulary layer: secrets, key assurance, receipts, clock/entropy."

[dependencies]
zeroize = ">=1.7, <1.9"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

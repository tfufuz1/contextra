[lints]
workspace = true

[package]
name = "contextra-simd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Vektor-Distanzfunktionen (L2, Dot, Cosine) mit SIMD-Kernen und Skalar-Referenz."

[package.metadata.contextra]
ring = "0"
klasse = "A"

[features]
default = ["std"]
std = []
serde = ["dep:serde"]
types-compat = ["dep:contextra-types"]
simd-avx512 = []

[dependencies]
thiserror = { workspace = true }
bytemuck = "1.25"
tracing = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
contextra-types = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1.4"
criterion = "0.5"
simsimd = "6.5"

[[bench]]
name = "simd_bench"
harness = false

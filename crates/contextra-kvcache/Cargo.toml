[lints]
workspace = true

[package]
name = "contextra-kvcache"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Ring 1 Prefix-Radix tree, KV-Block cache, tenant-isolated memory store and tiering for Contextra"

[package.metadata.contextra]
ring = "1"

[dependencies]
contextra-types = { workspace = true }
contextra-ports = { workspace = true }
contextra-crypto = { workspace = true }
ahash = { workspace = true }
blake3 = { workspace = true }
lru = "0.16.4"
parking_lot = { workspace = true }
tracing = { workspace = true }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
bytes = { workspace = true }

[features]
default = []
content-addressed-kv-cache = []
kv-encryption = ["contextra-crypto/kv-encryption"]
kvcache-kivi-quant = []
kivi-quantization = []

[dev-dependencies]
contextra-kvcache = { path = ".", features = ["kivi-quantization", "kv-encryption"] }
tokio = { workspace = true, features = ["rt", "sync", "test-util"] }
proptest = "1.4"

[crates.contextra-kvcache]
group = "llm"
level = 1
tier = "beta"
path = "crates/contextra-kvcache"
unsafe_island = false
allowed_internal = ["contextra-env", "contextra-crypto"]
[crates.contextra-kvcache.feature_closure_allowed]
workspace = ["contextra-types", "contextra-ports"]
[crates.contextra-kvcache.dev_allowed]
test = "cargo test -p contextra-kvcache --locked"

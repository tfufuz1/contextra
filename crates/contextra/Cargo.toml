[package]
name = "contextra"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Contextra — Embedded hybrid-search for AI agents (Facade)"

[package.metadata.contextra]
ring = "4"

[dependencies]
contextra-core = { workspace = true }
contextra-types = { workspace = true }
contextra-ports = { workspace = true }
contextra-store = { workspace = true }
contextra-db = { workspace = true }
contextra-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["fast"]
fast = ["contextra-engine/fast"]

# Sicherheit
encryption-at-rest = ["contextra-db/encryption-at-rest"]

# Löschgarantie
erasure = ["contextra-store/erasure", "contextra-engine/erasure", "contextra-ports/backend-impl"]

# Format-Features
docid-128 = ["contextra-types/docid-128"]

# No-op Features für Workspace-Kompatibilität (aktivieren KEINE Parkplatz-Crates)
router = []
ollama = []
candle = []
onnx = []
privacy = []
sandbox = []
adapt = []
cognition = []
agent = []
graph = []
kvcache = []
license = []
sovereign = []

[lints]
workspace = true

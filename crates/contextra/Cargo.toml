[package]
name = "contextra"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Contextra — Embedded hybrid-search for AI agents (Facade)"

[package.metadata.contextra]
ring = "4"

[dependencies]
contextra-core = { workspace = true }
contextra-types = { workspace = true }
contextra-ports = { workspace = true }
contextra-license = { workspace = true }
contextra-store = { workspace = true }
contextra-db = { workspace = true }
contextra-crypto = { workspace = true, optional = true }
contextra-privacy = { workspace = true, optional = true }
contextra-audit-export = { workspace = true, optional = true }
contextra-avv-generator = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
contextra-infer-candle = { workspace = true, optional = true }
contextra-infer-ollama = { workspace = true, optional = true }
contextra-rank = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
contextra-license = { workspace = true, features = ["test-support"] }

[[bench]]
name = "competitive_bench"
path = "../../benches/competitive_bench.rs"
harness = false

[[bench]]
name = "migration_benchmarks"
path = "../../benches/migration_benchmarks.rs"
harness = false

[[bench]]
name = "relate_bench"
path = "../../benches/relate_bench.rs"
harness = false

[[bench]]
name = "rrf_scale_bench"
path = "../../benches/rrf_scale_bench.rs"
harness = false

[[bench]]
name = "scale_bench"
path = "../../benches/scale_bench.rs"
harness = false

[[example]]
name = "quickstart"
path = "../../examples/quickstart.rs"

[[example]]
name = "hybrid_search"
path = "../../examples/hybrid_search.rs"

[[example]]
name = "collections"
path = "../../examples/collections.rs"

[[example]]
name = "governance_fixtures"
path = "../../examples/governance_fixtures.rs"

[features]
default = ["fast"]
fast = []
erasure = ["contextra-store/erasure"]
encryption-at-rest = ["contextra-store/encryption-at-rest", "contextra-db/encryption-at-rest"]
docid-128 = ["contextra-types/docid-128"]
sovereign = ["contextra-crypto", "contextra-privacy"]
compliance = ["sovereign", "audit-export", "avv-generator"]
audit-export = ["dep:contextra-audit-export"]
avv-generator = ["dep:contextra-avv-generator"]
candle = ["contextra-infer-candle"]
ollama = ["contextra-infer-ollama"]

[lints]
workspace = true

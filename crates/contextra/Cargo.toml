[package]
name = "contextra"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Contextra — Embedded hybrid-search for AI agents (Facade)"

[package.metadata.contextra]
ring = "4"

[dependencies]
contextra-types = { workspace = true }
contextra-ports = { workspace = true }
contextra-db = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
contextra-infer-candle = { workspace = true, optional = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }

[dev-dependencies]
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
contextra-testkit = { workspace = true }

[features]
default = ["embedded"]
embedded = []
candle = ["contextra-infer-candle"]

[lints]
workspace = true

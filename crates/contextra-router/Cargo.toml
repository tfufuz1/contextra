[lints]
workspace = true

[package]
name = "contextra-router"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
bandit-routing = ["egress-sherman-morrison"]
cloud-egress-guard = []
egress-sherman-morrison = []
flow-corrected-thompson = ["contextra-adapt/flow-corrected-thompson"]

[dependencies]
shlex = "1"
contextra-types = { workspace = true }
contextra-wire = { workspace = true }
contextra-ports = { workspace = true }
contextra-adapt = { workspace = true }
contextra-privacy = { workspace = true }
arc-swap = "1"
parking_lot = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
contextra-db = { workspace = true }
contextra-index = { workspace = true }
bytes = { workspace = true }
contextra-graph = { workspace = true }
contextra-text = { workspace = true }
tempfile = "3"
proptest = "1.4"
criterion = { version = "0.5", features = ["async_tokio"] }
tracing-subscriber = { workspace = true }

[[bench]]
name = "router_bench"
harness = false

[[bench]]
name = "bandit_latency_gate"
harness = false

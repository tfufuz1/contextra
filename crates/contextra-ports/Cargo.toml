[lints]
workspace = true

[package]
name = "contextra-ports"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Canonical dyn-compatible port traits for Contextra subsystems"

[package.metadata.contextra]
ring = "0"

[features]
backend-impl = []
test-utils = []

[dependencies]
contextra-types = { workspace = true }
futures-util = "0.3"
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ahash = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
contextra-ports = { path = ".", features = ["test-utils", "backend-impl"] }
proptest = "1.4"
tokio = { workspace = true, features = ["rt", "macros"] }
trybuild = "1.0"

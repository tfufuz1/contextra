[lints]
workspace = true

[package]
name = "contextra-cognition"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Contextra — Memory consolidation, compaction, and context management"

[package.metadata.contextra]
ring = "3"

[dependencies]
contextra-types = { workspace = true }
contextra-ports = { workspace = true }
contextra-graph = { workspace = true }
contextra-rank = { workspace = true }
contextra-text = { workspace = true }
bytes = { workspace = true }
ahash = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
tokio-util = { version = "0.7.18", features = ["rt"] }
async-trait = "0.1"
thiserror = { workspace = true }
blake3 = { workspace = true }

[features]
default = []
graph-connectivity-health = ["contextra-graph/physio-percolation"]
edge-reinforcement-learning = ["contextra-graph/edge-reinforcement-learning"]

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
contextra-testkit = { workspace = true }
contextra-db = { workspace = true }

[lints]
workspace = true

[package]
name = "contextra-cognition"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Contextra — Memory consolidation, compaction, and context management"

[dependencies]
contextra-engine = { workspace = true }
contextra-types = { workspace = true }
contextra-ports = { workspace = true }
contextra-store = { workspace = true }
contextra-vector = { workspace = true }
contextra-graph = { workspace = true }
bytes = { workspace = true }
ahash = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
tokio-util = { version = "0.7.18", features = ["rt"] }
thiserror = { workspace = true }
blake3 = { workspace = true }

[features]
default = []
graph-connectivity-health = ["contextra-graph/physio-percolation", "contextra-engine/graph-connectivity-health"]
edge-reinforcement-learning = ["contextra-graph/edge-reinforcement-learning", "contextra-engine/edge-reinforcement-learning"]
docid-128 = ["contextra-types/docid-128", "contextra-engine/docid-128"]

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true

[package]
name = "contextra-infer-ollama"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.contextra]
ring = "2"

[features]
default = []
http = ["dep:reqwest", "dep:tokio", "dep:futures", "dep:futures-util"]
types-compat = ["ports-compat"]
ports-compat = ["dep:contextra-ports", "dep:contextra-types"]

[dependencies]
contextra-types = { workspace = true, optional = true }
contextra-ports = { workspace = true, optional = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
futures = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }
regex = { workspace = true }
quick-xml = "0.41"

[dev-dependencies]
proptest = "1.4"
tracing-test = "0.2"
tokio = { workspace = true, features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
futures-util = "0.3"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "ollama_bench"
harness = false

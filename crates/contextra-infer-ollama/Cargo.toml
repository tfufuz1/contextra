[lints]
workspace = true

[package]
name = "contextra-infer-ollama"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Autonomous REST/HTTP adapter for Ollama inference servers (Klasse A, Ring 2)"

[package.metadata.contextra]
ring = "2"
klasse = "A"

[features]
default = []
client = ["dep:reqwest", "dep:tokio", "dep:futures", "dep:futures-util"]
http = ["client"]
workspace = ["dep:contextra-types", "dep:contextra-ports"]
types-compat = ["workspace"]
ports-compat = ["workspace"]

[dependencies]
contextra-types = { version = "0.1.0", path = "../contextra-types", optional = true }
contextra-ports = { version = "0.1.0", path = "../contextra-ports", optional = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
regex = "1.13"
thiserror = { workspace = true }

# HTTP stack dependencies
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
tokio = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
contextra-types = { version = "0.1.0", path = "../contextra-types" }
contextra-ports = { version = "0.1.0", path = "../contextra-ports" }
quick-xml = "0.41"
proptest = "1.4"
tracing-test = "0.2"
criterion = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[[bench]]
name = "ollama_bench"
harness = false

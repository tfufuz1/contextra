[package]
name = "memfuse"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MemFuse — Embedded hybrid-search for AI agents (Facade)"

[dependencies]
memfuse-core = { workspace = true }
memfuse-db = { workspace = true }
memfuse-candle = { workspace = true, optional = true }
memfuse-ollama = { workspace = true, optional = true }
memfuse-embed = { workspace = true, optional = true }
memfuse-router = { workspace = true, optional = true }
tokio = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
onnx = ["memfuse-embed/onnx", "memfuse-db/onnx"]
candle = ["memfuse-candle"]
ollama = ["memfuse-ollama"]
router = ["memfuse-router"]

[lints]
workspace = true

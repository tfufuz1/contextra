[lints]
workspace = true

[package]
name = "contextra-rank"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "4-Signal Fusion, Isotonic & Platt Calibration, and Drift Detection for Contextra Cognitive OS"

[package.metadata.contextra]
ring = "0"
klasse = "A"

[features]
default = ["std", "types-compat"]
std = []
types-compat = ["dep:contextra-types", "dep:contextra-ports"]
dibud = []

[dependencies]
contextra-types = { workspace = true, optional = true }
contextra-ports = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
ahash = { version = "0.8", features = ["serde"] }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1"
criterion = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }

[[bench]]
name = "rank_bench"
harness = false

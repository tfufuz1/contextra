[lints]
workspace = true

[package]
name = "contextra-privacy"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
rust-version.workspace = true
description = "Cloud Egress Security, DLP and Exfiltration Protection for Contextra"
repository = "https://github.com/contextra/contextra"
readme = "README.md"
keywords = ["privacy", "dlp", "egress", "zeroize", "sanitization"]
categories = ["cryptography", "web-programming"]
publish = false
include = ["src/**/*", "tests/**/*", "benches/**/*", "examples/**/*", "Cargo.toml", "README.md", "LICENSE-*"]

[package.metadata.contextra]
level = 0
tier = "stable"

[features]
default = ["std"]
std = []
serde = []
tracing = []

[dependencies]
thiserror = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
rand = "0.8"
tracing = { workspace = true }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "time", "sync"] }
scc = "2"
blake3 = "1"
regex = "1"

[dev-dependencies]
bincode = "1.3"
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[[bench]]
name = "bench_privacy"
harness = false

[package]
name = "contextra-erasure-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Unabhaengige Verifikationsinstanz fuer Loeschberichte und Feldscans."

[package.metadata.contextra]
ring = "tooling"

[[bin]]
name = "contextra-erasure-verify"
path = "src/main.rs"

[dependencies]
contextra-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
sha2 = "0.10"
blake3 = { workspace = true }
zeroize = { version = "1.8", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rand = "0.8"

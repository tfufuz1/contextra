[lints]
workspace = true

[package]
name = "memfuse-mcp"
version.workspace = true
edition.workspace = true

[features]
default = []
agent-workflows = ["memfuse-agent"]
onnx = ["memfuse-infer-onnx", "memfuse-infer-onnx/onnx"]
candle = ["dep:memfuse-infer-candle"]
kv-bridge = ["memfuse-infer-candle/kv-bridge", "dep:memfuse-infer-candle"]
test-utils = ["memfuse-core/test-utils"]
docid-128 = ["memfuse-core/docid-128"]

[dependencies]
memfuse = { workspace = true, features = ["ollama", "router"] }
memfuse-core = { workspace = true }
memfuse-rank = { workspace = true }
memfuse-adapt = { workspace = true }
memfuse-crypto = { workspace = true }
memfuse-privacy = { workspace = true }
memfuse-adapt = { workspace = true }
memfuse-infer-onnx = { workspace = true, optional = true }
memfuse-agent = { workspace = true, optional = true }
memfuse-infer-candle = { workspace = true, optional = true }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
rand = { workspace = true }
parking_lot = { workspace = true }
scc = "2"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-normalization = "0.1"
# NO Axum — MCP transport is stdio only (ADR-010). Adding HTTP here is an architecture violation.
# MCP stdio transport helpers (already transitively present via tokio)
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"

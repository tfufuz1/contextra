[lints]
workspace = true

[package]
name = "contextra-erasure"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Löschkern: Löschkette (Saga), ReadGate, Tresor, Messung, Schichtschnittstelle."

[package.metadata.contextra]
ring = "0"

[features]
default = []

[dependencies]
contextra-ids = { workspace = true }
contextra-env = { workspace = true }
contextra-durable-fs = { workspace = true }
subtle = "2.6"
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
blake3 = "1.8"
sha2 = "0.10"
hmac = "0.12"
bytes = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
contextra-env = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }
proptest = "1.4"
loom = "0.7"
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }

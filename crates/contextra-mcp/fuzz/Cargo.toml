[package]
name = "contextra-mcp-fuzz" <!-- crate-ref-ignore -->
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }
serde_json = "1"
contextra-mcp = { path = ".." }

[[bin]]
name = "fuzz_prompt_injection_guard"
path = "fuzz_targets/fuzz_prompt_injection_guard.rs"
test = false
doc = false

[package]
name = "contextra-mcp-fuzz" # <!-- crate-ref-ignore -->
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

# Local lint table replicating workspace lints for standalone fuzz workspace
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
await_holding_lock = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }
serde_json = "1"
contextra-mcp = { path = ".." }

[[bin]]
name = "fuzz_prompt_injection_guard"
path = "fuzz_targets/fuzz_prompt_injection_guard.rs"
test = false
doc = false

[[bin]]
name = "fuzz_jsonrpc_parsing"
path = "fuzz_targets/fuzz_jsonrpc_parsing.rs"
test = false
doc = false

[lints]
workspace = true

[package]
name = "contextra-mcp"
version.workspace = true
edition.workspace = true

[package.metadata.contextra]
ring = "4"

[features]
default = []
candle = ["dep:contextra-infer-candle"]
test-utils = []

[dependencies]
contextra = { workspace = true }
contextra-types = { workspace = true }
contextra-ports = { workspace = true }
contextra-license = { workspace = true }
contextra-wire = { workspace = true }
contextra-rank = { workspace = true }
contextra-crypto = { workspace = true }
contextra-privacy = { workspace = true }
contextra-router = { workspace = true }
contextra-infer-candle = { workspace = true, optional = true }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
rand = { workspace = true }
parking_lot = { workspace = true }
scc = "2"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-normalization = "0.1"
# NO Axum — MCP transport is stdio only (ADR-010). Adding HTTP here is an architecture violation.
# MCP stdio transport helpers (already transitively present via tokio)
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"

[crates.contextra-mcp]
group = "apps"
level = 3
tier = "beta"
path = "crates/contextra-mcp"
unsafe_island = false
allowed_internal = [
    "contextra",
    "contextra-types",
    "contextra-ports",
    "contextra-wire",
    "contextra-rank",
    "contextra-crypto",
    "contextra-privacy",
    "contextra-router",
    "contextra-prompt-guard",
]
feature_closure_allowed = { candle = ["contextra-infer-candle"], ollama = ["contextra-infer-ollama"], onnx = ["contextra-infer-onnx"] }
dev_allowed = []
test = "cargo test -p contextra-mcp --locked"

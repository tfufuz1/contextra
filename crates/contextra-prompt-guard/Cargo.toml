[package]
name = "contextra-prompt-guard"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Signatur- und phrasenbasierte Prompt-Injection-Erkennung und Quarantäne-Policy"
repository = "https://github.com/contextra/contextra"
keywords = ["prompt-injection", "security", "guard", "filter", "heuristics"]
categories = ["algorithms", "text-processing"]
readme = "README.md"
rust-version = "1.89.0"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md"]
# Interner Baustein des Baukastens, kein Standalone-Crates.io-Publishing vorgesehen
publish = false

[features]
default = ["std"]
std = []
file-audit = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-normalization = "0.1"
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile = "3"

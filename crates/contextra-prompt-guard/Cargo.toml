[package]
name = "contextra-prompt-guard"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Signatur- und phrasenbasierte Prompt-Injection-Erkennung und Quarantäne-Policy"

[features]
default = ["std", "file-audit"]
std = []
file-audit = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-normalization = "0.1"
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile = "3"

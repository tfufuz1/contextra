[lints]
workspace = true

[package]
name = "contextra-text"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.89"
description = "Contextra — Text processing and BM25 search for Hybrid Search"

[package.metadata.contextra]
ring = "0"
klasse = "A"

[features]
default = ["std", "types-compat"]
std = []
serde = []
tracing = []
inspect = []
experimental = []
types-compat = ["dep:contextra-types", "dep:contextra-ports"]
ports-compat = ["types-compat"]
bm25f = []
docid-128 = []

[dependencies]
contextra-types = { workspace = true, optional = true }
contextra-ports = { workspace = true, optional = true }
bytes = { workspace = true }
itoa = "1.0"
regex = "1.10"
unicode-segmentation = "1.11.0"
bincode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
futures = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = { workspace = true }
proptest = "1.4"
criterion = { workspace = true }

[[bench]]
name = "text_bench"
harness = false

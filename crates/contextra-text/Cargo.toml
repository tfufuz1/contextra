[lints]
workspace = true

[package]
name = "contextra-text"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.89"
description = "Contextra — Text processing and BM25 search for Hybrid Search"

[package.metadata.contextra]
ring = "0"
klasse = "A"

[features]
default = ["std", "workspace"]
std = []
serde = []
tracing = []
inspect = []
experimental = []
workspace = ["dep:contextra-types", "dep:contextra-ports"]
types-compat = ["workspace"]
ports-compat = ["workspace"]
bm25f = []
docid-128 = []

[dependencies]
contextra-types = { version = "0.1.0", path = "../contextra-types", optional = true }
contextra-ports = { version = "0.1.0", path = "../contextra-ports", optional = true }
bytes = { workspace = true }
itoa = "1.0"
regex = "1.10"
unicode-segmentation = "1.11.0"
bincode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
futures = "0.3"

[dev-dependencies]
contextra-types = { version = "0.1.0", path = "../contextra-types" }
contextra-ports = { version = "0.1.0", path = "../contextra-ports" }
contextra-testkit = { version = "0.1.0", path = "../contextra-testkit" }
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = { workspace = true }
proptest = "1.4"
criterion = { workspace = true }

[[bench]]
name = "text_bench"
harness = false

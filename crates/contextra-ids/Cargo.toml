[package]
name = "contextra-ids"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
description = "Canonical identity and tenant types for the Contextra ecosystem"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"

[dev-dependencies]
bincode = "1.3.3"
serde_json = "1"
hex = "0.4"

[features]
default = ["std"]
std = ["blake3/std", "serde/std"]
docid-128 = []

[[test]]
name = "golden_tombstone_bit"

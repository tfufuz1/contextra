[lints]
workspace = true

[package]
name = "contextra-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Persistent agent workflow engine for Contextra — checkpoint/execute/audit loop"

[features]
default = []
test-utils = []

[dependencies]
contextra-types      = { workspace = true }
contextra-ports      = { workspace = true }
bytes = { workspace = true }
contextra-db         = { workspace = true }
contextra-graph      = { workspace = true }
contextra-checkpoint = { workspace = true }
contextra-store      = { workspace = true }
contextra-router     = { workspace = true }
serde              = { workspace = true, features = ["derive"] }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tokio              = { workspace = true, features = ["full"] }
tokio-util         = { version = "0.7.18", features = ["rt"] }

[dev-dependencies]
tempfile           = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
contextra-vector     = { workspace = true }
contextra-text       = { workspace = true }

[lints]
workspace = true

[package]
name = "memfuse-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deprecated Strangler Facade re-exporting Ring-0 types, traits, MVCC, and wire IPC for MemFuse"

[features]
test-utils = []
docid-128 = ["memfuse-types/docid-128"]

[dependencies]
memfuse-types = { workspace = true }
memfuse-ports = { workspace = true }
memfuse-mvcc = { workspace = true }
memfuse-wire = { workspace = true }

[dev-dependencies]
# Async runtime for executing async unit tests.
tokio = { workspace = true, features = ["rt", "macros"] }
# Property-based testing framework for invariant validation.
proptest = "1.4"

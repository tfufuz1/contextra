[crates.contextra-store]
group = "storage"
level = 1
tier = "beta"
path = "crates/contextra-store"
unsafe_island = false
allowed_internal = ["contextra-ids", "contextra-env", "contextra-sys", "contextra-mvcc", "contextra-crypto"]

[crates.contextra-store.feature_closure_allowed]
workspace = ["contextra-types", "contextra-ports"]

[crates.contextra-store.dev_allowed]
testkit = ["contextra-testkit"]
test = "cargo test -p contextra-store --locked"

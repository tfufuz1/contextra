[package]
name = "contextra-store-fuzz" # <!-- crate-ref-ignore -->
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

# Local lint table replicating workspace lints for standalone fuzz workspace
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
await_holding_lock = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
bytes = "1"
contextra-core = { path = "../../contextra-core" }
contextra-store = { path = ".." }

[[bin]]
name = "wal_roundtrip"
path = "fuzz_targets/wal_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "wal_mutation_chaos"
path = "fuzz_targets/wal_mutation_chaos.rs"
test = false
doc = false

[[bin]]
name = "fuzz_sstable_binary_search"
path = "fuzz_targets/fuzz_sstable_binary_search.rs"
test = false
doc = false

[[bin]]
name = "fuzz_manifest_load"
path = "fuzz_targets/fuzz_manifest_load.rs"
test = false
doc = false

[[bin]]
name = "fuzz_wal_replay"
path = "fuzz_targets/fuzz_wal_replay.rs"
test = false
doc = false

[[bin]]
name = "fuzz_memtable_concurrent"
path = "fuzz_targets/fuzz_memtable_concurrent.rs"
test = false
doc = false

[[bin]]
name = "fuzz_compaction_interleave"
path = "fuzz_targets/fuzz_compaction_interleave.rs"
test = false
doc = false

[[bin]]
name = "fuzz_recovery_arbitrary_state"
path = "fuzz_targets/fuzz_recovery_arbitrary_state.rs"
test = false
doc = false

[[bin]]
name = "witness_reader_sstable"
path = "fuzz_targets/witness_reader_sstable.rs"
test = false
doc = false

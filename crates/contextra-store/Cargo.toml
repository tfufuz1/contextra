[lints]
workspace = true

[package]
name = "contextra-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "LSM-Tree storage engine for Contextra"

[package.metadata.contextra]
ring = "1"

[features]
default = []
workspace = ["dep:contextra-types", "dep:contextra-ports"]
test-hooks = []
inspect = []
memory-only-storage = []
fault-injection = []
block-cache-v2 = ["dep:quick_cache"]
sieve-cache = []
docid-128 = ["contextra-ids/docid-128"]
legacy-wal-key = []

[dependencies]
contextra-ids = { workspace = true }
contextra-env = { workspace = true }
contextra-types = { workspace = true, optional = true }
contextra-ports = { workspace = true, optional = true }
contextra-sys = { workspace = true }
contextra-mvcc = { workspace = true }
ahash = { workspace = true }
quick_cache = { version = "0.6", optional = true }
contextra-crypto = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
crc32fast = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
memmap2 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

rand = { workspace = true }
lru = "0.16.3"


uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7.18", features = ["rt"] }


[dev-dependencies]
contextra-testkit = { workspace = true }
libc = "0.2"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1.4"
loom = "0.7"
futures = "0.3"
redb = "2"

[[test]]
name = "wal_key_lifecycle"
path = "tests/wal_key_lifecycle.rs"
required-features = ["test-hooks"]

[[test]]
name = "commit_core_batch_rollback"
path = "tests/commit_core_batch_rollback.rs"
required-features = ["test-hooks", "fault-injection"]

[[test]]
name = "commit_rollback_batch_scoped"
path = "tests/commit_rollback_batch_scoped.rs"
required-features = ["test-hooks", "fault-injection"]

[[test]]
name = "fault_injection_durability_points"
path = "tests/fault_injection_durability_points.rs"
required-features = ["test-hooks", "fault-injection"]

[[test]]
name = "group_commit_fault_injection"
path = "tests/group_commit_fault_injection.rs"
required-features = ["test-hooks", "fault-injection"]

[[test]]
name = "ssi_write_skew_integration"
path = "tests/ssi_write_skew_integration.rs"
required-features = ["test-hooks"]

[[test]]
name = "flush_recovery_lifecycle"
path = "tests/flush_recovery_lifecycle.rs"
required-features = ["test-hooks"]

[[test]]
name = "compaction_contiguous_selection"
path = "tests/compaction_contiguous_selection.rs"
required-features = ["test-hooks"]

[[test]]
name = "group_commit_overlapping_batch_rollback"
path = "tests/group_commit_overlapping_batch_rollback.rs"
required-features = ["test-hooks"]

[[test]]
name = "metrics_sink_test"
path = "tests/metrics_sink_test.rs"

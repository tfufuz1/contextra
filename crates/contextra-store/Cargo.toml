[lints]
workspace = true

[package]
name = "contextra-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "LSM-Tree storage engine for Contextra"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[features]
default = []
encryption-at-rest = ["dep:contextra-crypto"]
fault-injection = []
block-cache-v2 = ["dep:quick_cache"]
sieve-cache = []
docid-128 = ["contextra-core/docid-128"]

[dependencies]
contextra-sys = { workspace = true }
contextra-core = { workspace = true }
ahash = { workspace = true }
quick_cache = { version = "0.6", optional = true }
contextra-crypto = { workspace = true, optional = true }
bytes = { workspace = true }
blake3 = { workspace = true }
crc32fast = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
memmap2 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

rand = { workspace = true }
lru = "0.16.3"


uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7.18", features = ["rt"] }


[dev-dependencies]
contextra-testkit = { workspace = true }
libc = "0.2"
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1.4"
loom = "0.7"
futures = "0.3"
redb = "2"

[[test]]
name = "differential_redb"
path = "tests/differential/redb_operation_sequence.rs"

[[bench]]
name = "sstable_bench"
harness = false

[[bench]]
name = "memtable_bench"
harness = false

[[bench]]
name = "wal_bench"
harness = false

[[bench]]
name = "lsm_concurrency_bench"
harness = false

[[bench]]
name = "block_cache_bench"
harness = false

[lints]
workspace = true

[package]
name = "contextra-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "LSM-Tree storage engine for Contextra"

[package.metadata.contextra]
ring = "1"

[features]
default = []
# DEPRECATED no-op alias: E2-Konsumenten (contextra-db, -engine, -checkpoint) fordern es noch an.
# Entfernen zusammen mit der Migration dieser Crates.
workspace = []
test-hooks = []
inspect = []
memory-only-storage = []
fault-injection = []
block-cache-v2 = ["dep:quick_cache"]
sieve-cache = []
docid-128 = ["contextra-ids/docid-128"]
legacy-wal-key = []

[dependencies]
contextra-ids = { workspace = true }
contextra-env = { workspace = true }
contextra-sys = { workspace = true }
contextra-durable-fs = { workspace = true }
# The erasure-chain contract is an explicit cross-ring contract, not part of
# the store domain closure.
contextra-erasure = { workspace = true }
contextra-crypto = { workspace = true }
contextra-mvcc = { workspace = true }
ahash = { workspace = true }
quick_cache = { version = "0.6", optional = true }
bytes = { workspace = true }
blake3 = { workspace = true }
crc32fast = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
memmap2 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
lru = "0.16.3"
tokio-util = { version = "0.7.18", features = ["rt"] }

[dev-dependencies]
contextra-env = { workspace = true, features = ["test-utils"] }
libc = "0.2"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1.4"
loom = "0.7"
futures = "0.3"
redb = "2"

[[test]]
name = "wal_key_lifecycle"
path = "tests/wal_key_lifecycle.rs"
required-features = ["test-hooks"]

[[test]]
name = "no_test_hooks_in_release_api"
path = "tests/no_test_hooks_in_release_api.rs"
required-features = ["test-hooks"]

[[bench]]
name = "sstable_bench"
harness = false

[[bench]]
name = "memtable_bench"
harness = false

[[bench]]
name = "block_cache_bench"
harness = false

[lints]
workspace = true

[package]
name = "contextra-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "LSM-Speicher: WAL, Memtable, SSTables, Manifest, Kompaktion, Purge-Primitive."

[package.metadata.contextra]
ring = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[features]
default = []
test-hooks = []
test-utils = ["test-hooks"]
memory-only-storage = []
fault-injection = []
block-cache-v2 = ["dep:quick_cache"]
sieve-cache = []
docid-128 = ["contextra-types/docid-128"]

[dependencies]
contextra-types = { workspace = true }
contextra-ports = { workspace = true }
contextra-sys = { workspace = true }
contextra-mvcc = { workspace = true }
sha2 = "0.10"
hmac = "0.12"
aes-gcm-siv = "0.11"
hkdf = "0.12"
ahash = { workspace = true }
quick_cache = { version = "0.6", optional = true }
contextra-crypto = { workspace = true }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
bytes = { workspace = true }
blake3 = { workspace = true }
crc32fast = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

rand = { workspace = true }
lru = "0.16.3"


uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7.18", features = ["rt"] }


[dev-dependencies]
contextra-testmacros = { workspace = true }
contextra-store = { path = ".", features = ["test-hooks"] }
contextra-testkit = { workspace = true }
libc = "0.2"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1.4"
loom = "0.7"
futures = "0.3"
redb = "2"

[[test]]
name = "differential_redb"
path = "tests/differential/redb_operation_sequence.rs"

[[test]]
name = "wal_truncation_and_legacy_isolation"
path = "tests/wal_truncation_and_legacy_isolation.rs"

[[bench]]
name = "sstable_bench"
harness = false

[[bench]]
name = "memtable_bench"
harness = false

[[bench]]
name = "wal_bench"
harness = false

[[bench]]
name = "lsm_concurrency_bench"
harness = false

[[bench]]
name = "block_cache_bench"
harness = false

[[bench]]
name = "redb_comparative_bench"
harness = false

[[test]]
name = "spec_store_tests"
path = "tests/spec_store_tests.rs"

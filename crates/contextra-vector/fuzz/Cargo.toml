[package]
name = "contextra-vector-fuzz" # <!-- crate-ref-ignore -->
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

# Local lint table replicating workspace lints for standalone fuzz workspace
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
await_holding_lock = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
contextra-types = { path = "../../contextra-types" }
contextra-ports = { path = "../../contextra-ports" }
contextra-vector = { path = ".." }

[[bin]]
name = "hnsw_insert_search"
path = "fuzz_targets/hnsw_insert_search.rs"
test = false
doc = false

[[bin]]
name = "fuzz_hnsw_persistence"
path = "fuzz_targets/fuzz_hnsw_persistence.rs"
test = false
doc = false

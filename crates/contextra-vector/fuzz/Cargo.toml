[package]
name = "contextra-vector-fuzz" # <!-- crate-ref-ignore -->
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
contextra-types = { path = "../../contextra-types" }
contextra-ports = { path = "../../contextra-ports" }
contextra-mvcc = { path = "../../contextra-mvcc" }
contextra-vector = { path = "..", features = ["experimental-diskann"] }

[[bin]]
name = "hnsw_insert_search"
path = "fuzz_targets/hnsw_insert_search.rs"
test = false
doc = false

[[bin]]
name = "fuzz_hnsw_persistence"
path = "fuzz_targets/fuzz_hnsw_persistence.rs"
test = false
doc = false

[[bin]]
name = "fuzz_mmap_header"
path = "fuzz_targets/fuzz_mmap_header.rs"
test = false
doc = false

[[bin]]
name = "fuzz_diskann_formats"
path = "fuzz_targets/fuzz_diskann_formats.rs"
test = false
doc = false

[[bin]]
name = "fuzz_hnsw_header_versions"
path = "fuzz_targets/fuzz_hnsw_header_versions.rs"
test = false
doc = false

[[bin]]
name = "fuzz_sq8_quantizer"
path = "fuzz_targets/fuzz_sq8_quantizer.rs"
test = false
doc = false

[package]
name = "contextra-vector"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HNSW vector search and quantization algorithms"

[package.metadata.contextra]
ring = "0"

[dependencies]
contextra-types = { workspace = true }
contextra-simd = { workspace = true }
contextra-sys = { workspace = true }
contextra-crypto = { workspace = true }
thiserror = { workspace = true }
ahash = { workspace = true }
parking_lot = { workspace = true }
roaring = { workspace = true }
tracing = { workspace = true }
memmap2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[features]
default = []
docid-128 = ["contextra-types/docid-128"]
experimental-rabitq = []
experimental-predicate-augmented-search = []
graph = []
partial-index-rebuild = []

[dev-dependencies]
tempfile = { workspace = true }
rand = { workspace = true }

[lints]
workspace = true

path = "fuzz_targets/fuzz_sheets.rs"

[[bin]]
name = "fuzz_odf"
path = "fuzz_targets/fuzz_odf.rs"

[[bin]]
name = "fuzz_pdf"
path = "fuzz_targets/fuzz_pdf.rs"

[[bin]]
name = "fuzz_ole"
path = "fuzz_targets/fuzz_ole.rs"

[[bin]]
name = "fuzz_email"
path = "fuzz_targets/fuzz_email.rs"

[[bin]]
name = "fuzz_structured"

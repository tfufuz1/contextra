[package]
name = "contextra-adapt"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Adaptive controllers, bandits, and PID regulators for Contextra"

[package.metadata.contextra]
ring = "0"

[dependencies]
blake3 = { workspace = true }
contextra-ports = { workspace = true }
contextra-sys = { workspace = true }
contextra-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
default = ["bandit-routing"]
bandit-routing = ["drift-bridge", "off-policy-eval"]
drift-bridge = []
off-policy-eval = []
egress-sherman-morrison = ["bandit-routing"]
flow-corrected-thompson = ["bandit-routing"]
rie-greedy-personalization = []

[dev-dependencies]
criterion = { workspace = true }
proptest = "1.4"

[[bench]]
name = "pool_controller_bench"
harness = false

[[test]]
name = "fc_ts_off_policy_positivity"
required-features = ["flow-corrected-thompson"]

[lints]
workspace = true

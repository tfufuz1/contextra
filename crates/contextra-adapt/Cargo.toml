[package]
name = "contextra-adapt"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Adaptive controllers, bandits, and PID regulators for Contextra"

[package.metadata.contextra]
ring = "0"
klasse = "A"

[dependencies]
ahash = { workspace = true }
blake3 = { workspace = true }
contextra-ports = { workspace = true, optional = true }
contextra-types = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
default = ["bandit-routing", "flow-corrected-thompson", "types-compat", "ports-compat"]
bandit-routing = []
flow-corrected-thompson = ["bandit-routing"]
sketched-bandit = ["bandit-routing"]
rie-greedy-personalization = []
types-compat = ["dep:contextra-types"]
ports-compat = ["dep:contextra-ports"]

[dev-dependencies]
criterion = { workspace = true }
proptest = "1.4"

[[bench]]
name = "adapt_bench"
harness = false

[lints]
workspace = true

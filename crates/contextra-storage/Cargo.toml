[package]
name = "contextra-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Embedded, crash-safe key-value core for contextra"

[lints]
workspace = true

[features]
# Kein Standard-Feature: Testhaken gehören nicht in die Release-API (S-9, SPEC §3.4).
# Tests aktivieren `testing` über die Dev-Abhängigkeit auf sich selbst.
testing = ["dep:blake3", "dep:aes-gcm-siv"]

[dependencies]
contextra-ports = { workspace = true }
# Nur für das Feature testing (Testdoubles in src/testing/refimpl.rs).
blake3 = { workspace = true, optional = true }
aes-gcm-siv = { version = "0.11", optional = true }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
contextra-storage = { path = ".", features = ["testing"] }
proptest = "1.4"
loom = "0.7"

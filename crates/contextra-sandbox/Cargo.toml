[lints]
workspace = true

[package]
name = "contextra-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM Execution Boundary for Contextra MCP CodeExecution Permission"

[package.metadata.contextra]
ring = "2"

[features]
unverified-execute = []

[dependencies]
wasmtime = { version = "25", default-features = false, features = ["async", "cranelift"] }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
anyhow = "1"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
wat = "1"

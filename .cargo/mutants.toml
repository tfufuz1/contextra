# Configuration for cargo-mutants

exclude_globs = [
    "**/tests/**",
    "**/tests.rs",
    "**/*_test.rs",
    "**/test_*.rs",
    "**/benches/**",
    "**/fuzz/**",
    "**/*_generated.rs",
]

copy_target = true
output = "target"

additional_cargo_test_args = [
    "--",
    "--skip",
    "max_boundary",
]

timeout_multiplier = 3.0
